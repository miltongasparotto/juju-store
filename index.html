/**
 * Lojinha — v1.9.0
 * Atualizado: 2026-05-23
 *
 * Changelog:
 * v1.9.0 — Correções e melhorias de UX:
 *   - Backup: botões de confirmação disponíveis imediatamente (não apenas após o timer)
 *   - Produtos: foto com opção de câmera (traseira) ou galeria ao adicionar produto
 *   - Câmera do produto: câmera traseira por padrão, botão 🔄 para trocar
 *   - Câmera do cliente: mantida câmera frontal com botão 🔄 para trocar para traseira
 *   - Estoque: botão de edição (✏️) para renomear variações existentes
 *   - Busca global: clicar no resultado abre a aba e filtra o item clicado
 *   - Data de nascimento: campo de digitação (DD/MM/AAAA) em vez de calendário
 *   - Desconto "Total do produto": label e placeholder alterados para "valor do desconto"
 *   - Revisão geral: correção de cálculo de desconto total_do_produto
 * v1.8.0 — Melhorias de produto:
 *   - Validação de estoque ao finalizar venda (bloqueia se qtd insuficiente)
 *   - Alerta visual por item com estoque insuficiente no checkout
 *   - Backup/Restauração de dados: exporta JSON completo (produtos, clientes, vendas)
 *   - Importação de backup com validação e preview dos dados
 *   - Busca global: pesquisa simultânea em produtos, clientes e vendas
 *   - Resultados da busca com atalhos diretos para cada aba
 * v1.7.0 — Correções e otimizações mobile:
 *   - confirm() substituído por ConfirmModal interno (funciona em iframes/artifacts)
 *   - Tooltip popup: width responsivo com max-width e padding lateral seguro
 *   - Celebration modal: width 100% com padding interno correto
 *   - Nav bottom: padding safe-area para iPhone com home bar (env)
 *   - Câmera: verifica isSecureContext antes de abrir getUserMedia
 *   - Gráfico SVG: labels X espaçados automaticamente (evita sobreposição)
 *   - Modais de confirmação centralizados e nunca cortados na tela
 * v1.6.0 — Relatórios aprimorados:
 *   - Filtro de período: Hoje / Esta Semana / Este Mês / Período manual (início e fim)
 *   - Gráfico de crescimento SVG com linhas de Receita, Custos e Lucro
 *   - Linhas do gráfico ativáveis/desativáveis individualmente
 *   - Navegação por períodos anteriores (dia, semana, mês)
 *   - Todos os cards de métricas filtrados pelo período selecionado
 * v1.5.0 — Dashboard reformulada:
 *   - Clientes devendo (vendas fiado pendentes) com valor total
 *   - Aniversariantes da semana (próximos 7 dias)
 *   - Estoque baixo inclui variações individuais (≤3 unidades)
 *   - Vendas de hoje: apenas contador, sem valor total
 *   - Últimas vendas: cliente, itens e valor em lista detalhada
 *   - "Dica do Dia" renomeada para "Aprenda o Vocabulário do Negócio"
 * v1.4.0 — Foto por variação de produto:
 *   - Cada variação pode ter sua própria foto (quadrada, crop automático)
 *   - Galeria de fotos das variações exibida no card do produto
 *   - Foto da variação selecionada aparece no checkout de vendas
 *   - Variações sem foto herdam a foto geral do produto
 * v1.3.0 — Melhorias na aba de Clientes:
 *   - Foto de perfil circular com câmera ao vivo ou galeria
 *   - Data de nascimento com badge de aniversário (hoje / este mês)
 *   - Banner de aniversariantes do dia no topo da lista
 *   - Email removido do formulário
 *   - Borda verde/vermelha no avatar: verde = sem fiado, vermelho = fiado pendente
 *   - Histórico de compras exibe forma de pagamento com ícone
 *   - Vendas fiado destacadas: pendente (vermelho) e quitado (verde)
 *   - Botão "Marcar como recebido" em cada fiado pendente
 *   - Modal de recebimento: escolha do método (Dinheiro, Pix ou Cartão)
 * v1.2.0 — Validações na aba de Vendas:
 *   - Fiado bloqueado sem cliente cadastrado; volta p/ Dinheiro ao desselecionar
 *   - Variação obrigatória em produtos com variações (bloqueia "Adicionar item")
 * v1.1.0 — Melhorias na aba de Vendas:
 *   - Produto duplicado soma quantidade ao item existente no checkout
 *   - Controles +/− de quantidade diretamente nos itens do checkout
 *   - Filtros de período: Todas / Hoje / 7 dias / 30 dias
 * v1.0.0 — Aba de Vendas reformulada:
 *   - Cartão removido das formas de pagamento
 *   - Foto do produto exibida na seleção do checkout
 *   - Desconto por peça com 3 modos: % unitário, novo valor unit., total do item
 *   - Desconto na compra total (% ou R$) separado do desconto por item
 */

const useStorage = (key, init) => {
  const [v, sv] = useState(() => { try { return JSON.parse(localStorage.getItem(key)) ?? init; } catch { return init; } });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(v)); }, [key, v]);
  return [v, sv];
};

/* ─── Confetti ────────────────────────────────────────────────────────────── */
const CC = ["#F472B6","#FB923C","#FBBF24","#34D399","#60A5FA","#A78BFA","#F9A8D4"];
const Confetti = () => {
  const p = useRef(Array.from({length:50},(_,i)=>({
    id:i, color:CC[i%CC.length], left:Math.random()*100,
    delay:Math.random()*1.1, size:7+Math.random()*7,
    dur:2.2+Math.random()*1.3, circle:Math.random()>.5,
  }))).current;
  return (
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:9999,overflow:"hidden"}}>
      {p.map(x=>(
        <div key={x.id} style={{position:"absolute",top:-20,left:`${x.left}%`,
          width:x.size,height:x.size,background:x.color,
          borderRadius:x.circle?"50%":2,
          animation:`confettiFall ${x.dur}s ease-in ${x.delay}s forwards`}}/>
      ))}
    </div>
  );
};

/* ─── Celebration ─────────────────────────────────────────────────────────── */
const Celebration = ({data,onClose}) => {
  useEffect(()=>{if(!data)return;const t=setTimeout(onClose,4200);return()=>clearTimeout(t);},[data,onClose]);
  if(!data) return null;
  return (
    <>
      <Confetti/>
      <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:9998,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
        <div onClick={e=>e.stopPropagation()} style={{background:C.white,borderRadius:28,padding:"28px 22px",textAlign:"center",width:"100%",maxWidth:320,animation:"popIn .5s cubic-bezier(.34,1.56,.64,1) forwards",boxShadow:"0 20px 60px rgba(244,114,182,.4)"}}>
          <div style={{fontSize:58,animation:"float 2s ease-in-out infinite",lineHeight:1.2}}>{data.emoji}</div>
          <h2 style={{fontSize:20,fontWeight:900,color:C.pinkD,margin:"10px 0 6px"}}>{data.title}</h2>
          <p style={{color:C.gray,fontSize:14,margin:0,lineHeight:1.5}}>{data.message}</p>
          {data.tip&&<div style={{background:C.pinkL,borderRadius:14,padding:"10px 13px",marginTop:12}}><p style={{color:C.pinkD,fontSize:13,margin:0,fontWeight:600,lineHeight:1.5}}>💡 {data.tip}</p></div>}
          <button onClick={onClose} className="tap" style={{marginTop:18,background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,color:C.white,border:"none",borderRadius:50,padding:"10px 28px",fontFamily:"inherit",fontWeight:700,fontSize:14,cursor:"pointer"}}>Arrasou! 🎉</button>
        </div>
      </div>
    </>
  );
};

/* ─── Tooltip ─────────────────────────────────────────────────────────────── */
const Tip = ({children,title,text,color=C.purple}) => {
  const [open,setOpen] = useState(false);
  return (
    <>
      <span onClick={()=>setOpen(o=>!o)} className="pulse tap" style={{display:"inline-flex",alignItems:"center",gap:4,color,fontWeight:700,fontSize:12,cursor:"pointer",background:color+"18",borderRadius:20,padding:"3px 10px 3px 7px",userSelect:"none"}}>
        <Icon name="bulb" size={13} color={color}/>{children}
      </span>
      {open&&(
        <div style={{position:"fixed",inset:0,zIndex:9000,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 20px",background:"rgba(0,0,0,.45)"}} onClick={()=>setOpen(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.white,border:`2px solid ${color}28`,borderRadius:18,padding:"20px 18px",width:"100%",maxWidth:320,boxShadow:"0 12px 40px rgba(0,0,0,.22)",animation:"tooltipPop .2s ease forwards"}}>
            <div style={{fontSize:14,fontWeight:800,color,marginBottom:8}}>{title}</div>
            <div style={{fontSize:13,color:C.text,lineHeight:1.65}}>{text}</div>
            <button onClick={()=>setOpen(false)} style={{marginTop:14,background:color+"20",color,border:"none",borderRadius:20,padding:"8px 20px",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",display:"block",marginLeft:"auto"}}>Entendi ✓</button>
          </div>
        </div>
      )}
    </>
  );
};

/* ─── Image Picker — quadrado com crop automático + câmera ou galeria ───────── */
const ImagePicker = ({value,onChange}) => {
  const fileRef = useRef();
  const videoRef = useRef();
  const canvasRef = useRef();
  const [camOpen, setCamOpen] = useState(false);
  const [stream, setStream] = useState(null);
  const [facingMode, setFacingMode] = useState("environment"); // traseira por padrão

  const cropToSquare = (file) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.width, img.height);
        const canvas = document.createElement("canvas");
        canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext("2d");
        const ox = (img.width - size) / 2;
        const oy = (img.height - size) / 2;
        ctx.drawImage(img, ox, oy, size, size, 0, 0, 300, 300);
        onChange(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const openCam = async (facing="environment") => {
    if(!window.isSecureContext&&!window.location.hostname.includes('localhost')){
      alert("A câmera requer conexão segura (HTTPS). Use a galeria para adicionar foto."); return;
    }
    if(!navigator.mediaDevices?.getUserMedia){ alert("Câmera não disponível neste dispositivo. Use a galeria."); return; }
    try {
      stream?.getTracks().forEach(t=>t.stop());
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:600},height:{ideal:600}}});
      setStream(s); setFacingMode(facing); setCamOpen(true);
      setTimeout(()=>{ if(videoRef.current){ videoRef.current.srcObject=s; videoRef.current.play(); } }, 100);
    } catch(err) { alert("Não foi possível acessar a câmera. Verifique as permissões do navegador ou use a galeria."); }
  };

  const switchCam = async () => {
    const novoMode = facingMode==="environment"?"user":"environment";
    await openCam(novoMode);
  };

  const closeCam = () => {
    stream?.getTracks().forEach(t=>t.stop());
    setStream(null); setCamOpen(false);
  };

  const snap = () => {
    const v = videoRef.current, c = canvasRef.current;
    if(!v||!c) return;
    const size = Math.min(v.videoWidth, v.videoHeight);
    c.width = 300; c.height = 300;
    const ctx = c.getContext("2d");
    ctx.drawImage(v, (v.videoWidth-size)/2, (v.videoHeight-size)/2, size, size, 0, 0, 300, 300);
    onChange(c.toDataURL("image/jpeg", 0.82));
    closeCam();
  };

  return (
    <div>
      <SL>Foto do Produto</SL>
      {value ? (
        <div style={{position:"relative",width:"100%",aspectRatio:"1/1",borderRadius:16,overflow:"hidden"}}>
          <img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
          <button onClick={()=>onChange("")} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.55)",border:"none",borderRadius:50,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0}}>
            <Icon name="x" size={13} color="#fff"/>
          </button>
        </div>
      ) : (
        <>
          <div style={{width:"100%",aspectRatio:"1/1",borderRadius:16,border:`2px dashed ${C.pinkM}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.pinkL,gap:10}}>
            <Icon name="camera" color={C.pink} size={28}/>
            <span style={{fontSize:12,color:C.soft,fontWeight:600}}>Escolha como adicionar a foto</span>
          </div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button onClick={()=>openCam("environment")} className="tap" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:C.pinkS,border:"none",borderRadius:12,padding:"10px 8px",fontFamily:"inherit",fontWeight:700,fontSize:13,color:C.pinkD,cursor:"pointer"}}>
              <Icon name="camera" size={14} color={C.pinkD}/>📸 Câmera
            </button>
            <button onClick={()=>fileRef.current.click()} className="tap" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#EEF2FF",border:"none",borderRadius:12,padding:"10px 8px",fontFamily:"inherit",fontWeight:700,fontSize:13,color:C.purple,cursor:"pointer"}}>
              📁 Galeria
            </button>
          </div>
        </>
      )}
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)cropToSquare(f); e.target.value="";}}/>
      <canvas ref={canvasRef} style={{display:"none"}}/>

      {camOpen&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:20}}>
          <div style={{color:C.white,fontSize:15,fontWeight:700}}>📦 Foto do produto</div>
          <div style={{position:"relative",width:280,height:280,borderRadius:16,overflow:"hidden",border:`3px solid ${C.pink}`,boxShadow:`0 0 0 6px ${C.pink}44`}}>
            <video ref={videoRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",transform:facingMode==="user"?"scaleX(-1)":"none"}}/>
          </div>
          <div style={{display:"flex",gap:16,alignItems:"center"}}>
            <button onClick={switchCam} className="tap" title="Trocar câmera" style={{width:44,height:44,borderRadius:"50%",background:"rgba(255,255,255,.18)",border:"2px solid rgba(255,255,255,.4)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",alignSelf:"center"}}>
              <span style={{fontSize:20}}>🔄</span>
            </button>
            <button onClick={snap} className="tap" style={{width:68,height:68,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,border:`4px solid ${C.white}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(244,114,182,.5)"}}>
              <Icon name="camera" size={26} color={C.white}/>
            </button>
            <button onClick={closeCam} className="tap" style={{width:44,height:44,borderRadius:"50%",background:"rgba(255,255,255,.15)",border:"2px solid rgba(255,255,255,.4)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",alignSelf:"center"}}>
              <Icon name="x" size={18} color={C.white}/>
            </button>
          </div>
          <div style={{color:"rgba(255,255,255,.5)",fontSize:11}}>Câmera {facingMode==="environment"?"traseira":"frontal"} · 🔄 trocar câmera</div>
        </div>
      )}
    </div>
  );
};

/* ─── Precificação ────────────────────────────────────────────────────────── */
const PrecBox = ({custo,venda}) => {
  const c=Number(custo), v=Number(venda);
  if(!c||!v||c<=0||v<=0) return null;
  const ganho = v-c;
  const sobrecusto = ((ganho/c)*100).toFixed(0);
  const n = Number(sobrecusto);
  const color = n<0?C.red:n<30?C.red:n<80?C.amber:C.green;
  const label = n<0?"Vendendo no prejuízo! ❌":n<30?"Ganho baixo ⚠️":n<80?"Ganho bom 👍":"Ótimo ganho! 🎉";
  return (
    <div style={{background:color+"0F",border:`1.5px solid ${color}28`,borderRadius:14,padding:"12px 13px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
        <span style={{fontSize:12,fontWeight:700,color}}>{label}</span>
        <span style={{fontSize:18,fontWeight:900,color}}>+{sobrecusto}%</span>
      </div>
      <div style={{height:7,background:color+"28",borderRadius:99,overflow:"hidden",marginBottom:9}}>
        <div style={{height:"100%",width:`${Math.min(100,Math.max(0,n/2))}%`,background:color,borderRadius:99,transition:"width .5s ease"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,textAlign:"center"}}>
        {[{l:"Você pagou",val:fmt(c),s:"custo"},{l:"Vai cobrar",val:fmt(v),s:"preço"},{l:"Seu ganho",val:fmt(ganho),s:"por unidade",bold:true,color}].map(r=>(
          <div key={r.l} style={{background:C.white,borderRadius:10,padding:"6px 4px"}}>
            <div style={{fontSize:12,fontWeight:r.bold?900:700,color:r.color||C.text}}>{r.val}</div>
            <div style={{fontSize:10,color:C.soft,marginTop:1}}>{r.s}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:C.gray,marginTop:8,lineHeight:1.4}}>
        💡 <b>Ganho sobre custo</b>: quanto % você ganha em relação ao que pagou.
      </div>
    </div>
  );
};

  const [novaQtd,setNovaQtd] = useState("1");

  const [editandoNome,setEditandoNome] = useState("");
  const vars = form.variacoes||[];
  const totalVars = vars.reduce((s,v)=>s+Number(v.qtd||0),0);

  const addVar = () => {
    if(!novaVar.trim()) return;
    const ex = vars.find(v=>v.nome.toLowerCase()===novaVar.trim().toLowerCase());
    if(ex){
      setForm(f=>({...f,variacoes:f.variacoes.map(v=>v.id===ex.id?{...v,qtd:Number(v.qtd)+Number(novaQtd||1)}:v)}));
    } else {
      setForm(f=>({...f,variacoes:[...(f.variacoes||[]),{id:uid(),nome:novaVar.trim(),qtd:Number(novaQtd||1),foto:""}]}));
    }
    setNovaVar(""); setNovaQtd("1");
  };

  const iniciarEdicao = (v) => { setEditandoId(v.id); setEditandoNome(v.nome); };
  const salvarEdicao = () => {
    if(!editandoNome.trim()) return;
    setForm(f=>({...f,variacoes:f.variacoes.map(v=>v.id===editandoId?{...v,nome:editandoNome.trim()}:v)}));
    setEditandoId(null); setEditandoNome("");
  };

  return (
    <div style={{background:C.pinkL,borderRadius:16,padding:13,display:"flex",flexDirection:"column",gap:11}}>
      <SL right={<Tip title="Variações de estoque" text="Adicione cada variação (cor, tamanho) com sua quantidade e foto própria. Ideal para cores diferentes! O total é calculado automaticamente." color={C.pinkD}>Como funciona?</Tip>}>📦 Estoque</SL>

      {/* Total calculado automaticamente das variações */}
      {vars.length===0?(
        <FInput label="Quantidade em estoque" value={form.estoqueTotal||""} onChange={v=>setForm(f=>({...f,estoqueTotal:v}))} type="number" min="0" placeholder="Ex: 50"/>
      ):(
        <div style={{background:C.white,borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:C.gray,fontWeight:600}}>Total calculado</span>
          <span style={{fontSize:20,fontWeight:900,color:totalVars>0?C.green:C.red}}>{totalVars} un.</span>
        </div>
      )}

      {vars.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
            <span style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase"}}>Variações adicionadas</span>
            <span style={{fontSize:10,color:C.soft}}>✏️ = editar nome · 📷 = foto</span>
          </div>
          {vars.map(v=>(
            <div key={v.id} style={{display:"flex",alignItems:"center",gap:8,background:C.white,borderRadius:12,padding:"8px 10px",boxShadow:"0 1px 4px rgba(244,114,182,.07)"}}>
              <VarFotoPicker
                value={v.foto||""}
                onChange={foto=>setForm(f=>({...f,variacoes:f.variacoes.map(x=>x.id===v.id?{...x,foto}:x)}))}
              />
              {editandoId===v.id ? (
                <input
                  autoFocus
                  value={editandoNome}
                  onChange={e=>setEditandoNome(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") salvarEdicao(); if(e.key==="Escape"){setEditandoId(null);} }}
                  onBlur={salvarEdicao}
                  style={{flex:1,border:`1.5px solid ${C.pink}`,borderRadius:8,padding:"4px 8px",fontFamily:"inherit",fontSize:13,fontWeight:600,minWidth:0}}
                />
              ) : (
                <span style={{flex:1,fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.nome}</span>
              )}
              {/* Botão editar nome */}
              <button onClick={()=>iniciarEdicao(v)} title="Editar nome" style={{background:C.pinkS,border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",flexShrink:0}}>
                <Icon name="edit" size={12} color={C.pinkD}/>
              </button>
              <input type="number" min="0" value={v.qtd} onChange={e=>setForm(f=>({...f,variacoes:f.variacoes.map(x=>x.id===v.id?{...x,qtd:Number(e.target.value)}:x)}))}
                style={{width:54,border:`1.5px solid ${C.pinkM}`,borderRadius:8,padding:"4px 6px",fontFamily:"inherit",fontSize:13,textAlign:"center"}}/>
              <span style={{fontSize:11,color:C.soft,flexShrink:0}}>un.</span>
              <button onClick={()=>setForm(f=>({...f,variacoes:f.variacoes.filter(x=>x.id!==v.id)}))} style={{background:"#FEE2E2",border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",flexShrink:0}}>
                <Icon name="x" size={12} color={C.red}/>
              </button>
            </div>
          ))}
          {/* Preview das fotos das variações */}
          {vars.some(v=>v.foto)&&(
            <div style={{background:C.white,borderRadius:12,padding:"8px 10px"}}>
              <div style={{fontSize:10,color:C.soft,fontWeight:700,marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>Preview das cores</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {vars.filter(v=>v.foto).map(v=>(
                  <div key={v.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <img src={v.foto} alt={v.nome} style={{width:44,height:44,borderRadius:8,objectFit:"cover",border:`2px solid ${C.pinkM}`}}/>
                    <span style={{fontSize:9,color:C.gray,fontWeight:600,maxWidth:44,textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.nome}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      <div>
        <SL>Adicionar variação (cor, tamanho…)</SL>
        <div style={{display:"flex",gap:6}}>
          <input value={novaVar} onChange={e=>setNovaVar(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addVar()} placeholder="Ex: Vermelho, P, GG…"
            style={{flex:1,border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"8px 11px",fontFamily:"inherit",fontSize:13,minWidth:0}}/>
          <input value={novaQtd} onChange={e=>setNovaQtd(e.target.value)} type="number" min="1" placeholder="Qtd"
            style={{width:54,border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"8px 8px",fontFamily:"inherit",fontSize:13,textAlign:"center"}}/>
          <Btn small onClick={addVar}><Icon name="plus" size={14}/></Btn>
        </div>
        <div style={{fontSize:11,color:C.soft,marginTop:4}}>Adicione a foto de cada cor/variação clicando no ícone 📷 · ✏️ para editar o nome</div>
      </div>
    </div>
  );
};

/* ─── Estoque Ajuste (produto existente) ─────────────────────────────────── */
const EstoqueAjuste = ({produto,onSave,onClose}) => {
  const [modo,setModo] = useState("adicionar"); // adicionar | remover | ajustar
  const [valor,setValor] = useState("");
  const [varSel,setVarSel] = useState("total");
  const vars = produto.variacoes||[];
  const estoqueAtual = varSel==="total"
    ? Number(produto.estoqueTotal||0)
    : Number(vars.find(v=>v.id===varSel)?.qtd||0);
  const varNome = varSel==="total"?"(total)":vars.find(v=>v.id===varSel)?.nome;
  const n = Number(valor||0);
  const preview = modo==="adicionar"?estoqueAtual+n:modo==="remover"?Math.max(0,estoqueAtual-n):n;

  const aplicar = () => {
    if(!valor) return;
    onSave(modo,varSel,n);
    onClose();
  };

  return (
    <div style={{padding:"20px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <h2 style={{margin:0,fontSize:17,fontWeight:800,color:C.pinkD}}>Ajustar Estoque</h2>
        <button onClick={onClose} style={{background:C.pinkS,border:"none",borderRadius:50,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
          <Icon name="x" size={15} color={C.pinkD}/>
        </button>
      </div>

      <div style={{background:C.pinkL,borderRadius:14,padding:"10px 14px",marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:800,color:C.pinkD}}>{produto.nome}</div>
        <div style={{fontSize:12,color:C.gray,marginTop:2}}>Estoque total atual: <b>{produto.estoqueTotal||0} unidades</b></div>
      </div>

      {vars.length>0&&(
        <div style={{marginBottom:12}}>
          <SL>Ajustar qual variação?</SL>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {[{id:"total",nome:"Total geral"},...vars].map(v=>(
              <button key={v.id} onClick={()=>setVarSel(v.id)} className="tap" style={{padding:"6px 13px",borderRadius:20,border:`1.5px solid ${varSel===v.id?C.pink:C.pinkM}`,background:varSel===v.id?C.pinkS:C.white,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",color:varSel===v.id?C.pinkD:C.gray}}>
                {v.nome}{v.id!=="total"?` (${v.qtd})`:""}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{marginBottom:14}}>
        <SL>Tipo de ajuste</SL>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
          {[["adicionar","➕","Adicionar","Chegaram produtos novos"],["remover","➖","Remover","Perda, avaria, doação"],["ajustar","✏️","Ajustar","Balanço manual do estoque"]].map(([m,ico,txt,sub])=>(
            <button key={m} onClick={()=>setModo(m)} className="tap" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 6px",borderRadius:13,border:`2px solid ${modo===m?C.pink:C.pinkM}`,background:modo===m?C.pinkS:C.white,cursor:"pointer",fontFamily:"inherit"}}>
              <span style={{fontSize:20}}>{ico}</span>
              <span style={{fontSize:12,fontWeight:800,color:modo===m?C.pinkD:C.gray}}>{txt}</span>
              <span style={{fontSize:10,color:C.soft,textAlign:"center",lineHeight:1.3}}>{sub}</span>
            </button>
          ))}
        </div>
      </div>

      <FInput
        label={modo==="adicionar"?"Quantos chegaram?":modo==="remover"?"Quantos remover?":"Quantidade final (balanço)"}
        value={valor} onChange={setValor} type="number" min="0"
        placeholder={modo==="adicionar"?"Ex: 10":modo==="remover"?"Ex: 3":"Ex: 47"}
      />

      {valor&&(
        <div style={{background:C.pinkL,borderRadius:12,padding:"10px 14px",marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:C.gray}}>{varNome}: {estoqueAtual} → </span>
          <span style={{fontSize:18,fontWeight:900,color:preview>=0?C.green:C.red}}>{preview} un.</span>
        </div>
      )}

      <div style={{paddingBottom:80,marginTop:14}}>
        <Btn onClick={aplicar} disabled={!valor} full>Confirmar ajuste</Btn>
      </div>

  );
};

/* ─── Desconto Modal ──────────────────────────────────────────────────────── */
const DescontoModal = ({item,onSave,onClose}) => {
  const [tipo,setTipo] = useState("pct"); // pct | valor_unitario | valor_total
  const [val,setVal] = useState("");
  const precoOrig = item.precoOriginal||item.precoVenda;
  const pctN = Number(val||0);
  const qtd = item.qtd||1;

  const novoPrecoUnit = tipo==="pct"
    ? Math.max(0,precoOrig*(1-pctN/100))
    : tipo==="valor_unitario"
      ? Math.max(0,Number(val||precoOrig))
      : Math.max(0,precoOrig-(Math.min(Number(val||0),totalOrig)/qtd));

  const descontoUnit = precoOrig-novoPrecoUnit;
  const totalFinal = novoPrecoUnit*qtd;
  const totalOrig = precoOrig*qtd;

  const aplicar = () => {
    if(!val) return;
    onSave({...item,precoVenda:parseFloat(novoPrecoUnit.toFixed(2)),precoOriginal:precoOrig,desconto:parseFloat(descontoUnit.toFixed(2)),pctDesconto:parseFloat(((descontoUnit/precoOrig)*100).toFixed(1))});
    onClose();
  };

  const modos = [
    {id:"pct",ico:"💸",label:"% por peça",sub:"Desconto percentual sobre o valor unitário"},
    {id:"valor_unitario",ico:"🏷️",label:"Novo valor unit.",sub:"Informe o novo preço por unidade"},
    {id:"valor_total",ico:"🧮",label:"Total do produto",sub:"Informe o valor do desconto a aplicar no total"},
  ];

  return (
    <div style={{padding:"20px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:800,color:C.pinkD}}>Alterar valor do item</h2>
        <button onClick={onClose} style={{background:C.pinkS,border:"none",borderRadius:50,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Icon name="x" size={14} color={C.pinkD}/></button>
      </div>
      <div style={{background:C.pinkL,borderRadius:12,padding:"9px 13px",marginBottom:12,display:"flex",gap:9,alignItems:"center"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nome}{item.variacao?` · ${item.variacao}`:""}</div>
          <div style={{fontSize:12,color:C.gray}}>Preço unitário: {fmt(precoOrig)} · Qtd: {qtd} · Total: {fmt(totalOrig)}</div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
        {modos.map(m=>(
          <button key={m.id} onClick={()=>{setTipo(m.id);setVal("");}} className="tap" style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,border:`2px solid ${tipo===m.id?C.pink:C.pinkM}`,background:tipo===m.id?C.pinkS:C.white,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
            <span style={{fontSize:20,flexShrink:0}}>{m.ico}</span>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:tipo===m.id?C.pinkD:C.text}}>{m.label}</div>
              <div style={{fontSize:11,color:C.soft}}>{m.sub}</div>
            </div>
          </button>
        ))}
      </div>
      <FInput
        label={tipo==="pct"?"Percentual de desconto (%)":tipo==="valor_unitario"?"Novo valor por unidade (R$)":"Valor do desconto no total (R$)"}
        value={val} onChange={setVal} type="number" min="0"
        placeholder={tipo==="pct"?"Ex: 10 (para 10%)":tipo==="valor_unitario"?`Ex: ${fmtN(precoOrig*0.9)}`:`Ex: ${fmtN(totalOrig*0.1)} (desconto de 10%)`}
      />
      {val&&(
        <div style={{marginTop:10,background:"#ECFDF5",borderRadius:12,padding:"10px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:12,color:C.gray}}>Novo preço unitário:</span>
            <span style={{fontSize:14,fontWeight:800,color:C.green}}>{fmt(novoPrecoUnit)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:12,color:C.gray}}>Total ({qtd} un.):</span>
            <span style={{fontSize:14,fontWeight:800,color:C.green}}>{fmt(totalFinal)}</span>
          </div>
          {descontoUnit>0&&<div style={{fontSize:11,color:C.gray,marginTop:3}}>Desconto: {fmt(descontoUnit)}/un. · {fmt(descontoUnit*qtd)} no total ({((descontoUnit/precoOrig)*100).toFixed(0)}%)</div>}
        </div>
      )}
      <div style={{paddingBottom:80,marginTop:14}}>
        <Btn onClick={aplicar} disabled={!val} full>Aplicar desconto no item</Btn>
      </div>
    </div>
  );
};

/* ─── Desconto Compra Total Modal ─────────────────────────────────────────── */
const DescontoCompraModal = ({subtotal,descAtual,onSave,onClose}) => {
  const [tipo,setTipo] = useState("pct"); // pct | valor
  const [val,setVal] = useState(descAtual>0?String(descAtual):"");

  const pctN = Number(val||0);
  const desconto = tipo==="pct"
    ? Math.max(0,subtotal*(pctN/100))
    : Math.min(subtotal,Math.max(0,Number(val||0)));
  const totalFinal = subtotal-desconto;

  const aplicar = () => {
    onSave(parseFloat(desconto.toFixed(2)));
    onClose();

  const remover = () => { onSave(0); onClose(); };

  return (
    <div style={{padding:"20px 16px 0"}}>

      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        {[["pct","💸","% de desconto"],["valor","💰","Valor em R$"]].map(([t,ico,l])=>(
          <button key={t} onClick={()=>{setTipo(t);setVal("");}} className="tap" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"10px 8px",borderRadius:12,border:`2px solid ${tipo===t?C.pink:C.pinkM}`,background:tipo===t?C.pinkS:C.white,cursor:"pointer",fontFamily:"inherit"}}>
            <span style={{fontSize:20}}>{ico}</span>

      <FInput
        label={tipo==="pct"?"Percentual de desconto (%)":"Valor do desconto (R$)"}
        value={val} onChange={setVal} type="number" min="0"
        placeholder={tipo==="pct"?"Ex: 5 (para 5%)":fmt(subtotal*0.1).replace("R$ ","")}
      />
      {val&&(
        <div style={{marginTop:10,background:"#ECFDF5",borderRadius:12,padding:"10px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:12,color:C.gray}}>Desconto:</span>
            <span style={{fontSize:13,fontWeight:700,color:C.amber}}>-{fmt(desconto)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:13,fontWeight:700,color:C.text}}>Total final:</span>
            <span style={{fontSize:16,fontWeight:900,color:C.green}}>{fmt(totalFinal)}</span>
          </div>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:8,paddingBottom:80,marginTop:14}}>
        <Btn onClick={aplicar} disabled={!val||desconto<=0} full>Aplicar desconto na compra</Btn>
        {descAtual>0&&<Btn onClick={remover} v="danger" full>Remover desconto atual</Btn>}
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════════════════════════════ */
const Dashboard = ({produtos,vendas,clientes}) => {
  const agora = new Date();
  const hoje = agora.toDateString();
  const hora = agora.getHours();
  const saudacao = hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const [showLearn,setShowLearn] = useState(false);

  // ── Vendas hoje (só contador)
  const vendasHoje = vendas.filter(v=>new Date(v.data).toDateString()===hoje);

  // ── Clientes devendo (fiado pendente)
  const clientesDevendo = clientes.filter(c=>!c.deleted&&vendas.some(v=>v.clienteId===c.id&&v.pagamento==="fiado"&&!v.fiadoPago));
  const totalFiadoPendente = vendas.filter(v=>v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);

  // ── Aniversariantes da semana (próximos 7 dias, incluindo hoje)
  const aniversariantesSemana = clientes.filter(c=>{
    if(c.deleted||!c.nascimento) return false;
    const [,m,d] = c.nascimento.split("-");
    const nascMes = Number(m), nascDia = Number(d);
    for(let i=0;i<7;i++){
      const dia = new Date(agora);
      dia.setDate(agora.getDate()+i);
      if(dia.getDate()===nascDia&&dia.getMonth()+1===nascMes) return true;
    }
    return false;
  });
  const isBdayHoje = (c)=>{
    if(!c.nascimento) return false;
    const [,m,d]=c.nascimento.split("-");
    return Number(d)===agora.getDate()&&Number(m)===agora.getMonth()+1;
  };
  const diasAteAniv = (c)=>{
    if(!c.nascimento) return 99;
    const [,m,d]=c.nascimento.split("-");
    for(let i=0;i<7;i++){
      const dia=new Date(agora); dia.setDate(agora.getDate()+i);
      if(dia.getDate()===Number(d)&&dia.getMonth()+1===Number(m)) return i;
    }
    return 99;
  };

  // ── Estoque baixo (produto geral ≤3 OU variação individual ≤3)
  const estoqueBaixoItems = [];
  produtos.filter(p=>!p.deleted).forEach(p=>{
    const vars = p.variacoes||[];
    if(vars.length>0){
      // verifica cada variação individualmente
      vars.forEach(v=>{
        if(Number(v.qtd||0)<=3){
          estoqueBaixoItems.push({id:`${p.id}-${v.id}`,nome:p.nome,variacao:v.nome,qtd:Number(v.qtd||0),foto:v.foto||p.foto});
        }
      });
    } else {
      if(Number(p.estoqueTotal||0)<=3){
        estoqueBaixoItems.push({id:p.id,nome:p.nome,variacao:"",qtd:Number(p.estoqueTotal||0),foto:p.foto});
      }
    }
  });

  return (
    <div style={{padding:"16px 14px 14px",display:"flex",flexDirection:"column",gap:13}}>

      {/* ── Header */}
      <div style={{textAlign:"center",paddingTop:6}}>
        <div style={{fontSize:40,animation:"float 3s ease-in-out infinite"}}>🌸</div>
        <div style={{fontSize:26,fontWeight:900,letterSpacing:".01em",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:2}}>Juju Store</div>
        <h1 style={{margin:"2px 0 2px",fontSize:16,fontWeight:700,color:C.gray}}>{saudacao}!</h1>
        <p style={{margin:0,color:C.soft,fontSize:12}}>{agora.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</p>
      </div>

      {/* ── Vocabulário do Negócio (ex-Dica do Dia) */}
      <div onClick={()=>setShowLearn(o=>!o)} className="tap" style={{background:`linear-gradient(135deg,${C.pinkD},#9D174D)`,borderRadius:16,padding:"13px 15px",display:"flex",gap:11,alignItems:"center",cursor:"pointer"}}>
        <span style={{fontSize:26,flexShrink:0}}>📚</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{color:C.white,fontWeight:800,fontSize:14}}>Aprenda o Vocabulário do Negócio</div>
          <div style={{color:C.pinkM,fontSize:12,marginTop:1,lineHeight:1.4}}>{showLearn?"Toque para fechar ▲":"Entenda os termos que toda empreendedora precisa saber! ▼"}</div>
        </div>
      </div>

      {showLearn&&(
        <Card style={{border:`1.5px solid ${C.pinkM}`,animation:"slideDown .25s ease",padding:"14px 13px"}}>
          <div style={{fontWeight:800,color:C.pinkD,fontSize:14,marginBottom:10}}>📖 Dicionário do Negócio</div>
          {[
            {e:"💰",t:"Receita",d:"Tudo que entra no caixa com as vendas. É o valor total que você cobrou dos clientes — antes de descontar qualquer custo."},
            {e:"🏷️",t:"Custo",d:"Quanto você pagou para ter o produto. É o preço que você pagou à fornecedora. Sem saber o custo, fica impossível saber se está lucrando!"},
            {e:"📈",t:"Lucro",d:"Receita − Custo. O dinheiro que realmente ficou no seu bolso depois de pagar pelo produto. Esse é o número mais importante!"},
            {e:"📊",t:"Margem de Lucro",d:"Quanto % do preço de venda é lucro puro. Ex: vende por R$30, lucra R$10 → margem de 33%. Quanto maior, melhor!"},
            {e:"🔄",t:"Giro de Estoque",d:"Velocidade com que seus produtos saem. Alto giro = produtos saindo rápido. Produto parado é dinheiro preso na prateleira!"},
            {e:"📦",t:"Estoque",d:"Quantidade de produtos disponíveis para vender. Estoque zerado = venda perdida. Estoque demais = dinheiro parado."},
            {e:"📝",t:"Fiado",d:"Venda sem pagamento imediato — o cliente promete pagar depois. Tem risco! Só faça fiado para clientes de total confiança."},
            {e:"🤝",t:"Cliente fiel",d:"Cliente que volta sempre. Custa 5× menos manter um cliente do que conquistar um novo. Vale a pena mimar!"},
            {e:"💸",t:"Fluxo de Caixa",d:"O controle de tudo que entra e sai do seu negócio. Ter lucro no papel mas sem dinheiro em caixa é um sinal de alerta!"},
            {e:"🎯",t:"Precificação",d:"O processo de definir o preço de venda. Regra básica: preço deve cobrir o custo, as despesas e ainda sobrar lucro para você!"},
          ].map(d=>(
            <div key={d.t} style={{display:"flex",gap:9,padding:"8px 0",borderBottom:`1px solid ${C.pinkS}`}}>
              <span style={{fontSize:18,flexShrink:0,lineHeight:1.5}}>{d.e}</span>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:C.text}}>{d.t}</div>
                <div style={{fontSize:12,color:C.gray,lineHeight:1.45,marginTop:1}}>{d.d}</div>
              </div>
            </div>
          ))}
        </Card>
      )}

      {/* ── Vendas hoje (só contador) */}
      <Card style={{padding:13,display:"flex",alignItems:"center",gap:12,background:`linear-gradient(135deg,${C.pinkS},${C.white})`}}>
        <div style={{width:48,height:48,borderRadius:14,background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:22}}>🛍️</span>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,fontWeight:700,color:C.soft,textTransform:"uppercase",letterSpacing:".05em"}}>Vendas realizadas hoje</div>
          <div style={{fontSize:28,fontWeight:900,color:C.pinkD,lineHeight:1.1}}>{vendasHoje.length}</div>
          <div style={{fontSize:11,color:C.gray,marginTop:1}}>{vendasHoje.length===0?"Nenhuma venda ainda hoje":vendasHoje.length===1?"1 venda registrada":`${vendasHoje.length} vendas registradas`}</div>
        </div>
      </Card>

      {/* ── Clientes devendo (fiado pendente) */}
      {clientesDevendo.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.red}`,background:"#FFF8F8"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontWeight:800,color:C.red,fontSize:13}}>📝 Clientes devendo</div>
            <Badge color={C.red}>{fmt(totalFiadoPendente)}</Badge>
          </div>
          {clientesDevendo.map(c=>{
            const totalDev=vendas.filter(v=>v.clienteId===c.id&&v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);
            return (
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:`1px solid #FEE2E2`,gap:8}}>
                <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0}}>
                  {c.foto
                    ?<img src={c.foto} alt="" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:`2px solid ${C.red}44`}}/>
                    :<div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${C.red},#DC2626)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:11,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
                  }
                  <span style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                </div>
                <span style={{fontSize:13,fontWeight:800,color:C.red,flexShrink:0}}>{fmt(totalDev)}</span>
              </div>
            );
          })}
        </Card>
      )}

      {/* ── Aniversariantes da semana */}
      {aniversariantesSemana.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.amber}`,background:"#FFFBEB"}}>
          <div style={{fontWeight:800,color:"#92400E",fontSize:13,marginBottom:8}}>🎂 Aniversariantes da semana</div>
          {aniversariantesSemana.sort((a,b)=>diasAteAniv(a)-diasAteAniv(b)).map(c=>{
            const hoje=isBdayHoje(c);
            const dias=diasAteAniv(c);
            return (
              <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderTop:`1px solid #FDE68A`}}>
                {c.foto
                  ?<img src={c.foto} alt="" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:`2px solid ${C.amber}55`}}/>
                  :<div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${C.amber},#D97706)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:11,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
                }
                <span style={{fontSize:13,fontWeight:700,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                <span style={{fontSize:11,fontWeight:700,background:hoje?"#FEF3C7":C.white,color:hoje?"#92400E":C.amber,borderRadius:20,padding:"2px 9px",flexShrink:0,border:`1px solid ${C.amber}44`}}>
                  {hoje?"🎉 Hoje!":dias===1?"amanhã":`em ${dias} dias`}
                </span>
              </div>
            );
          })}
        </Card>
      )}

      {/* ── Estoque baixo (inclui variações) */}
      {estoqueBaixoItems.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.amber}`}}>
          <div style={{fontWeight:800,color:C.amber,fontSize:13,marginBottom:8}}>⚠️ Estoque baixo — hora de reabastecer!</div>
          {estoqueBaixoItems.map(item=>(
            <div key={item.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 0",borderTop:`1px solid ${C.pinkS}`,gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0,flex:1}}>
                {item.foto
                  ?<img src={item.foto} alt="" style={{width:26,height:26,borderRadius:6,objectFit:"cover",flexShrink:0,border:`1.5px solid ${C.pinkM}`}}/>
                  :<div style={{width:26,height:26,borderRadius:6,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" size={11} color={C.pink}/></div>
                }
                <div style={{minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nome}</div>
                  {item.variacao&&<div style={{fontSize:10,color:C.soft}}>{item.variacao}</div>}
                </div>
              </div>
              <Badge color={item.qtd===0?C.red:C.amber}>{item.qtd===0?"Zerado!":item.qtd+" un."}</Badge>
            </div>
          ))}
        </Card>
      )}

      {/* ── Últimas vendas (cliente, itens, valor) */}
      <Card>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>🛍️ Últimas vendas</div>
        {vendas.length===0
          ?<p style={{color:C.soft,fontSize:13,textAlign:"center",margin:0}}>Nenhuma venda ainda — vamos lá! 💪</p>
          :[...vendas].reverse().slice(0,5).map(v=>{
            const pagtIco={dinheiro:"💵",pix:"📱",fiado:"📝"};
            return (
              <div key={v.id} style={{padding:"9px 0",borderBottom:`1px solid ${C.pinkS}`,display:"flex",gap:9,alignItems:"flex-start"}}>
                <div style={{width:34,height:34,borderRadius:10,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:16}}>{pagtIco[v.pagamento]||"💰"}</span>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Cliente avulso"}</div>
                  <div style={{fontSize:11,color:C.soft,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {v.itens?.map(i=>`${i.qtd}× ${i.nome}${i.variacao?` (${i.variacao})`:""}`).join(", ")||"—"}
                  </div>
                  <div style={{fontSize:10,color:C.soft,marginTop:1}}>{new Date(v.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
                </div>
                <Badge>{fmt(v.total)}</Badge>
              </div>
            );
          })
        }
      </Card>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   PRODUTOS
══════════════════════════════════════════════════════════════════════════════ */
const Produtos = ({produtos,setProdutos,onCelebrate,buscaDestino="",onBuscaDestinoClear}) => {
  const [modal,setModal] = useState(null);
  const [form,setForm] = useState({});
  const [ajusteModal,setAjusteModal] = useState(null);
  const [search,setSearch] = useState("");
  const [showDeleted,setShowDeleted] = useState(false);
  const [confirmDel,setConfirmDel] = useState(null); // {id, nome}

  // Aplica filtro vindo da busca global
  useEffect(()=>{
    if(buscaDestino){ setSearch(buscaDestino); onBuscaDestinoClear?.(); }
  },[buscaDestino]);

  const blank = ()=>({foto:"",nome:"",categoria:"",precoCusto:"",precoVenda:"",estoqueTotal:"",variacoes:[],obs:""});
  const openAdd = ()=>{setForm(blank());setModal("add");};
  const openEdit = (p)=>{setForm({...p,variacoes:p.variacoes||[]});setModal(p);};

  const save = ()=>{
    if(!form.nome?.trim()) return;
    const total = (form.variacoes||[]).length>0
      ? (form.variacoes||[]).reduce((s,v)=>s+Number(v.qtd||0),0)
      : Number(form.estoqueTotal||0);
    const pf = {...form,estoqueTotal:total,id:modal==="add"?uid():modal.id,deleted:false};
    if(modal==="add"){
      setProdutos(ps=>[...ps,pf]);
      onCelebrate({emoji:"🎁",title:"Produto cadastrado!",message:`"${form.nome}" já está na sua lojinha!`,tip:"Produto com foto vende até 3× mais. Sempre capriche na imagem!"});
    } else {
      setProdutos(ps=>ps.map(p=>p.id===modal.id?pf:p));
    }
    setModal(null);
  };

  const softDelete = (id,nome)=>setConfirmDel({id,nome});
  const doDelete = ()=>{
    setProdutos(ps=>ps.map(p=>p.id===confirmDel.id?{...p,deleted:true}:p));
    setConfirmDel(null);
  };

  const restore = (id)=>setProdutos(ps=>ps.map(p=>p.id===id?{...p,deleted:false}:p));

  const applyAjuste = (modo,varId,n)=>{
    setProdutos(ps=>ps.map(p=>{
      if(p.id!==ajusteModal.id) return p;
      let novasVars = p.variacoes?[...p.variacoes]:[];
      let novoTotal = Number(p.estoqueTotal||0);
      if(varId==="total"){
        novoTotal = modo==="adicionar"?novoTotal+n:modo==="remover"?Math.max(0,novoTotal-n):n;
      } else {
        novasVars = novasVars.map(v=>{
          if(v.id!==varId) return v;
          const q = Number(v.qtd||0);
          const nq = modo==="adicionar"?q+n:modo==="remover"?Math.max(0,q-n):n;
          return {...v,qtd:nq};
        });
        novoTotal = novasVars.reduce((s,v)=>s+Number(v.qtd||0),0);
      }
      return {...p,estoqueTotal:novoTotal,variacoes:novasVars};
    }));
    setAjusteModal(null);
  };

  const ativos = produtos.filter(p=>!p.deleted&&p.nome?.toLowerCase().includes(search.toLowerCase()));
  const deletados = produtos.filter(p=>p.deleted);

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>📦 Produtos</h2>
          <div style={{marginTop:4}}><Tip title="O que é Produto?" text="Produto é tudo que você vende. Informe o custo (o que pagou), o preço de venda (o que vai cobrar) e o estoque (quantas peças tem)." color={C.purple}>O que é produto?</Tip></div>
        </div>
        <Btn onClick={openAdd} small><Icon name="plus" size={14}/>Novo</Btn>
      </div>

      <FInput placeholder="🔍 Buscar produto..." value={search} onChange={setSearch} style={{marginBottom:12}}/>

      {ativos.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>📦</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Nenhum produto ainda.</p>
          <p style={{fontSize:12,margin:0}}>Toque em "Novo" para começar!</p>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {ativos.map((p,i)=>{
            const est=Number(p.estoqueTotal??0);
            const vars=p.variacoes||[];
            return (
              <Card key={p.id} style={{display:"flex",gap:11,padding:11,animation:`fadeUp .28s ease ${i*.04}s both`}}>
                {p.foto
                  ?<img src={p.foto} alt="" style={{width:60,height:60,borderRadius:12,objectFit:"cover",flexShrink:0}}/>
                  :<div style={{width:60,height:60,borderRadius:12,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" color={C.pink}/></div>
                }
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:14,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nome}</div>
                  <div style={{fontSize:11,color:C.soft,marginTop:1}}>{p.categoria}</div>
                  <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                    <Badge>{fmt(p.precoVenda)}</Badge>
                    <Badge color={est<=0?C.red:est<=5?C.amber:C.green}>{est} un.</Badge>
                    {vars.length>0&&<Badge color={C.purple}>{vars.length} var.</Badge>}
                  </div>
                  {vars.length>0&&(
                    <div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                      {vars.some(v=>v.foto)
                        ? vars.slice(0,5).map(v=>(
                            v.foto
                              ? <img key={v.id} src={v.foto} title={v.nome} alt={v.nome} style={{width:22,height:22,borderRadius:5,objectFit:"cover",border:`1.5px solid ${C.pinkM}`}}/>
                              : <span key={v.id} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:8,padding:"2px 6px"}}>{v.nome}: {v.qtd}</span>
                          ))
                        : vars.slice(0,3).map(v=>(
                            <span key={v.id} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:8,padding:"2px 6px"}}>{v.nome}: {v.qtd}</span>
                          ))
                      }
                      {vars.length>5&&<span style={{fontSize:10,color:C.soft}}>+{vars.length-5}</span>}
                      {vars.length>3&&!vars.some(v=>v.foto)&&<span style={{fontSize:10,color:C.soft}}>+{vars.length-3}</span>}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                  <button onClick={()=>openEdit(p)} style={{background:C.pinkS,border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="edit" size={13} color={C.pinkD}/></button>
                  <button onClick={()=>setAjusteModal(p)} style={{background:"#EEF2FF",border:"none",borderRadius:9,padding:8,cursor:"pointer"}} title="Ajustar estoque"><Icon name="restore" size={13} color={C.purple}/></button>
                  <button onClick={()=>softDelete(p.id,p.nome)} style={{background:"#FEE2E2",border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="trash" size={13} color={C.red}/></button>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {deletados.length>0&&(
        <div style={{marginTop:16}}>
          <button onClick={()=>setShowDeleted(o=>!o)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.soft,fontSize:13,cursor:"pointer",padding:0,marginBottom:8}}>
            <Icon name="eye" size={14} color={C.soft}/>{showDeleted?"Ocultar":"Mostrar"} produtos arquivados ({deletados.length})
          </button>
          {showDeleted&&deletados.map(p=>(
            <Card key={p.id} style={{display:"flex",gap:10,padding:10,opacity:.65,marginBottom:8}}>
              {p.foto?<img src={p.foto} alt="" style={{width:48,height:48,borderRadius:10,objectFit:"cover",flexShrink:0}}/>:<div style={{width:48,height:48,borderRadius:10,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" color={C.pinkM}/></div>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.gray,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nome}</div>
                <div style={{fontSize:11,color:C.soft}}>Arquivado</div>
              </div>
              <button onClick={()=>restore(p.id)} style={{background:"#ECFDF5",border:"none",borderRadius:9,padding:8,cursor:"pointer",flexShrink:0}}>
                <Icon name="restore" size={13} color={C.green}/>
              </button>
            </Card>
          ))}
        </div>
      )}

      {modal&&(
        <Modal title={modal==="add"?"✨ Novo Produto":"✏️ Editar Produto"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:13}}>
            <ImagePicker value={form.foto} onChange={v=>setForm(f=>({...f,foto:v}))}/>
            <FInput label="Nome do produto" value={form.nome||""} onChange={v=>setForm(f=>({...f,nome:v}))} placeholder="Ex: Presilha de cabelo floral"/>
            <FInput label="Categoria" value={form.categoria||""} onChange={v=>setForm(f=>({...f,categoria:v}))} placeholder="Ex: Acessórios, Roupas…"/>
            <div style={{background:C.pinkL,borderRadius:16,padding:13}}>
              <SL right={<Tip title="Como precificar?" text="Custo = quanto você pagou. Preço de venda = quanto vai cobrar. A diferença é o seu ganho. Regra dos 3×: venda por 3× o que pagou!" color={C.pinkD}>Como calcular?</Tip>}>💸 Precificação</SL>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:10}}>
                <FInput label="Custo (R$)" value={form.precoCusto||""} onChange={v=>setForm(f=>({...f,precoCusto:v}))} type="number" placeholder="0,00"/>
                <FInput label="Venda (R$)" value={form.precoVenda||""} onChange={v=>setForm(f=>({...f,precoVenda:v}))} type="number" placeholder="0,00"/>
              </div>
              <PrecBox custo={form.precoCusto} venda={form.precoVenda}/>
            </div>
            <InfoBox emoji="🧮" title="Regra dos 3× (para começar)" text="Pagou R$10? Venda por R$30. Isso cobre o custo, suas despesas e ainda gera lucro!" color={C.green}/>
            <EstoqueNovo form={form} setForm={setForm}/>
            <FInput label="Observações" value={form.obs||""} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Fornecedor, dicas, prazo…"/>
            <Btn onClick={save} full><Icon name="check" size={15}/> Salvar Produto</Btn>
          </div>
        </Modal>
      )}

      {ajusteModal&&(
        <Modal title="" onClose={()=>setAjusteModal(null)} noPad>
          <EstoqueAjuste produto={ajusteModal} onSave={applyAjuste} onClose={()=>setAjusteModal(null)}/>
        </Modal>
      )}

      {confirmDel&&(
        <ConfirmModal
          message={`Ocultar "${confirmDel.nome}"? O produto ficará arquivado e pode ser recuperado depois.`}
          onConfirm={doDelete}
          onCancel={()=>setConfirmDel(null)}
        />
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════

const Clientes = ({clientes,setClientes,vendas,setVendas,onCelebrate,buscaDestino="",onBuscaDestinoClear}) => {
  const [modal,setModal]       = useState(null);
  const [form,setForm]         = useState({});
  const [search,setSearch]     = useState("");
  const [detail,setDetail]     = useState(null);
  const [showDeleted,setShowDeleted] = useState(false);
  // hooks para recebimento de fiado — devem ficar no topo, fora de condicionais
  const [recModal,setRecModal] = useState(null);
  const [recPagt,setRecPagt]   = useState("dinheiro");
  const [confirmDelCli,setConfirmDelCli] = useState(null); // id

  // Aplica filtro vindo da busca global
  useEffect(()=>{
    if(buscaDestino){ setSearch(buscaDestino); onBuscaDestinoClear?.(); }
  },[buscaDestino]);

  const save = ()=>{
    if(!form.nome?.trim()) return;
    if(modal==="add"){
      setClientes(cs=>[...cs,{...form,id:uid(),deleted:false}]);
      onCelebrate({emoji:"🤝",title:"Cliente cadastrado!",message:`${form.nome} agora faz parte da sua clientela!`,tip:"Cliente cadastrado = histórico de compras. Você saberá o que cada pessoa gosta!"});
    } else {
      setClientes(cs=>cs.map(c=>c.id===modal.id?{...form,id:modal.id}:c));
    }
    setModal(null);
  };

  const softDel = (id)=>setConfirmDelCli(id);
  const doDelCli = ()=>{setClientes(cs=>cs.map(c=>c.id===confirmDelCli?{...c,deleted:true}:c));setConfirmDelCli(null);};
  const restore = (id)=>setClientes(cs=>cs.map(c=>c.id===id?{...c,deleted:false}:c));
  const cv = (id)=>vendas.filter(v=>v.clienteId===id);
  const AVC = [C.pink,C.purple,C.green,C.amber,"#60A5FA","#F87171"];

  // ── Helpers de aniversário
  const hoje = new Date();
  const diaHoje = hoje.getDate(), mesHoje = hoje.getMonth()+1;
  const isBdayHoje = (c)=>{ if(!c.nascimento) return false; const [,m,d]=c.nascimento.split("-"); return Number(d)===diaHoje&&Number(m)===mesHoje; };
  const isBdayMes  = (c)=>{ if(!c.nascimento) return false; const [,m]=c.nascimento.split("-"); return Number(m)===mesHoje; };
  const fmtNasc = (n)=>{ if(!n) return null; const [y,m,d]=n.split("-"); return `${d}/${m}/${y}`; };
  const calcIdade = (n)=>{ if(!n) return null; const [y,m,d]=n.split("-"); const bn=new Date(+y,+m-1,+d); const a=new Date(); let age=a.getFullYear()-bn.getFullYear(); if(a<new Date(a.getFullYear(),bn.getMonth(),bn.getDate()))age--; return age; };

  // ── Helpers de fiado
  const temFiado       = (cid)=>vendas.some(v=>v.clienteId===cid&&v.pagamento==="fiado"&&!v.fiadoPago);
  const totalFiado     = (cid)=>vendas.filter(v=>v.clienteId===cid&&v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);

  const filtered = clientes.filter(c=>!c.deleted&&c.nome?.toLowerCase().includes(search.toLowerCase()));
  const deletados = clientes.filter(c=>c.deleted);
  const aniversariantesHoje = clientes.filter(c=>!c.deleted&&isBdayHoje(c));

  const pagtIcons={dinheiro:"💵",pix:"📱",cartao:"💳",fiado:"📝"};
  const pagtNomes={dinheiro:"Dinheiro",pix:"Pix",cartao:"Cartão",fiado:"Fiado"};
  const receberFiado = (vendaId)=>{
    setVendas(vs=>vs.map(v=>v.id===vendaId?{...v,fiadoPago:true,fiadoPagtMetodo:recPagt,fiadoPagtData:new Date().toISOString()}:v));
    setRecModal(null);
  };

  if(detail){
    const cvendas=cv(detail.id);
    const totalGasto=cvendas.reduce((s,v)=>s+v.total,0);
    const bdHoje=isBdayHoje(detail);
    const bdMes=isBdayMes(detail);
    const idade=calcIdade(detail.nascimento);
    const fiadoPend=temFiado(detail.id);
    const totalFiadoVal=totalFiado(detail.id);
    const ringColor=fiadoPend?C.red:C.green;
    const ringGlow=fiadoPend?C.red+"28":C.green+"28";

    return (
      <div style={{padding:"14px 14px"}}>
        <button onClick={()=>setDetail(null)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.pinkD,fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:14,padding:0}}>
          <Icon name="back" size={16}/> Voltar
        </button>
        <Card style={{textAlign:"center",marginBottom:12}}>
          <div style={{position:"relative",display:"inline-block",margin:"0 auto 10px"}}>
            {detail.foto
              ?<img src={detail.foto} alt="" style={{width:80,height:80,borderRadius:"50%",objectFit:"cover",border:`3px solid ${ringColor}`,boxShadow:`0 0 0 5px ${ringGlow}`}}/>
              :<div style={{width:80,height:80,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontSize:30,fontWeight:900,border:`3px solid ${ringColor}`,boxShadow:`0 0 0 5px ${ringGlow}`}}>{detail.nome[0].toUpperCase()}</div>
            }
            {bdHoje&&<div style={{position:"absolute",bottom:-2,right:-2,fontSize:20}}>🎂</div>}
          </div>
          <div style={{fontSize:18,fontWeight:900,color:C.text}}>{detail.nome}</div>
          {fiadoPend&&<div style={{background:"#FEE2E2",color:C.red,borderRadius:20,padding:"4px 14px",fontSize:12,fontWeight:700,display:"inline-block",marginTop:5}}>📝 Fiado pendente: {fmt(totalFiadoVal)}</div>}
          {bdHoje&&<div style={{background:"#FEF3C7",color:"#92400E",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,display:"inline-block",marginTop:4}}>🎉 Aniversário hoje!</div>}
          {!bdHoje&&bdMes&&<div style={{background:C.pinkS,color:C.pinkD,borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,display:"inline-block",marginTop:4}}>🎈 Aniversário este mês</div>}
          {detail.nascimento&&<div style={{color:C.soft,fontSize:12,marginTop:6}}>🎂 {fmtNasc(detail.nascimento)}{idade!==null?` · ${idade} anos`:""}</div>}
          {detail.telefone&&<div style={{color:C.soft,fontSize:13,marginTop:4}}>{detail.telefone}</div>}

            <div><div style={{fontWeight:900,color:C.green,fontSize:20}}>{fmt(totalGasto)}</div><div style={{fontSize:11,color:C.soft}}>total gasto</div></div>
          </div>
        </Card>
        <InfoBox emoji="💡" title="Cliente fiel vale ouro!" text="Saber o histórico do cliente ajuda a oferecer o produto certo na hora certa." color={C.purple}/>
        <h3 style={{color:C.pinkD,fontSize:13,fontWeight:800,margin:"12px 0 8px"}}>Histórico de compras</h3>
        {cvendas.length===0?<p style={{color:C.soft,fontSize:13}}>Ainda não realizou nenhuma compra.</p>
          :[...cvendas].reverse().map(v=>{
            const ehFiado=v.pagamento==="fiado";
            const quitado=ehFiado&&v.fiadoPago;
            const pendente=ehFiado&&!v.fiadoPago;
            return (
              <Card key={v.id} style={{marginBottom:8,padding:12,border:pendente?`2px solid ${C.red}55`:quitado?`2px solid ${C.green}44`:"none",background:pendente?"#FFF5F5":quitado?"#F0FDF4":C.white}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.itens?.map(i=>i.nome).join(", ")}</div>
                    <div style={{fontSize:11,marginTop:3,display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                      <span style={{color:C.soft}}>{new Date(v.data).toLocaleDateString("pt-BR")}</span>
                      <span style={{color:C.soft}}>·</span>
                      <span style={{fontWeight:pendente||quitado?700:400,color:pendente?C.red:quitado?C.green:C.soft}}>
                        {pagtIcons[v.pagamento]||"💰"} {pagtNomes[v.pagamento]||v.pagamento}
                      </span>
                      {pendente&&<span style={{fontSize:10,background:"#FEE2E2",color:C.red,borderRadius:8,padding:"1px 7px",fontWeight:700}}>Pendente</span>}
                      {quitado&&<span style={{fontSize:10,background:"#DCFCE7",color:C.green,borderRadius:8,padding:"1px 7px",fontWeight:700}}>✓ Recebido via {pagtNomes[v.fiadoPagtMetodo]||v.fiadoPagtMetodo}</span>}
                      {v.desconto>0&&<><span style={{color:C.soft}}>·</span><span style={{color:C.soft}}>Desc: {fmt(v.desconto)}</span></>}
                    </div>
                  </div>
                  <Badge color={pendente?C.red:quitado?C.green:C.pink}>{fmt(v.total)}</Badge>
                </div>
                {pendente&&(
                  <button onClick={()=>{setRecPagt("dinheiro");setRecModal(v.id);}} className="tap"
                    style={{marginTop:10,width:"100%",background:`linear-gradient(135deg,${C.green},#059669)`,color:C.white,border:"none",borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    ✅ Marcar como recebido
                  </button>
                )}
              </Card>
            );
          })
        }

        {recModal&&(
          <Modal title="💰 Confirmar Recebimento" onClose={()=>setRecModal(null)}>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <InfoBox emoji="✅" title="Como o cliente pagou?" text="Informe a forma de pagamento usada para quitar o fiado." color={C.green}/>
              <div>
                <SL>Forma de Pagamento</SL>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                  {[["dinheiro","💵","Dinheiro"],["pix","📱","Pix"]].map(([id,ico,l])=>(
                    <button key={id} onClick={()=>setRecPagt(id)} className="tap"
                      style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 2px",borderRadius:11,border:`2px solid ${recPagt===id?C.green:"#D1D5DB"}`,background:recPagt===id?"#F0FDF4":C.white,cursor:"pointer",fontFamily:"inherit"}}>
                      <span style={{fontSize:20}}>{ico}</span>
                      <span style={{fontSize:11,fontWeight:700,color:recPagt===id?C.green:C.gray}}>{l}</span>
                    </button>
                  ))}
                </div>
              </div>
              <Btn onClick={()=>receberFiado(recModal)} full style={{background:`linear-gradient(135deg,${C.green},#059669)`}}>
                <Icon name="check" size={15}/> Confirmar Recebimento
              </Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>👥 Clientes</h2>
          <div style={{marginTop:4}}><Tip title="Por que cadastrar?" text="Com clientes cadastrados você vê o histórico de compras, sabe o que gostam e pode atendê-los melhor. Cliente feliz volta sempre!" color={C.purple}>Por que cadastrar?</Tip></div>
        </div>
        <Btn onClick={()=>{setForm({});setModal("add");}} small><Icon name="plus" size={14}/>Novo</Btn>
      </div>

      {/* Banner aniversariantes de hoje */}
      {aniversariantesHoje.length>0&&(
        <div style={{background:"linear-gradient(135deg,#FEF3C7,#FDE68A)",border:"1.5px solid #F59E0B44",borderRadius:16,padding:"11px 14px",marginBottom:12,display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:22,flexShrink:0}}>🎂</span>
          <div>
            <div style={{fontSize:12,fontWeight:800,color:"#92400E"}}>Aniversário hoje!</div>
            <div style={{fontSize:12,color:"#78350F"}}>{aniversariantesHoje.map(c=>c.nome).join(", ")} 🎉</div>
          </div>
        </div>
      )}

      <FInput placeholder="🔍 Buscar cliente..." value={search} onChange={setSearch} style={{marginBottom:12}}/>

      {filtered.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>👥</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Nenhum cliente ainda.</p>
          <p style={{fontSize:12,margin:0}}>Cadastre seu primeiro cliente!</p>
        </div>
      ):filtered.map((c,i)=>{
        const nc=cv(c.id).length;
        const ac=AVC[i%AVC.length];
        const bdHoje=isBdayHoje(c);
        const bdMes=isBdayMes(c);
        const hasFiado=temFiado(c.id);
        const ringColor=hasFiado?C.red:C.green;
        return (
          <Card key={c.id} style={{display:"flex",alignItems:"center",gap:11,marginBottom:9,padding:11,animation:`fadeUp .28s ease ${i*.04}s both`,border:bdHoje?`2px solid ${C.amber}`:hasFiado?`2px solid ${C.red}33`:"none",background:bdHoje?"#FFFBEB":hasFiado?"#FFF8F8":C.white}}>
            {/* Avatar com foto, borda verde ou vermelha */}
            <div onClick={()=>setDetail(c)} style={{position:"relative",flexShrink:0,cursor:"pointer"}}>
              {c.foto
                ?<img src={c.foto} alt="" style={{width:46,height:46,borderRadius:"50%",objectFit:"cover",border:`2.5px solid ${bdHoje?C.amber:ringColor}`,boxShadow:`0 0 0 3px ${bdHoje?C.amber+"44":ringColor+"33"}`}}/>
                :<div style={{width:46,height:46,borderRadius:"50%",background:`linear-gradient(135deg,${ac},${ac}BB)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:17,border:`2.5px solid ${bdHoje?C.amber:ringColor}`,boxShadow:`0 0 0 3px ${bdHoje?C.amber+"44":ringColor+"33"}`}}>{c.nome?.[0]?.toUpperCase()}</div>
              }
              {bdHoje&&<div style={{position:"absolute",bottom:-3,right:-3,fontSize:13,lineHeight:1}}>🎂</div>}
              {hasFiado&&!bdHoje&&<div style={{position:"absolute",bottom:-3,right:-3,fontSize:13,lineHeight:1}}>📝</div>}
            </div>
            <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setDetail(c)}>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                {bdHoje&&<span style={{fontSize:10,background:"#FEF3C7",color:"#92400E",borderRadius:10,padding:"1px 7px",fontWeight:700,whiteSpace:"nowrap"}}>🎉 Hoje!</span>}
                {!bdHoje&&bdMes&&<span style={{fontSize:10,background:C.pinkS,color:C.pinkD,borderRadius:10,padding:"1px 7px",fontWeight:700,whiteSpace:"nowrap"}}>🎈 Este mês</span>}
