            </div>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              <button onClick={()=>{setForm({...c});setModal(c);}} style={{background:C.pinkS,border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="edit" size={13} color={C.pinkD}/></button>
              <button onClick={()=>softDel(c.id)} style={{background:"#FEE2E2",border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="trash" size={13} color={C.red}/></button>
            </div>
          </Card>
        );
      })}

      {deletados.length>0&&(
        <div style={{marginTop:14}}>
          <button onClick={()=>setShowDeleted(o=>!o)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.soft,fontSize:13,cursor:"pointer",padding:0,marginBottom:8}}>
            <Icon name="eye" size={14} color={C.soft}/>{showDeleted?"Ocultar":"Mostrar"} clientes arquivados ({deletados.length})
          </button>
          {showDeleted&&deletados.map(c=>(
            <Card key={c.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:10,opacity:.65}}>
              {c.foto
                ?<img src={c.foto} alt="" style={{width:40,height:40,borderRadius:"50%",objectFit:"cover",flexShrink:0}}/>
                :<div style={{width:40,height:40,borderRadius:"50%",background:C.pinkM,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
              }
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:C.gray}}>{c.nome}</div><div style={{fontSize:11,color:C.soft}}>Arquivado</div></div>
              <button onClick={()=>restore(c.id)} style={{background:"#ECFDF5",border:"none",borderRadius:9,padding:8,cursor:"pointer",flexShrink:0}}><Icon name="restore" size={13} color={C.green}/></button>
            </Card>
          ))}
        </div>
      )}

      {modal&&(
        <Modal title={modal==="add"?"🤝 Novo Cliente":"✏️ Editar Cliente"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <InfoBox emoji="👑" title="Cliente é tudo!" text="Um cliente feliz indica sua loja para amigos — marketing gratuito e poderoso!" color={C.pink}/>
            <ProfilePicker value={form.foto||""} onChange={v=>setForm(f=>({...f,foto:v}))} nome={form.nome}/>
            <FInput label="Nome" value={form.nome||""} onChange={v=>setForm(f=>({...f,nome:v}))} placeholder="Nome completo"/>
            <FInput label="WhatsApp / Telefone" value={form.telefone||""} onChange={v=>setForm(f=>({...f,telefone:v}))} placeholder="(44) 99999-9999"/>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase"}}>Data de Nascimento</label>
              <input
                value={form._nascDisplay !== undefined ? form._nascDisplay : (form.nascimento ? form.nascimento.split("-").reverse().join("/") : "")}
                onChange={e=>{
                  // Formata automaticamente: DD/MM/AAAA → AAAA-MM-DD para armazenamento
                  let v = e.target.value.replace(/\D/g,"");
                  if(v.length>8) v=v.slice(0,8);
                  let fmt = v;
                  if(v.length>=5) fmt=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
                  else if(v.length>=3) fmt=v.slice(0,2)+"/"+v.slice(2);
                  // Armazena como AAAA-MM-DD se completo
                  if(v.length===8){
                    const iso=`${v.slice(4)}-${v.slice(2,4)}-${v.slice(0,2)}`;
                    setForm(f=>({...f,nascimento:iso,_nascDisplay:fmt}));
                  } else {
                    setForm(f=>({...f,nascimento:"",_nascDisplay:fmt}));
                  }
                }}
                placeholder="DD/MM/AAAA"
                inputMode="numeric"
                maxLength={10}
                style={{border:`1.5px solid ${C.pinkM}`,borderRadius:12,padding:"10px 13px",fontFamily:"inherit",fontSize:14,color:C.text,outline:"none",background:"#fff",width:"100%"}}
                onFocus={e=>{e.target.style.borderColor=C.pink;e.target.style.boxShadow=`0 0 0 3px ${C.pink}18`;}}
                onBlur={e=>{e.target.style.borderColor=C.pinkM;e.target.style.boxShadow="none";}}
              />
              <span style={{fontSize:10,color:C.soft}}>Digite no formato DD/MM/AAAA</span>
            </div>
            <FInput label="Observações" value={form.obs||""} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Tamanho favorito, cor preferida…"/>
            <Btn onClick={save} full><Icon name="check" size={15}/> Salvar Cliente</Btn>
          </div>
        </Modal>
      )}

      {confirmDelCli&&(
        <ConfirmModal
          message="Ocultar este cliente? Ele ficará arquivado e pode ser recuperado depois."
          onConfirm={doDelCli}
          onCancel={()=>setConfirmDelCli(null)}
        />
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   VENDAS
══════════════════════════════════════════════════════════════════════════════ */
const Vendas = ({vendas,setVendas,produtos,setProdutos,clientes,onCelebrate}) => {
  const [modal,setModal] = useState(false);
  const [clienteId,setClienteId] = useState("");
  const [itens,setItens] = useState([]);
  const [prodSel,setProdSel] = useState("");
  const [varSel,setVarSel] = useState("");
  const [qtd,setQtd] = useState("1");
  const [pagamento,setPagamento] = useState("dinheiro");
  const [filter,setFilter] = useState("todos");
  const [descontoModal,setDescontoModal] = useState(null); // item index
  const [descontoCompraModal,setDescontoCompraModal] = useState(false);
  const [descontoCompra,setDescontoCompra] = useState(0); // valor R$ de desconto na compra total

  const prodSelecionado = produtos.filter(p=>!p.deleted).find(x=>x.id===prodSel);
  const subtotalItens = itens.reduce((s,i)=>s+i.precoVenda*i.qtd,0);
  const total = Math.max(0,subtotalItens-descontoCompra);
  const totalOriginal = itens.reduce((s,i)=>s+(i.precoOriginal||i.precoVenda)*i.qtd,0);
  const totalDesconto = totalOriginal-subtotalItens+descontoCompra;
  const custoItens = itens.reduce((s,i)=>s+i.precoCusto*i.qtd,0);

  // Verifica estoque disponível para um item do carrinho
  const estoqueDisp = (prodId, variacao) => {
    const p = produtos.find(x=>x.id===prodId);
    if(!p) return 0;
    if(variacao && p.variacoes?.length>0){
      return Number(p.variacoes.find(v=>v.nome===variacao)?.qtd||0);
    }
    return Number(p.estoqueTotal||0);
  };

  const estoqueInsuf = itens.filter(it=>{
    const disp = estoqueDisp(it.produtoId, it.variacao);
    return disp < it.qtd;
  });

  const addItem = ()=>{
    if(!prodSelecionado) return;
    const novaQtd = Number(qtd)||1;
    const varObj = prodSelecionado.variacoes?.find(v=>v.nome===varSel);
    // Verifica estoque disponível
    const dispAtual = varSel
      ? Number(varObj?.qtd||0)
      : Number(prodSelecionado.estoqueTotal||0);
    const jaNoCarrinho = itens.find(x=>x.produtoId===prodSelecionado.id&&x.variacao===(varSel||""))?.qtd||0;
    if(dispAtual>0 && jaNoCarrinho+novaQtd > dispAtual){
      // Ainda adiciona, mas vai marcar como insuficiente visualmente
    }
    setItens(is=>{
      const idx = is.findIndex(x=>x.produtoId===prodSelecionado.id&&x.variacao===(varSel||""));
      if(idx>=0){
        return is.map((x,i)=>i===idx?{...x,qtd:x.qtd+novaQtd}:x);
      }
      return [...is,{produtoId:prodSelecionado.id,nome:prodSelecionado.nome,variacao:varSel,varFoto:varObj?.foto||"",foto:prodSelecionado.foto||"",qtd:novaQtd,precoVenda:Number(prodSelecionado.precoVenda),precoCusto:Number(prodSelecionado.precoCusto),precoOriginal:Number(prodSelecionado.precoVenda),desconto:0,pctDesconto:0,estoqueDisp:dispAtual}];
    });
    setProdSel(""); setVarSel(""); setQtd("1");
  };

  const finalizarVenda = ()=>{
    if(itens.length===0) return;
    // Bloqueia se houver itens com estoque insuficiente
    if(estoqueInsuf.length>0) return;
    const cl = clientes.find(c=>c.id===clienteId);
    setVendas(vs=>[...vs,{id:uid(),clienteId,clienteNome:cl?.nome||"",itens,total,custo:custoItens,desconto:totalDesconto,pagamento,data:new Date().toISOString()}]);
    setProdutos(ps=>ps.map(p=>{
      const vendidos=itens.filter(i=>i.produtoId===p.id);
      if(!vendidos.length) return p;
      const tv=vendidos.reduce((s,i)=>s+i.qtd,0);
      const novoTotal=Math.max(0,Number(p.estoqueTotal||0)-tv);
      let novasVars=p.variacoes?[...p.variacoes]:[];
      vendidos.forEach(item=>{if(item.variacao)novasVars=novasVars.map(v=>v.nome===item.variacao?{...v,qtd:Math.max(0,Number(v.qtd)-item.qtd)}:v);});
      return {...p,estoqueTotal:novoTotal,variacoes:novasVars};
    }));
    const msgs=[
      {emoji:"🎉",title:"Venda realizada!",message:`${fmt(total)} no caixa! Parabéns!`,tip:"Continue registrando suas vendas para acompanhar o crescimento do negócio!"},
      {emoji:"💸",title:"Ka-ching!",message:`Você faturou ${fmt(total)}! Incrível!`,tip:"Cada venda registrada é um dado valioso para o seu negócio!"},
      {emoji:"🚀",title:"Mais uma venda!",message:`${fmt(total)} faturados — você está arrasando!`,tip:"Guarde parte do lucro para reinvestir no estoque!"},
    ];
    onCelebrate(msgs[Math.floor(Math.random()*msgs.length)]);
    setItens([]); setClienteId(""); setPagamento("dinheiro"); setModal(false); setProdSel(""); setQtd("1"); setDescontoCompra(0);
  };

  const hoje = new Date().toDateString();
  const agora = Date.now();
  const filtradas = filter==="hoje"
    ? vendas.filter(v=>new Date(v.data).toDateString()===hoje)
    : filter==="7d"
      ? vendas.filter(v=>agora-new Date(v.data).getTime()<=7*24*60*60*1000)
      : filter==="30d"
        ? vendas.filter(v=>agora-new Date(v.data).getTime()<=30*24*60*60*1000)
        : vendas;
  const pagtIcons = {dinheiro:"💵",pix:"📱",fiado:"📝"};
  const produtosAtivos = produtos.filter(p=>!p.deleted);

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>🛍️ Vendas</h2>
          <div style={{marginTop:4}}><Tip title="Por que registrar?" text="Cada venda registrada dá baixa no estoque automaticamente e fica no histórico do cliente. Registre sempre!" color={C.pink}>Por que registrar?</Tip></div>
        </div>
        <Btn onClick={()=>setModal(true)} small><Icon name="plus" size={14}/>Nova venda</Btn>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
        {[["todos","Todas"],["hoje","Hoje"],["7d","7 dias"],["30d","30 dias"]].map(([f,l])=>(
          <button key={f} onClick={()=>setFilter(f)} className="tap" style={{padding:"7px 15px",borderRadius:20,border:"none",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",background:filter===f?C.pink:C.pinkL,color:filter===f?C.white:C.pinkD,transition:"background .2s",flexShrink:0,whiteSpace:"nowrap"}}>{l}</button>
        ))}
      </div>

      {filtradas.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>🛍️</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Nenhuma venda ainda.</p>
          <p style={{fontSize:12,margin:0}}>Registre sua primeira venda!</p>
        </div>
      ):[...filtradas].reverse().map((v,i)=>(
        <Card key={v.id} style={{marginBottom:9,padding:12,animation:`fadeUp .28s ease ${i*.03}s both`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:800,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Cliente avulso"}</div>
              <div style={{fontSize:11,color:C.soft,marginTop:1}}>{new Date(v.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} · {pagtIcons[v.pagamento]||"💰"} {v.pagamento}</div>
              <div style={{marginTop:5,display:"flex",flexWrap:"wrap",gap:3}}>
                {v.itens?.map((it,j)=>(
                  <span key={j} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:7,padding:"2px 7px"}}>
                    {it.qtd}× {it.nome}{it.variacao?` · ${it.variacao}`:""}
                  </span>
                ))}
              </div>
              {v.desconto>0&&<div style={{fontSize:10,color:C.amber,marginTop:3,fontWeight:700}}>Desconto aplicado: {fmt(v.desconto)}</div>}
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <Badge>{fmt(v.total)}</Badge>
            </div>
          </div>
        </Card>
      ))}

      {modal&&(
        <Modal title="🛍️ Nova Venda" onClose={()=>{setModal(false);setItens([]);setClienteId("");setPagamento("dinheiro");setProdSel("");setQtd("1");setDescontoCompra(0);}}>
          <div style={{display:"flex",flexDirection:"column",gap:13}}>

            {/* Cliente */}
            <div>
              <SL right={<Tip title="Associar ao cliente" text="Vincular a venda a um cliente cria o histórico de compras dele automaticamente." color={C.purple}>Associar?</Tip>}>Cliente</SL>
              <select value={clienteId} onChange={e=>{setClienteId(e.target.value);if(!e.target.value&&pagamento==="fiado")setPagamento("dinheiro");}} style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:12,padding:"10px 13px",fontFamily:"inherit",fontSize:14,background:C.white,color:C.text}}>
                <option value="">Avulso (sem cadastro)</option>
                {clientes.filter(c=>!c.deleted).map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>

            {/* Pagamento */}
            <div>
              <SL right={<Tip title="Qual usar?" text="Dinheiro e Pix entram na hora. Fiado tem risco de não receber — exige cliente cadastrado. Prefira dinheiro ou Pix!" color={C.amber}>Qual usar?</Tip>}>Forma de Pagamento</SL>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                {[["dinheiro","💵","Dinheiro"],["pix","📱","Pix"],["fiado","📝","Fiado"]].map(([id,ico,l])=>{
                  const bloqueado = id==="fiado"&&!clienteId;
                  return (
                    <button key={id} onClick={()=>!bloqueado&&setPagamento(id)} className="tap"
                      style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 2px",borderRadius:11,
                        border:`2px solid ${pagamento===id?C.pink:bloqueado?C.pinkM+"80":C.pinkM}`,
                        background:pagamento===id?C.pinkS:bloqueado?"#F9FAFB":C.white,
                        cursor:bloqueado?"not-allowed":"pointer",fontFamily:"inherit",opacity:bloqueado?.5:1}}>
                      <span style={{fontSize:18}}>{ico}</span>
                      <span style={{fontSize:10,fontWeight:700,color:pagamento===id?C.pinkD:bloqueado?C.soft:C.gray}}>{l}</span>
                    </button>
                  );
                })}
              </div>
              {pagamento==="fiado"&&<div style={{marginTop:8}}><InfoBox emoji="⚠️" title="Atenção com o Fiado!" text="Fiado significa que o cliente vai pagar depois. Só faça fiado para pessoas de total confiança!" color={C.red}/></div>}
              {!clienteId&&<div style={{marginTop:6,fontSize:11,color:C.soft,textAlign:"center"}}>Selecione um cliente para habilitar o Fiado</div>}
            </div>

            {/* Produto */}
            <div style={{background:C.pinkL,borderRadius:14,padding:13}}>
              <SL>Adicionar Produto</SL>
              <select value={prodSel} onChange={e=>{setProdSel(e.target.value);setVarSel("");}} style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"9px 12px",fontFamily:"inherit",fontSize:13,background:C.white,marginBottom:8}}>
                <option value="">Selecione um produto…</option>
                {produtosAtivos.map(p=><option key={p.id} value={p.id}>{p.nome} — {fmt(p.precoVenda)} ({p.estoqueTotal??0} un.)</option>)}
              </select>
              {prodSelecionado&&(
                <div style={{display:"flex",gap:9,alignItems:"center",marginBottom:8,background:C.white,borderRadius:10,padding:"7px 10px"}}>
                  {/* Mostra foto da variação selecionada, ou foto geral, ou ícone */}
                  {(()=>{
                    const varObj = prodSelecionado.variacoes?.find(v=>v.nome===varSel);
                    const fotoExibida = varObj?.foto || prodSelecionado.foto;
                    return fotoExibida
                      ? <img src={fotoExibida} alt="" style={{width:40,height:40,borderRadius:8,objectFit:"cover",flexShrink:0,border:`2px solid ${varObj?.foto?C.pink:C.pinkM}`,transition:"all .2s"}}/>
                      : <div style={{width:40,height:40,borderRadius:8,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" size={14} color={C.pink}/></div>;
                  })()}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prodSelecionado.nome}</div>
                    <div style={{fontSize:11,color:C.gray}}>{fmt(prodSelecionado.precoVenda)} · {prodSelecionado.estoqueTotal??0} un. em estoque</div>
                  </div>
                </div>
              )}
              {prodSelecionado&&(
                <div style={{display:"grid",gridTemplateColumns:prodSelecionado.variacoes?.length?"1fr 70px":"1fr 70px",gap:7,marginBottom:8}}>
                  {prodSelecionado.variacoes?.length>0&&(
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {/* Se tiver fotos nas variações, exibe como grade visual */}
                      {prodSelecionado.variacoes.some(v=>v.foto)?(
                        <>
                          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                            {prodSelecionado.variacoes.map(v=>(
                              <button key={v.id} onClick={()=>setVarSel(v.nome)} className="tap"
                                style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:3,borderRadius:10,border:`2px solid ${varSel===v.nome?C.pink:C.pinkM}`,background:varSel===v.nome?C.pinkS:C.white,cursor:"pointer",transition:"all .18s"}}>
                                {v.foto
                                  ? <img src={v.foto} alt={v.nome} style={{width:42,height:42,borderRadius:7,objectFit:"cover",display:"block"}}/>
                                  : <div style={{width:42,height:42,borderRadius:7,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="tag" size={13} color={C.pink}/></div>
                                }
                                <span style={{fontSize:9,fontWeight:700,color:varSel===v.nome?C.pinkD:C.gray,maxWidth:48,textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"inherit"}}>{v.nome}</span>
                                <span style={{fontSize:8,color:C.soft,fontFamily:"inherit"}}>{v.qtd} un.</span>
                              </button>
                            ))}
                          </div>
                          {!varSel&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>Toque para escolher a variação</span>}
                        </>
                      ):(
                        <>
                          <select value={varSel} onChange={e=>setVarSel(e.target.value)}
                            style={{border:`1.5px solid ${!varSel?C.red:C.pinkM}`,borderRadius:10,padding:"8px 10px",fontFamily:"inherit",fontSize:13,background:!varSel?"#FFF5F5":C.white,color:!varSel?C.red:C.text}}>
                            <option value="">⚠️ Escolha a variação…</option>
                            {prodSelecionado.variacoes.map(v=><option key={v.id} value={v.nome}>{v.nome} — {v.qtd} un.</option>)}
                          </select>
                          {!varSel&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>Variação obrigatória</span>}
                        </>
                      )}
                    </div>
                  )}
                  <input value={qtd} onChange={e=>setQtd(e.target.value)} type="number" min="1" placeholder="Qtd" style={{border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"8px 8px",fontFamily:"inherit",fontSize:13,textAlign:"center",width:"100%"}}/>
                </div>
              )}
              <Btn onClick={addItem} v="ghost" small disabled={!prodSel||(prodSelecionado?.variacoes?.length>0&&!varSel)}><Icon name="plus" size={14}/>Adicionar item</Btn>
            </div>

            {/* Itens da venda — sem mostrar lucro (visível ao cliente) */}
            {itens.length>0&&(
              <div style={{border:`1.5px solid ${C.pinkM}`,borderRadius:13,padding:12}}>
                <SL>Itens da Venda</SL>
                {itens.map((it,i)=>(
                  <div key={i} style={{padding:"8px 0",borderBottom:`1px solid ${C.pinkS}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
                      {/* Foto da variação ou produto */}
                      {(it.varFoto||it.foto)&&(
                        <img src={it.varFoto||it.foto} alt="" style={{width:34,height:34,borderRadius:7,objectFit:"cover",flexShrink:0,border:`1.5px solid ${it.varFoto?C.pink:C.pinkM}`}}/>
                      )}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.nome}{it.variacao?` · ${it.variacao}`:""}</div>
                        <div style={{fontSize:12,color:C.gray,marginTop:1}}>
                          {fmt(it.precoVenda)} × {it.qtd} = <b style={{color:C.pinkD}}>{fmt(it.precoVenda*it.qtd)}</b>
                        </div>
                        {it.desconto>0&&<div style={{fontSize:11,color:C.amber,marginTop:1}}>Desconto: -{fmt(it.desconto*it.qtd)}</div>}
                      </div>
                      <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
                        {/* Controles de quantidade */}
                        <div style={{display:"flex",alignItems:"center",gap:1,background:C.pinkL,borderRadius:9,padding:"2px"}}>
                          <button onClick={()=>setItens(is=>is.map((x,j)=>j===i?{...x,qtd:Math.max(1,x.qtd-1)}:x))} className="tap" style={{background:C.white,border:"none",borderRadius:7,width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontWeight:900,color:C.pinkD,fontSize:16,lineHeight:1}}>−</button>
                          <span style={{fontSize:13,fontWeight:800,color:C.pinkD,minWidth:22,textAlign:"center"}}>{it.qtd}</span>
                          <button onClick={()=>setItens(is=>is.map((x,j)=>j===i?{...x,qtd:x.qtd+1}:x))} className="tap" style={{background:C.white,border:"none",borderRadius:7,width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontWeight:900,color:C.pinkD,fontSize:16,lineHeight:1}}>+</button>
                        </div>
                        {/* Botão de desconto */}
                        <button onClick={()=>setDescontoModal(i)} className="tap" title="Alterar valor" style={{background:"#FEF3C7",border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
                          <Icon name="percent" size={12} color="#92400E"/>
                        </button>
                        <button onClick={()=>setItens(is=>is.filter((_,j)=>j!==i))} style={{background:"none",border:"none",cursor:"pointer",color:C.red,fontSize:18,lineHeight:1,padding:"2px 4px"}}>✕</button>
                      </div>
                    </div>
                  </div>
                ))}
                <div style={{marginTop:10,paddingTop:8,borderTop:`2px solid ${C.pinkM}`}}>
                  {totalDesconto>0&&<div style={{fontSize:12,color:C.amber,fontWeight:700,textAlign:"right",marginBottom:4}}>Descontos nos itens: -{fmt(totalOriginal-subtotalItens)}</div>}
                  {descontoCompra>0&&<div style={{fontSize:12,color:C.amber,fontWeight:700,textAlign:"right",marginBottom:4}}>Desconto na compra: -{fmt(descontoCompra)}</div>}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontWeight:800,fontSize:15,color:C.pinkD}}>Total</span>
                    <span style={{fontWeight:900,fontSize:16,color:C.pinkD}}>{fmt(total)}</span>
                  </div>
                  <button onClick={()=>setDescontoCompraModal(true)} className="tap" style={{marginTop:8,width:"100%",background:"#FEF3C7",border:"none",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,color:"#92400E",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                    <Icon name="percent" size={13} color="#92400E"/>
                    {descontoCompra>0?`Desconto na compra: -${fmt(descontoCompra)} (alterar)`:"Aplicar desconto na compra total"}
                  </button>
                </div>
              </div>
            )}

            {estoqueInsuf.length>0&&(
              <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"10px 13px",display:"flex",flexDirection:"column",gap:4}}>
                <div style={{fontSize:12,fontWeight:800,color:C.red}}>⚠️ Estoque insuficiente!</div>
                {estoqueInsuf.map((it,i)=>{
                  const disp=estoqueDisp(it.produtoId,it.variacao);
                  return <div key={i} style={{fontSize:11,color:C.red}}>{it.nome}{it.variacao?` (${it.variacao})`:""}: pedido {it.qtd}, disponível {disp}</div>;
                })}
                <div style={{fontSize:11,color:"#7F1D1D",marginTop:2}}>Ajuste as quantidades para continuar.</div>
              </div>
            )}
            <Btn onClick={finalizarVenda} disabled={itens.length===0||estoqueInsuf.length>0} full>
              <Icon name="check" size={15}/> Finalizar Venda 🎉
            </Btn>
          </div>
        </Modal>
      )}

      {descontoModal!==null&&(
        <Modal title="" onClose={()=>setDescontoModal(null)} noPad>
          <DescontoModal
            item={itens[descontoModal]}
            onSave={updated=>setItens(is=>is.map((x,i)=>i===descontoModal?updated:x))}
            onClose={()=>setDescontoModal(null)}
          />
        </Modal>
      )}

      {descontoCompraModal&&(
        <Modal title="" onClose={()=>setDescontoCompraModal(false)} noPad>
          <DescontoCompraModal
            subtotal={subtotalItens}
            descAtual={descontoCompra}
            onSave={v=>setDescontoCompra(v)}
            onClose={()=>setDescontoCompraModal(false)}
          />
        </Modal>
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   GRÁFICO DE CRESCIMENTO SVG
══════════════════════════════════════════════════════════════════════════════ */
const GraficoCrescimento = ({pontos}) => {
  // pontos: [{label, receita, custo, lucro}]
  const [ativas,setAtivas] = useState({receita:true,custo:true,lucro:true});
  const W=320, H=160, PAD={t:12,r:12,b:32,l:46};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;

  if(pontos.length<2) return (
    <div style={{textAlign:"center",padding:"28px 0",color:C.soft}}>
      <div style={{fontSize:32,marginBottom:6}}>📈</div>
      <div style={{fontSize:12,fontWeight:600}}>Registre vendas em pelo menos 2 períodos para ver o gráfico de crescimento!</div>
    </div>
  );

  const series = [
    {key:"receita",label:"Receita",color:C.pink},
    {key:"custo",label:"Custos",color:C.amber},
    {key:"lucro",label:"Lucro",color:C.green},
  ];

  const allVals = pontos.flatMap(p=>series.filter(s=>ativas[s.key]).map(s=>p[s.key]||0));
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals.filter(v=>v>0), 0);
  const range = maxV - minV || 1;

  const xPos = (i) => PAD.l + (i/(pontos.length-1))*iW;
  const yPos = (v) => PAD.t + iH - ((v-minV)/range)*iH;

  const makePath = (key) => pontos.map((p,i)=>`${i===0?"M":"L"}${xPos(i).toFixed(1)},${yPos(p[key]||0).toFixed(1)}`).join(" ");
  const makeArea = (key) => {
    const line = pontos.map((p,i)=>`${i===0?"M":"L"}${xPos(i).toFixed(1)},${yPos(p[key]||0).toFixed(1)}`).join(" ");
    const base = `L${xPos(pontos.length-1).toFixed(1)},${(PAD.t+iH).toFixed(1)} L${PAD.l.toFixed(1)},${(PAD.t+iH).toFixed(1)} Z`;
    return line+" "+base;
  };

  // grid lines
  const gridCount = 4;
  const gridLines = Array.from({length:gridCount+1},(_,i)=>minV+(range/gridCount)*i);

  const fmtK = (v) => v>=1000?`${(v/1000).toFixed(1)}k`:`${v.toFixed(0)}`;

  const toggler = (key) => setAtivas(a=>({...a,[key]:!a[key]}));

  return (
    <div>
      {/* Legenda com toggles */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {series.map(s=>(
          <button key={s.key} onClick={()=>toggler(s.key)} className="tap"
            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 11px",borderRadius:20,border:`1.5px solid ${ativas[s.key]?s.color:C.pinkM}`,background:ativas[s.key]?s.color+"18":C.white,cursor:"pointer",fontFamily:"inherit",transition:"all .18s"}}>
            <div style={{width:10,height:10,borderRadius:3,background:ativas[s.key]?s.color:C.soft,transition:"background .18s",flexShrink:0}}/>
            <span style={{fontSize:11,fontWeight:700,color:ativas[s.key]?s.color:C.soft}}>{s.label}</span>
          </button>
        ))}
      </div>
      {/* SVG Chart */}
      <div style={{overflowX:"auto",width:"100%"}}>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",fontFamily:"inherit"}}>
          <defs>
            {series.map(s=>(
              <linearGradient key={s.key} id={`grad-${s.key}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={s.color} stopOpacity="0.22"/>
                <stop offset="100%" stopColor={s.color} stopOpacity="0.01"/>
              </linearGradient>
            ))}
          </defs>
          {/* Grid lines */}
          {gridLines.map((v,i)=>(
            <g key={i}>
              <line x1={PAD.l} y1={yPos(v)} x2={W-PAD.r} y2={yPos(v)} stroke={C.pinkM} strokeWidth="0.7" strokeDasharray="3,3"/>
              <text x={PAD.l-4} y={yPos(v)+4} textAnchor="end" fontSize="8" fill={C.soft} fontFamily="inherit">{fmtK(v)}</text>
            </g>
          ))}
          {/* Areas */}
          {series.filter(s=>ativas[s.key]).map(s=>(
            <path key={s.key+"-area"} d={makeArea(s.key)} fill={`url(#grad-${s.key})`}/>
          ))}
          {/* Lines */}
          {series.filter(s=>ativas[s.key]).map(s=>(
            <path key={s.key} d={makePath(s.key)} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
          ))}
          {/* Dots */}
          {series.filter(s=>ativas[s.key]).map(s=>
            pontos.map((p,i)=>(
              <circle key={s.key+i} cx={xPos(i)} cy={yPos(p[s.key]||0)} r="3.5" fill={C.white} stroke={s.color} strokeWidth="2"/>
            ))
          )}
          {/* X labels — espaçados para evitar sobreposição */}
          {pontos.map((p,i)=>{
            const step = pontos.length<=6?1:pontos.length<=10?2:3;
            if(i!==0&&i!==pontos.length-1&&i%step!==0) return null;
            return <text key={i} x={xPos(i)} y={H-PAD.b+14} textAnchor="middle" fontSize="8" fill={C.gray} fontFamily="inherit">{p.label}</text>;
          })}
        </svg>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   RELATÓRIOS
══════════════════════════════════════════════════════════════════════════════ */
const Relatorios = ({vendas,produtos}) => {
  const agora = new Date();

  // ── Período helpers
  const inicioSemana = () => {
    const d = new Date(agora);
    d.setDate(d.getDate() - d.getDay()); // domingo
    d.setHours(0,0,0,0);
    return d;
  };
  const fimSemana = () => {
    const d = inicioSemana();
    d.setDate(d.getDate()+6);
    d.setHours(23,59,59,999);
    return d;
  };
  const inicioMes = () => new Date(agora.getFullYear(), agora.getMonth(), 1, 0,0,0,0);
  const fimMes    = () => new Date(agora.getFullYear(), agora.getMonth()+1, 0, 23,59,59,999);
  const inicioHoje= () => { const d=new Date(agora); d.setHours(0,0,0,0); return d; };
  const fimHoje   = () => { const d=new Date(agora); d.setHours(23,59,59,999); return d; };

  const [tipoPeriodo, setTipoPeriodo] = useState("mes"); // hoje | semana | mes | custom
  const [offset, setOffset]           = useState(0);  // 0 = corrente, -1 = anterior, etc.
  const [customInicio, setCustomInicio] = useState("");
  const [customFim, setCustomFim]       = useState("");

  // Calcula datas de início e fim baseado no tipo e offset
  const calcRange = () => {
    if(tipoPeriodo==="custom"){
      const i = customInicio ? new Date(customInicio+"T00:00:00") : new Date(0);
      const f = customFim    ? new Date(customFim+"T23:59:59")    : new Date();
      return {inicio:i, fim:f};
    }
    if(tipoPeriodo==="hoje"){
      const i=inicioHoje(); const f=fimHoje();
      i.setDate(i.getDate()+offset); f.setDate(f.getDate()+offset);
      return {inicio:i,fim:f};
    }
    if(tipoPeriodo==="semana"){
      const i=inicioSemana(); const f=fimSemana();
      i.setDate(i.getDate()+offset*7); f.setDate(f.getDate()+offset*7);
      return {inicio:i,fim:f};
    }
    // mes
    const i=new Date(agora.getFullYear(), agora.getMonth()+offset, 1, 0,0,0,0);
    const f=new Date(agora.getFullYear(), agora.getMonth()+offset+1, 0, 23,59,59,999);
    return {inicio:i,fim:f};
  };

  const {inicio,fim} = calcRange();

  const labelPeriodo = () => {
    if(tipoPeriodo==="custom") return "Período personalizado";
    if(tipoPeriodo==="hoje"){
      if(offset===0) return "Hoje";
      return inicio.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
    }
    if(tipoPeriodo==="semana"){
      const i2=new Date(inicio), f2=new Date(fim);
      if(offset===0) return "Esta semana";
      return `${i2.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} – ${f2.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}`;
    }
    if(offset===0) return "Este mês";
    return inicio.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  };

  const vendasFiltradas = vendas.filter(v=>{
    const d=new Date(v.data);
    return d>=inicio && d<=fim;
  });

  const receitaTotal = vendasFiltradas.reduce((s,v)=>s+v.total,0);
  const custoTotal   = vendasFiltradas.reduce((s,v)=>s+v.custo,0);
  const descontoTotal= vendasFiltradas.reduce((s,v)=>s+(v.desconto||0),0);
  const lucroLiquido = receitaTotal-custoTotal;
  const margemReceita= receitaTotal>0?((lucroLiquido/receitaTotal)*100).toFixed(1):0;
  const ganhoSobCusto= custoTotal>0?((lucroLiquido/custoTotal)*100).toFixed(1):0;

  const contagem={};
  vendasFiltradas.forEach(v=>v.itens?.forEach(i=>{contagem[i.nome]=(contagem[i.nome]||0)+i.qtd;}));
  const maisVendidos=Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const medalhas=["🥇","🥈","🥉","4️⃣","5️⃣"];

  const pagtRes={};
  vendasFiltradas.forEach(v=>{pagtRes[v.pagamento||"?"]=(pagtRes[v.pagamento||"?"]||0)+v.total;});

  const vendasComDesconto=vendasFiltradas.filter(v=>(v.desconto||0)>0);

  // ── Pontos para o gráfico de crescimento
  // Agrupa vendas TODAS (sem filtro de período) por unidade de tempo para mostrar crescimento histórico
  const buildGrafico = () => {
    if(vendas.length===0) return [];
    // decide granularidade: se < 14 dias de diferença → por dia; < 90 dias → por semana; senão → por mês
    const todas = [...vendas].sort((a,b)=>new Date(a.data)-new Date(b.data));
    const primeiraData = new Date(todas[0].data);
    const diffDias = (agora-primeiraData)/(1000*60*60*24);

    const grupos={};
    todas.forEach(v=>{
      const d=new Date(v.data);
      let chave;
      if(diffDias<=31){
        chave = d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
      } else if(diffDias<=120){
        // semana ISO-like: semana do ano
        const startOfYear = new Date(d.getFullYear(),0,1);
        const week = Math.ceil(((d-startOfYear)/86400000+startOfYear.getDay()+1)/7);
        chave = `S${week}/${d.getFullYear().toString().slice(2)}`;
      } else {
        chave = d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
      }
      if(!grupos[chave]) grupos[chave]={label:chave,receita:0,custo:0,lucro:0};
      grupos[chave].receita+=v.total;
      grupos[chave].custo+=(v.custo||0);
      grupos[chave].lucro+=(v.total-(v.custo||0));
    });
    return Object.values(grupos).slice(-12); // máximo 12 pontos
  };

  const pontosGrafico = buildGrafico();

  const TIPOS=[
    {id:"hoje",l:"Dia"},
    {id:"semana",l:"Semana"},
    {id:"mes",l:"Mês"},
    {id:"custom",l:"Manual"},
  ];

  const podirAnterior = tipoPeriodo!=="custom";

  return (
    <div style={{padding:"14px 14px",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>📊 Relatórios</h2>
        <Tip title="Para que servem?" text="Relatórios mostram como seu negócio está indo. Analise toda semana!" color={C.purple}>Para que serve?</Tip>
      </div>

      {/* ── Seletor de período */}
      <Card style={{padding:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase",marginBottom:8}}>Período de análise</div>
        <div style={{display:"flex",gap:5,marginBottom:10}}>
          {TIPOS.map(t=>(
            <button key={t.id} onClick={()=>{setTipoPeriodo(t.id);setOffset(0);}} className="tap"
              style={{flex:1,padding:"7px 4px",borderRadius:10,border:`1.5px solid ${tipoPeriodo===t.id?C.pink:C.pinkM}`,background:tipoPeriodo===t.id?C.pinkS:C.white,fontFamily:"inherit",fontWeight:700,fontSize:12,color:tipoPeriodo===t.id?C.pinkD:C.gray,cursor:"pointer",transition:"all .15s"}}>
              {t.l}
            </button>
          ))}
        </div>

        {tipoPeriodo==="custom"?(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <FInput label="De" value={customInicio} onChange={setCustomInicio} type="date"/>
            <FInput label="Até" value={customFim} onChange={setCustomFim} type="date"/>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
            <button onClick={()=>setOffset(o=>o-1)} className="tap"
              style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.pinkM}`,background:C.white,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.pinkD} strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.pinkD}}>{labelPeriodo()}</div>
              {tipoPeriodo!=="hoje"&&<div style={{fontSize:10,color:C.soft,marginTop:1}}>
                {inicio.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} – {fim.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
              </div>}
            </div>
            <button onClick={()=>setOffset(o=>Math.min(0,o+1))} disabled={offset>=0} className="tap"
              style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.pinkM}`,background:offset>=0?"#F9F9F9":C.white,cursor:offset>=0?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:offset>=0?.4:1}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.pinkD} strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        )}

        {offset!==0&&tipoPeriodo!=="custom"&&(
          <button onClick={()=>setOffset(0)} style={{marginTop:8,width:"100%",background:C.pinkL,border:"none",borderRadius:8,padding:"6px",fontFamily:"inherit",fontWeight:700,fontSize:11,color:C.pinkD,cursor:"pointer"}}>
            ↩ Voltar ao período atual
          </button>
        )}
      </Card>

      <InfoBox emoji="🧠" title="Hábito de empreendedora!" text="Analise seus números toda semana. Quem conhece seus números toma decisões melhores!" color={C.pinkD}/>

      {/* ── Cards de métricas */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[
          {l:"Receita",v:fmt(receitaTotal),c:C.pink,e:"💰",t:"Tudo que entrou no caixa com as vendas."},
          {l:"Custo Total",v:fmt(custoTotal),c:C.amber,e:"🏷️",t:"Quanto você pagou pelos produtos já vendidos."},
          {l:"Lucro Líquido",v:fmt(lucroLiquido),c:C.green,e:"📈",t:"Receita − Custo. O dinheiro que ficou no seu bolso!"},
          {l:"Ganho s/ custo",v:`${ganhoSobCusto}%`,c:C.purple,e:"📊",t:`Quanto % você ganhou sobre o que pagou. Margem sobre receita: ${margemReceita}%.`},
        ].map((r,i)=>(
          <Card key={r.l} style={{padding:13,animation:`fadeUp .3s ease ${i*.06}s both`}}>
            <div style={{fontSize:22}}>{r.e}</div>
            <div style={{fontSize:18,fontWeight:900,color:r.c,marginTop:3}}>{r.v}</div>
            <div style={{fontSize:11,fontWeight:700,color:C.gray,marginTop:1}}>{r.l}</div>
            <div style={{fontSize:10,color:C.soft,marginTop:3,lineHeight:1.4}}>{r.t}</div>
          </Card>
        ))}
      </div>

      {vendasFiltradas.length===0&&(
        <div style={{textAlign:"center",padding:"20px 0",color:C.soft}}>
          <div style={{fontSize:38}}>🔍</div>
          <div style={{fontSize:13,fontWeight:600,marginTop:6}}>Nenhuma venda nesse período.</div>
          <div style={{fontSize:11,marginTop:3}}>Tente outro intervalo de datas!</div>
        </div>
      )}

      {/* ── Gráfico de crescimento histórico */}
      <Card style={{padding:13}}>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:4}}>📈 Crescimento do negócio</div>
        <div style={{fontSize:10,color:C.soft,marginBottom:10}}>Histórico completo de todas as vendas · ative/desative as linhas</div>
        <GraficoCrescimento pontos={pontosGrafico}/>
      </Card>

      {/* Descontos concedidos */}
      {descontoTotal>0&&(
        <Card style={{border:`1.5px solid ${C.amber}28`}}>
          <div style={{fontWeight:800,color:C.amber,fontSize:13,marginBottom:8}}>🏷️ Descontos concedidos</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:13,color:C.text}}>Total de descontos</span>
            <Badge color={C.amber}>{fmt(descontoTotal)}</Badge>
          </div>
          <div style={{fontSize:12,color:C.gray}}>{vendasComDesconto.length} venda(s) com desconto de {vendasFiltradas.length} no total</div>
          {vendasComDesconto.length>0&&(
            <div style={{marginTop:8}}>
              {vendasComDesconto.slice(0,3).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderTop:`1px solid ${C.pinkS}`,fontSize:12}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"65%"}}>{v.clienteNome||"Avulso"} · {new Date(v.data).toLocaleDateString("pt-BR")}</span>
                  <span style={{color:C.amber,fontWeight:700}}>-{fmt(v.desconto)}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {/* Mais vendidos */}
      <Card>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>🏆 Produtos mais vendidos</div>
        {maisVendidos.length===0?<p style={{color:C.soft,fontSize:13,margin:0}}>Nenhuma venda nesse período!</p>
          :maisVendidos.map(([nome,qtd],i)=>{
            const bp=maisVendidos[0][1]>0?(qtd/maisVendidos[0][1])*100:0;
            return (
              <div key={nome} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:8}}>
                  <div style={{display:"flex",gap:7,alignItems:"center",flex:1,minWidth:0}}>
                    <span style={{fontSize:16,flexShrink:0}}>{medalhas[i]}</span>
                    <span style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nome}</span>
                  </div>
                  <Badge>{qtd} un.</Badge>
                </div>
                <div style={{height:6,background:C.pinkL,borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${bp}%`,background:`linear-gradient(90deg,${C.pink},${C.pinkD})`,borderRadius:99,transition:"width .8s ease"}}/>
                </div>
              </div>
            );
          })
        }
      </Card>

      {/* Pagamentos */}
      {Object.keys(pagtRes).length>0&&(
        <Card>
          <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>💳 Por forma de pagamento</div>
          {Object.entries(pagtRes).map(([pgt,val])=>(
            <div key={pgt} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${C.pinkS}`}}>
              <span style={{fontSize:13,fontWeight:600}}>{pgt}</span>
              <Badge>{fmt(val)}</Badge>
            </div>
          ))}
        </Card>
      )}

      {/* Estoque */}
      <Card>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>📦 Situação do estoque</div>
        {produtos.filter(p=>!p.deleted).length===0
          ?<p style={{color:C.soft,fontSize:13,margin:0}}>Nenhum produto cadastrado.</p>
          :produtos.filter(p=>!p.deleted).map(p=>{
            const est=Number(p.estoqueTotal??0);
            return (
              <div key={p.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",gap:8}}>
                  <span style={{fontSize:13,fontWeight:600,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nome}</span>
                  <Badge color={est===0?C.red:est<=5?C.amber:C.green}>{est===0?"Zerado!":est+" un."}</Badge>
                </div>
                {p.variacoes?.length>0&&(
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,paddingBottom:6}}>
                    {p.variacoes.map(v=><span key={v.id} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:8,padding:"2px 7px"}}>{v.nome}: {v.qtd}</span>)}
                  </div>
                )}
                <div style={{height:1,background:C.pinkS}}/>
              </div>
            );
          })
        }
      </Card>

      <Card style={{background:`linear-gradient(135deg,${C.pinkD},#9D174D)`,border:"none"}}>
        <div style={{color:C.white,fontSize:13,fontWeight:800,marginBottom:6}}>💡 Segredo do sucesso</div>
        <div style={{color:C.pinkM,fontSize:13,lineHeight:1.55}}>
          Comprar bem + precificar certo + atender bem = <strong style={{color:C.white}}>negócio de sucesso</strong>. Você está construindo isso! 🌸
        </div>
      </Card>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════════════════════════
   BACKUP / RESTAURAÇÃO
══════════════════════════════════════════════════════════════════════════════ */
/* ─── BotaoPerigoso — botão com contagem regressiva de 10s ───────────────── */
const BotaoPerigoso = ({label,onConfirm,segundos=10,cor=C.red}) => {
  const [contando,setContando] = useState(false);
  const [restante,setRestante] = useState(segundos);
  const timerRef = useRef(null);

  const iniciar = () => { setContando(true); setRestante(segundos); };
  const cancelar = () => { setContando(false); setRestante(segundos); clearInterval(timerRef.current); };

  useEffect(()=>{
    if(!contando) return;
    timerRef.current = setInterval(()=>{
      setRestante(r=>{
        if(r<=1){ clearInterval(timerRef.current); setContando(false); setRestante(segundos); onConfirm(); return segundos; }
        return r-1;
      });
    },1000);
    return ()=>clearInterval(timerRef.current);
  },[contando]);

  if(!contando) return (
    <button onClick={iniciar} className="tap" style={{width:"100%",padding:"12px",borderRadius:14,background:cor+"18",border:`2px solid ${cor}44`,fontFamily:"inherit",fontWeight:800,fontSize:14,color:cor,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
      <Icon name="trash" size={16} color={cor}/>{label}
    </button>
  );

  // Contagem regressiva ativa — botões disponíveis imediatamente
  const pct = ((segundos-restante)/segundos)*100;
  return (
    <div style={{borderRadius:14,border:`2px solid ${cor}`,overflow:"hidden",background:cor+"08"}}>
      {/* Barra de progresso */}
      <div style={{height:4,background:cor+"22",position:"relative"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,background:cor,transition:"width 1s linear",borderRadius:99}}/>
      </div>
      <div style={{padding:"12px 14px"}}>
        <div style={{fontSize:13,fontWeight:800,color:cor,marginBottom:10,textAlign:"center"}}>
          ⏳ Auto-confirmando em <span style={{fontSize:20,fontWeight:900}}>{restante}s</span> — tem certeza?
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={cancelar} className="tap" style={{flex:1,padding:"10px",borderRadius:12,background:C.pinkL,border:"none",fontFamily:"inherit",fontWeight:700,fontSize:13,color:C.pinkD,cursor:"pointer"}}>
            ✋ Cancelar
          </button>
          <button onClick={()=>{clearInterval(timerRef.current);setContando(false);setRestante(segundos);onConfirm();}} className="tap"
            style={{flex:1,padding:"10px",borderRadius:12,background:cor,border:"none",fontFamily:"inherit",fontWeight:800,fontSize:13,color:C.white,cursor:"pointer"}}>
            ✅ Confirmar já
          </button>
        </div>
      </div>
    </div>
  );
};

const Backup = ({produtos,clientes,vendas,setProdutos,setClientes,setVendas,onClose}) => {
  // menu | importando | preview | sucesso | apagar
  const [fase,setFase] = useState("menu");
  const [preview,setPreview] = useState(null);
  const [tipoSucesso,setTipoSucesso] = useState(""); // exportar | importar | apagar
  const [erro,setErro] = useState("");
  const fileRef = useRef();

  const gerarNomeArquivo = () =>
    `juju-store-backup-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`;

  const exportarJSON = (dados, nome) => {
    const blob = new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const exportar = () => {
    exportarJSON({versao:"1.9.0",exportadoEm:new Date().toISOString(),produtos,clientes,vendas}, gerarNomeArquivo());
    setTipoSucesso("exportar");
    setFase("sucesso");
  };

  const lerArquivo = (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const dados = JSON.parse(ev.target.result);
        if(!dados.produtos||!dados.clientes||!dados.vendas) throw new Error("Arquivo inválido ou corrompido.");
        if(!Array.isArray(dados.produtos)||!Array.isArray(dados.clientes)||!Array.isArray(dados.vendas))
          throw new Error("Formato de dados incorreto.");
        setPreview(dados); setFase("preview"); setErro("");
      } catch(e) {
        setErro(e.message||"Não foi possível ler o arquivo. Verifique se é um backup válido.");
        setFase("importando");
      }
    };
    reader.readAsText(file);
  };

  const confirmarImport = () => {
    setProdutos(preview.produtos);
    setClientes(preview.clientes);
    setVendas(preview.vendas);
    setTipoSucesso("importar");
    setFase("sucesso");
  };

  // Apagar tudo: gera backup automático antes de limpar
  const executarApagar = () => {
    exportarJSON(
      {versao:"1.8.0",exportadoEm:new Date().toISOString(),produtos,clientes,vendas},
      `juju-store-ANTES-DE-APAGAR-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`
    );
    setTimeout(()=>{
      setProdutos([]);
      setClientes([]);
      setVendas([]);
      setTipoSucesso("apagar");
      setFase("sucesso");
    }, 600);
  };

  const fmtData = (iso) => {
    try { return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
    catch { return iso; }
  };

  const totalDados = produtos.filter(p=>!p.deleted).length + clientes.filter(c=>!c.deleted).length + vendas.length;

  return (
    <Modal title="💾 Backup e Restauração" onClose={onClose}>

      {/* ── MENU PRINCIPAL */}
      {fase==="menu"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <InfoBox emoji="🛡️" title="Seus dados são preciosos!" text="Faça backup regularmente. Se trocar de celular ou limpar o navegador, seus dados serão perdidos sem backup!" color={C.pinkD}/>

          {/* Exportar */}
          <div style={{background:C.pinkL,borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.pinkD,fontSize:14,marginBottom:4}}>📤 Exportar backup</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:10,lineHeight:1.5}}>
              Salva um arquivo com <b>{produtos.filter(p=>!p.deleted).length}</b> produtos, <b>{clientes.filter(c=>!c.deleted).length}</b> clientes e <b>{vendas.length}</b> vendas.
            </div>
            <Btn onClick={exportar} full><Icon name="check" size={15}/>Baixar backup agora</Btn>
          </div>

          {/* Importar */}
          <div style={{background:"#F0FDF4",border:"1.5px solid #BBF7D0",borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.green,fontSize:14,marginBottom:4}}>📥 Restaurar backup</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:10,lineHeight:1.5}}>
              Selecione um arquivo .json para restaurar seus dados. <b style={{color:C.red}}>Substitui tudo!</b>
            </div>
            <Btn onClick={()=>{setFase("importando");fileRef.current?.click();}} v="ghost" full>
              <Icon name="restore" size={15}/>Selecionar arquivo de backup
            </Btn>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{lerArquivo(e.target.files[0]); e.target.value="";}}/>
          </div>

          {/* Apagar tudo */}
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.red,fontSize:14,marginBottom:4}}>🗑️ Apagar todos os dados</div>
            <div style={{fontSize:12,color:"#7F1D1D",marginBottom:10,lineHeight:1.5}}>
              Remove <b>todos</b> os produtos, clientes e vendas. Um backup é gerado automaticamente antes de apagar — não vai perder nada por acidente!
            </div>
            {totalDados===0
              ? <div style={{fontSize:12,color:C.soft,textAlign:"center",padding:"6px 0"}}>Nenhum dado para apagar.</div>
              : <button onClick={()=>setFase("apagar")} className="tap"
                  style={{width:"100%",padding:"11px",borderRadius:12,background:"#FEE2E2",border:"none",fontFamily:"inherit",fontWeight:800,fontSize:14,color:C.red,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <Icon name="trash" size={16} color={C.red}/>Apagar tudo…
                </button>
            }
          </div>

          <InfoBox emoji="💡" title="Dica de ouro" text="Faça backup toda semana! Salve no Google Drive ou WhatsApp pessoal para nunca perder nada." color={C.purple}/>

          <div style={{textAlign:"center",paddingTop:4}}>
            <span style={{fontSize:11,color:C.soft,fontWeight:600}}>Juju Store — versão 1.9.0</span>
          </div>
        </div>
      )}

      {/* ── AGUARDANDO ARQUIVO */}
      {fase==="importando"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <InfoBox emoji="📁" title="Aguardando arquivo..." text="Selecione o arquivo .json de backup da sua lojinha." color={C.green}/>
          {erro&&(
            <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"12px 14px"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.red,marginBottom:4}}>❌ Erro ao ler arquivo</div>
              <div style={{fontSize:12,color:C.red}}>{erro}</div>
            </div>
          )}
          <Btn onClick={()=>fileRef.current?.click()} full><Icon name="restore" size={15}/>Selecionar arquivo</Btn>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
            onChange={e=>{lerArquivo(e.target.files[0]); e.target.value="";}}/>
          <Btn onClick={()=>{setFase("menu");setErro("");}} v="outline" full>Voltar</Btn>
        </div>
      )}

      {/* ── PREVIEW DO BACKUP */}
      {fase==="preview"&&preview&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{background:"#FFFBEB",border:"1.5px solid #FDE68A",borderRadius:14,padding:"12px 14px"}}>
            <div style={{fontWeight:800,color:"#92400E",fontSize:13,marginBottom:8}}>📋 Prévia do backup</div>
            {[
              {e:"📅",l:"Exportado em",v:fmtData(preview.exportadoEm)},
              {e:"📦",l:"Produtos",v:`${preview.produtos?.length||0} (${preview.produtos?.filter(p=>!p.deleted).length||0} ativos)`},
              {e:"👥",l:"Clientes",v:`${preview.clientes?.length||0} (${preview.clientes?.filter(c=>!c.deleted).length||0} ativos)`},
              {e:"🛍️",l:"Vendas",v:`${preview.vendas?.length||0} registros`},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #FDE68A"}}>
                <span style={{fontSize:12,color:"#78350F"}}>{r.e} {r.l}</span>
                <span style={{fontSize:12,fontWeight:700,color:"#92400E"}}>{r.v}</span>
              </div>
            ))}
          </div>
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"10px 13px"}}>
            <div style={{fontSize:12,fontWeight:800,color:C.red,marginBottom:3}}>⚠️ Atenção!</div>
            <div style={{fontSize:11,color:C.red,lineHeight:1.5}}>Esta ação substitui <b>todos os seus dados atuais</b> pelos dados do backup.</div>
          </div>
          {/* Botão com contagem regressiva para restaurar */}
          <BotaoPerigoso
            label="Restaurar este backup"
            cor={C.green}
            onConfirm={confirmarImport}
          />
          <Btn onClick={()=>setFase("menu")} v="outline" full>Cancelar</Btn>
        </div>
      )}

      {/* ── CONFIRMAR APAGAR TUDO */}
      {fase==="apagar"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{textAlign:"center",padding:"8px 0"}}>
            <div style={{fontSize:52,marginBottom:6}}>🗑️</div>
            <div style={{fontSize:16,fontWeight:900,color:C.red,marginBottom:4}}>Apagar todos os dados?</div>
            <div style={{fontSize:13,color:C.gray,lineHeight:1.55}}>Esta ação apaga <b style={{color:C.red}}>tudo</b> permanentemente.</div>
          </div>

          {/* Resumo do que será apagado */}
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:14,padding:"12px 14px"}}>
            <div style={{fontWeight:800,color:C.red,fontSize:12,marginBottom:8}}>O que será apagado:</div>
            {[
              {e:"📦",l:"Produtos",v:produtos.filter(p=>!p.deleted).length},
              {e:"👥",l:"Clientes",v:clientes.filter(c=>!c.deleted).length},
              {e:"🛍️",l:"Vendas",v:vendas.length},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #FECACA"}}>
                <span style={{fontSize:12,color:"#7F1D1D"}}>{r.e} {r.l}</span>
                <span style={{fontSize:12,fontWeight:800,color:C.red}}>{r.v} registros</span>
              </div>
            ))}
          </div>

          <div style={{background:"#ECFDF5",border:"1.5px solid #BBF7D0",borderRadius:12,padding:"10px 13px",display:"flex",gap:9,alignItems:"center"}}>
            <span style={{fontSize:20,flexShrink:0}}>✅</span>
            <div style={{fontSize:12,color:"#065F46",lineHeight:1.5,fontWeight:600}}>
              Um backup será baixado automaticamente <b>antes</b> de apagar tudo. Você não vai perder nada por acidente!
            </div>
          </div>

          {/* Botão perigoso com 10 segundos */}
          <BotaoPerigoso
            label="Apagar tudo e baixar backup"
            cor={C.red}
            segundos={10}
            onConfirm={executarApagar}
          />
          <Btn onClick={()=>setFase("menu")} v="outline" full>Cancelar — voltar</Btn>
        </div>
      )}

      {/* ── SUCESSO */}
      {fase==="sucesso"&&(
        <div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:60,marginBottom:12,animation:"float 2s ease-in-out infinite"}}>
            {tipoSucesso==="apagar"?"🧹":"✅"}
          </div>
          <div style={{fontSize:17,fontWeight:900,color:tipoSucesso==="apagar"?C.green:C.green,marginBottom:8}}>
            {tipoSucesso==="exportar"&&"Backup exportado!"}
            {tipoSucesso==="importar"&&"Dados restaurados!"}
            {tipoSucesso==="apagar"&&"Dados apagados com sucesso!"}
          </div>
          <div style={{fontSize:13,color:C.gray,marginBottom:20,lineHeight:1.6}}>
            {tipoSucesso==="exportar"&&"Salve o arquivo em local seguro — Google Drive, WhatsApp ou e-mail."}
            {tipoSucesso==="importar"&&"Todos os registros foram atualizados com os dados do backup."}
            {tipoSucesso==="apagar"&&"O backup foi baixado antes de apagar. Sua lojinha está zerada e pronta para recomeçar!"}
          </div>
          <Btn onClick={onClose} full>Fechar</Btn>
        </div>
      )}

    </Modal>
  );
};

function App() {
  useEffect(()=>{injectStyles();},[]);
  const [tab,setTab]               = useState("home");
  const [celebration,setCelebration] = useState(null);
  const [produtos,setProdutos]     = useStorage("mlv3_produtos",[]);
  const [clientes,setClientes]     = useStorage("mlv3_clientes",[]);
  const [vendas,setVendas]         = useStorage("mlv3_vendas",[]);
  const [showBackup,setShowBackup] = useState(false);
  const [buscaGlobal,setBuscaGlobal] = useState("");
  const [showBusca,setShowBusca]   = useState(false);
  const [buscaTabDestino,setBuscaTabDestino] = useState(null); // {tab, filtro}

  const closeCeleb = useCallback(()=>setCelebration(null),[]);

  // ── Busca global: pesquisa em produtos, clientes e vendas simultaneamente

  const resClientes = queryBusca.length>=2

    : [];
  const resVendas = queryBusca.length>=2
    ? vendas.filter(v=>(v.clienteNome||"").toLowerCase().includes(queryBusca)||v.itens?.some(i=>i.nome.toLowerCase().includes(queryBusca))).slice(0,4)
    : [];
  const temResultado = resProdutos.length>0||resClientes.length>0||resVendas.length>0;

  const irPara = (novaTab, filtro="") => { setTab(novaTab); setBuscaGlobal(""); setShowBusca(false); if(filtro) setBuscaTabDestino({tab:novaTab,filtro}); };

  const TABS=[
    {id:"home",      label:"Início",     icon:"home" },
    {id:"produtos",  label:"Produtos",   icon:"box"  },

    {id:"vendas",    label:"Vendas",     icon:"cart" },

                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  {resVendas.length>0&&(
                    <div>

                        <span>🛍️ Vendas</span>
                        <button onClick={()=>irPara("vendas")} style={{background:"none",border:"none",fontSize:10,color:C.green,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Ver todas →</button>
                      </div>
                      {resVendas.map(v=>(
                        <div key={v.id} onClick={()=>irPara("vendas")} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",cursor:"pointer",borderTop:`1px solid ${C.pinkS}`}}>
                          <div style={{width:32,height:32,borderRadius:8,background:"#ECFDF5",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16}}>{v.pagamento==="pix"?"📱":v.pagamento==="fiado"?"📝":"💵"}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Cliente avulso"}</div>
                            <div style={{fontSize:11,color:C.soft}}>{new Date(v.data).toLocaleDateString("pt-BR")} · {fmt(v.total)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{height:8}}/>
                </>
              )}
            </div>
          </>
        )}
      </div>

      <div style={{position:"relative",zIndex:1,marginTop:4}}>{PAGES[tab]}</div>
      <nav className="safe-nav" style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,height:NAV_H,background:"rgba(255,255,255,.97)",backdropFilter:"blur(10px)",borderTop:`1px solid ${C.pinkM}`,display:"flex",justifyContent:"space-around",alignItems:"center",zIndex:100,boxShadow:"0 -2px 20px rgba(244,114,182,.12)"}}>
        {TABS.map(t=>{
          const active=tab===t.id;
          return (
            <button key={t.id} onClick={()=>setTab(t.id)} className="tap" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 6px",flex:1,minWidth:0,color:active?C.pinkD:C.soft}}>
              <div style={{padding:6,borderRadius:12,background:active?C.pinkS:"transparent",transform:active?"scale(1.1)":"scale(1)",transition:"all .2s"}}>
                <Icon name={t.icon} size={19} color={active?C.pinkD:C.soft}/>
              </div>
              <span style={{fontSize:9,fontWeight:active?800:500}}>{t.label}</span>
            </button>
          );
        })}
      </nav>
      <Celebration data={celebration} onClose={closeCeleb}/>
      {showBackup&&(
        <Backup
          produtos={produtos} clientes={clientes} vendas={vendas}
          setProdutos={setProdutos} setClientes={setClientes} setVendas={setVendas}
          onClose={()=>setShowBackup(false)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

  </script>
  <script>
    window.addEventListener('load',()=>{setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),450);}},1800);});
  </script>
</body>
</html>
