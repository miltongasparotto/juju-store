const Dashboard = ({produtos,vendas,clientes,onSetTab}) => {
  const agora = new Date();
  const hoje = agora.toDateString();
  const hora = agora.getHours();
  const saudacao = hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const [showLearn,setShowLearn] = useState(false);

  const vendasHoje = vendas.filter(v=>new Date(v.data).toDateString()===hoje);

  const clientesDevendo = clientes.filter(c=>!c.deleted&&vendas.some(v=>v.clienteId===c.id&&v.pagamento==="fiado"&&!v.fiadoPago));
  const totalFiadoPendente = vendas.filter(v=>v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);

  const aniversariantesSemana = clientes.filter(c=>{
    if(c.deleted||!c.nascimento) return false;
    const [,m,d] = c.nascimento.split("-");
    const nascMes = Number(m), nascDia = Number(d);
    for(let i=0;i<7;i++){
      const dia = new Date(agora);
      dia.setDate(agora.getDate()+i);
      if(dia.getDate()===nascDia&&dia.getMonth()+1===nascMes) return true;
    }
    return false;
  });
  const isBdayHoje = (c)=>{
    if(!c.nascimento) return false;
    const [,m,d]=c.nascimento.split("-");
    return Number(d)===agora.getDate()&&Number(m)===agora.getMonth()+1;
  };
  const diasAteAniv = (c)=>{
    if(!c.nascimento) return 99;
    const [,m,d]=c.nascimento.split("-");
    for(let i=0;i<7;i++){
      const dia=new Date(agora); dia.setDate(agora.getDate()+i);
      if(dia.getDate()===Number(d)&&dia.getMonth()+1===Number(m)) return i;
    }
    return 99;
  };

  const estoqueBaixoItems = [];
  produtos.filter(p=>!p.deleted).forEach(p=>{
    const vars = p.variacoes||[];
    if(vars.length>0){
      vars.forEach(v=>{
        if(Number(v.qtd||0)<=3){
          estoqueBaixoItems.push({id:`${p.id}-${v.id}`,nome:p.nome,variacao:v.nome,qtd:Number(v.qtd||0),foto:v.foto||p.foto});
        }
      });
    } else {
      if(Number(p.estoqueTotal||0)<=3){
        estoqueBaixoItems.push({id:p.id,nome:p.nome,variacao:"",qtd:Number(p.estoqueTotal||0),foto:p.foto});
      }
    }
  });

  return (
    <div style={{padding:"16px 14px 14px",display:"flex",flexDirection:"column",gap:13}}>

      {}
      <div style={{textAlign:"center",paddingTop:6}}>
        <div style={{fontSize:40,animation:"float 3s ease-in-out infinite"}}>🌸</div>
        <div style={{fontSize:26,fontWeight:900,letterSpacing:".01em",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:2}}>Juju Store</div>
        <h1 style={{margin:"2px 0 2px",fontSize:16,fontWeight:700,color:C.gray}}>{saudacao}!</h1>
        <p style={{margin:0,color:C.soft,fontSize:12}}>{agora.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</p>
      </div>

      {}
      <GuiaAcoes tab="home"/>
      <div onClick={()=>setShowLearn(o=>!o)} className="tap" style={{background:`linear-gradient(135deg,${C.pinkD},#9D174D)`,borderRadius:16,padding:"13px 15px",display:"flex",gap:11,alignItems:"center",cursor:"pointer"}}>
        <span style={{fontSize:26,flexShrink:0}}>📚</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{color:C.white,fontWeight:800,fontSize:14}}>Aprenda o Vocabulário do Negócio</div>
          <div style={{color:C.pinkM,fontSize:12,marginTop:1,lineHeight:1.4}}>{showLearn?"Toque para fechar ▲":"Entenda os termos que toda empreendedora precisa saber! ▼"}</div>
        </div>
      </div>

      {showLearn&&(
        <Card style={{border:`1.5px solid ${C.pinkM}`,animation:"slideDown .25s ease",padding:"14px 13px"}}>
          <div style={{fontWeight:800,color:C.pinkD,fontSize:14,marginBottom:10}}>📖 Dicionário do Negócio</div>
          {[
            {e:"💰",t:"Receita",d:"Tudo que entra no caixa com as vendas. É o valor total que você cobrou dos clientes — antes de descontar qualquer custo."},
            {e:"🏷️",t:"Custo",d:"Quanto você pagou para ter o produto. É o preço que você pagou à fornecedora. Sem saber o custo, fica impossível saber se está lucrando!"},
            {e:"📈",t:"Lucro",d:"É o que sobrou depois de pagar pelos produtos. Receita menos custo. Esse é o número mais importante do seu negócio!"},
            {e:"📊",t:"Margem de Lucro",d:"Quanto do preço que você cobra é lucro de verdade. Ex: vende por R$30, lucra R$10 → margem de 33%. Quanto maior, melhor!"},
            {e:"🔄",t:"Giro de Estoque",d:"O quanto seus produtos estão sendo vendidos. Venda rápida = bom giro. Produto parado na prateleira é dinheiro parado!"},
            {e:"📦",t:"Estoque",d:"Quantidade de produtos disponíveis para vender. Estoque zerado = venda perdida. Estoque demais = dinheiro parado."},
            {e:"📝",t:"Fiado",d:"Venda sem pagamento imediato — o cliente promete pagar depois. Tem risco! Só faça fiado para clientes de total confiança."},
            {e:"🤝",t:"Cliente fiel",d:"Cliente que volta sempre. Custa 5× menos manter um cliente do que conquistar um novo. Vale a pena mimar!"},
            {e:"💸",t:"Fluxo de Caixa",d:"O controle de tudo que entra e sai do seu negócio. Ter lucro no papel mas sem dinheiro em caixa é um sinal de alerta!"},
            {e:"🎯",t:"Precificação",d:"O processo de definir o preço de venda. Regra básica: preço deve cobrir o custo, as despesas e ainda sobrar lucro para você!"},
          ].map(d=>(
            <div key={d.t} style={{display:"flex",gap:9,padding:"8px 0",borderBottom:`1px solid ${C.pinkS}`}}>
              <span style={{fontSize:18,flexShrink:0,lineHeight:1.5}}>{d.e}</span>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:C.text}}>{d.t}</div>
                <div style={{fontSize:12,color:C.gray,lineHeight:1.45,marginTop:1}}>{d.d}</div>
              </div>
            </div>
          ))}
        </Card>
      )}

      {}
      <Card style={{padding:13,display:"flex",alignItems:"center",gap:12,background:`linear-gradient(135deg,${C.pinkS},${C.white})`}}>
        <div style={{width:48,height:48,borderRadius:14,background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:22}}>🛍️</span>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,fontWeight:700,color:C.soft,textTransform:"uppercase",letterSpacing:".05em"}}>Vendas realizadas hoje</div>
          <div style={{fontSize:28,fontWeight:900,color:C.pinkD,lineHeight:1.1}}>{vendasHoje.length}</div>
          <div style={{fontSize:11,color:C.gray,marginTop:1}}>{vendasHoje.length===0?"Nenhuma venda ainda hoje":vendasHoje.length===1?"1 venda registrada":`${vendasHoje.length} vendas registradas`}</div>
        </div>
      </Card>

      {}
      {clientesDevendo.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.red}`,background:"#FFF8F8"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontWeight:800,color:C.red,fontSize:13}}>📝 Clientes devendo</div>
            <Badge color={C.red}>{fmt(totalFiadoPendente)}</Badge>
          </div>
          {clientesDevendo.map(c=>{
            const totalDev=vendas.filter(v=>v.clienteId===c.id&&v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);
            return (
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderTop:`1px solid #FEE2E2`,gap:8}}>
                <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0,flex:1}}>
                  {c.foto
                    ?<img src={c.foto} alt="" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:`2px solid ${C.red}44`}}/>
                    :<div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${C.red},#DC2626)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:11,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
                  }
                  <span style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  <span style={{fontSize:13,fontWeight:800,color:C.red}}>{fmt(totalDev)}</span>
                  <button onClick={()=>lembreteWpp(c,totalDev)} className="tap" title="Enviar lembrete via WhatsApp"
                    style={{width:30,height:30,borderRadius:50,background:"#DCF8C6",border:"none",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
                    <span style={{fontSize:16}}>📲</span>
                  </button>
                </div>
              </div>
            );
          })}
          <div style={{fontSize:10,color:C.soft,marginTop:6}}>📲 = enviar lembrete de cobrança via WhatsApp</div>
        </Card>
      )}

      {}
      {aniversariantesSemana.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.amber}`,background:"#FFFBEB"}}>
          <div style={{fontWeight:800,color:"#92400E",fontSize:13,marginBottom:8}}>🎂 Aniversariantes da semana</div>
          {aniversariantesSemana.sort((a,b)=>diasAteAniv(a)-diasAteAniv(b)).map(c=>{
            const hoje=isBdayHoje(c);
            const dias=diasAteAniv(c);
            return (
              <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderTop:`1px solid #FDE68A`}}>
                {c.foto
                  ?<img src={c.foto} alt="" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:`2px solid ${C.amber}55`}}/>
                  :<div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${C.amber},#D97706)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:11,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
                }
                <span style={{fontSize:13,fontWeight:700,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                <span style={{fontSize:11,fontWeight:700,background:hoje?"#FEF3C7":C.white,color:hoje?"#92400E":C.amber,borderRadius:20,padding:"2px 9px",flexShrink:0,border:`1px solid ${C.amber}44`}}>
                  {hoje?"🎉 Hoje!":dias===1?"amanhã":`em ${dias} dias`}
                </span>
              </div>
            );
          })}
        </Card>
      )}

      {}
      {estoqueBaixoItems.length>0&&(
        <Card style={{borderLeft:`4px solid ${C.amber}`}}>
          <div style={{fontWeight:800,color:C.amber,fontSize:13,marginBottom:8}}>⚠️ Estoque baixo — hora de reabastecer!</div>
          {estoqueBaixoItems.map(item=>(
            <div key={item.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 0",borderTop:`1px solid ${C.pinkS}`,gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0,flex:1}}>
                {item.foto
                  ?<img src={item.foto} alt="" style={{width:26,height:26,borderRadius:6,objectFit:"cover",flexShrink:0,border:`1.5px solid ${C.pinkM}`}}/>
                  :<div style={{width:26,height:26,borderRadius:6,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" size={11} color={C.pink}/></div>
                }
                <div style={{minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nome}</div>
                  {item.variacao&&<div style={{fontSize:10,color:C.soft}}>{item.variacao}</div>}
                </div>
              </div>
              <Badge color={item.qtd===0?C.red:C.amber}>{item.qtd===0?"Zerado!":item.qtd+" un."}</Badge>
            </div>
          ))}
        </Card>
      )}

      {}
      <Card>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>🛍️ Últimas vendas</div>
        {vendas.length===0
          ?<p style={{color:C.soft,fontSize:13,textAlign:"center",margin:0}}>Nenhuma venda ainda — vamos lá! 💪</p>
          :[...vendas].reverse().slice(0,5).map(v=>{
            const pagtIco={dinheiro:"💵",pix:"📱",fiado:"📝"};
            return (
              <div key={v.id} style={{padding:"9px 0",borderBottom:`1px solid ${C.pinkS}`,display:"flex",gap:9,alignItems:"flex-start"}}>
                <div style={{width:34,height:34,borderRadius:10,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:16}}>{pagtIco[v.pagamento]||"💰"}</span>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Cliente avulso"}</div>
                  <div style={{fontSize:11,color:C.soft,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {v.itens?.map(i=>`${i.qtd}× ${i.nome}${i.variacao?` (${i.variacao})`:""}`).join(", ")||"—"}
                  </div>
                  <div style={{fontSize:10,color:C.soft,marginTop:1}}>{new Date(v.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
                </div>
                <Badge>{fmt(v.total)}</Badge>
              </div>
            );
          })
        }
      </Card>
    </div>
  );
};


const Produtos = ({produtos,setProdutos,onCelebrate}) => {
  const [modal,setModal] = useState(null);
  const [form,setForm] = useState({});
  const [ajusteModal,setAjusteModal] = useState(null);
  const [search,setSearch] = useState("");
  const [showDeleted,setShowDeleted] = useState(false);
  const [confirmDel,setConfirmDel] = useState(null); // {id, nome}

  const blank = ()=>({foto:"",nome:"",categoria:"",precoCusto:"",precoVenda:"",estoqueTotal:"",variacoes:[],obs:""});
  const openAdd = ()=>{setForm(blank());setModal("add");};
  const openEdit = (p)=>{setForm({...p,variacoes:p.variacoes||[]});setModal(p);};

  const save = ()=>{
    if(!form.nome?.trim()) return;
    const total = (form.variacoes||[]).length>0
      ? (form.variacoes||[]).reduce((s,v)=>s+Number(v.qtd||0),0)
      : Number(form.estoqueTotal||0);
    const pf = {...form,estoqueTotal:total,id:modal==="add"?uid():modal.id,deleted:false};
    if(modal==="add"){
      setProdutos(ps=>[...ps,pf]);
      onCelebrate({emoji:"🎁",title:"Produto cadastrado!",message:`"${form.nome}" já está na sua lojinha!`,tip:"Produto com foto chama muito mais atenção. Sempre coloque uma foto bonita!"});
    } else {
      setProdutos(ps=>ps.map(p=>p.id===modal.id?pf:p));
    }
    setModal(null);
  };

  const softDelete = (id,nome)=>setConfirmDel({id,nome});
  const doDelete = ()=>{
    setProdutos(ps=>ps.map(p=>p.id===confirmDel.id?{...p,deleted:true}:p));
    setConfirmDel(null);
  };

  const restore = (id)=>setProdutos(ps=>ps.map(p=>p.id===id?{...p,deleted:false}:p));

  const applyAjuste = (modo,varId,n)=>{
    setProdutos(ps=>ps.map(p=>{
      if(p.id!==ajusteModal.id) return p;
      let novasVars = p.variacoes?[...p.variacoes]:[];
      let novoTotal = Number(p.estoqueTotal||0);
      if(varId==="total"){
        novoTotal = modo==="adicionar"?novoTotal+n:modo==="remover"?Math.max(0,novoTotal-n):n;
      } else {
        novasVars = novasVars.map(v=>{
          if(v.id!==varId) return v;
          const q = Number(v.qtd||0);
          const nq = modo==="adicionar"?q+n:modo==="remover"?Math.max(0,q-n):n;
          return {...v,qtd:nq};
        });
        novoTotal = novasVars.reduce((s,v)=>s+Number(v.qtd||0),0);
      }
      return {...p,estoqueTotal:novoTotal,variacoes:novasVars};
    }));
    setAjusteModal(null);
  };

  const ativos = produtos.filter(p=>!p.deleted&&p.nome?.toLowerCase().includes(search.toLowerCase()));
  const deletados = produtos.filter(p=>p.deleted);

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>📦 Produtos</h2>
          <div style={{marginTop:4}}><Tip title="Sobre os produtos" text="Produto é qualquer coisa que você vende. Coloque o custo (quanto você pagou), o preço (quanto vai cobrar) e a quantidade que tem em estoque." color={C.purple}>O que é produto?</Tip></div>
        </div>
        <Btn onClick={openAdd} small><Icon name="plus" size={14}/>Novo</Btn>
      </div>

      <FInput placeholder="🔍 Buscar produto..." value={search} onChange={setSearch} style={{marginBottom:8}}/>
      <GuiaAcoes tab="produtos"/>

      {ativos.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>📦</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Nenhum produto ainda.</p>
          <p style={{fontSize:12,margin:0}}>Toque em "Novo" para adicionar seu primeiro produto!</p>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          {ativos.map((p,i)=>{
            const est=Number(p.estoqueTotal||0);
            const vars=p.variacoes||[];
            return (
              <Card key={p.id} style={{display:"flex",gap:11,padding:11,animation:`fadeUp .28s ease ${i*.04}s both`}}>
                {p.foto
                  ?<img src={p.foto} alt="" style={{width:60,height:60,borderRadius:12,objectFit:"cover",flexShrink:0}}/>
                  :<div style={{width:60,height:60,borderRadius:12,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" color={C.pink}/></div>
                }
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:14,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nome}</div>
                  <div style={{fontSize:11,color:C.soft,marginTop:1}}>{p.categoria}</div>
                  <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                    <Badge>{fmt(p.precoVenda)}</Badge>
                    <Badge color={est<=0?C.red:est<=5?C.amber:C.green}>{est} un.</Badge>
                    {vars.length>0&&<Badge color={C.purple}>{vars.length} var.</Badge>}
                    {vars.some(v=>Number(v.precoVenda||0)>0)&&<Badge color={C.green}>preços variados</Badge>}
                  </div>
                  {vars.length>0&&(
                    <div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                      {vars.some(v=>v.foto)
                        ? vars.slice(0,5).map(v=>(
                            v.foto
                              ? <div key={v.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                                  <img src={v.foto} title={v.nome} alt={v.nome} style={{width:22,height:22,borderRadius:5,objectFit:"cover",border:`1.5px solid ${C.pinkM}`}}/>
                                  {Number(v.precoVenda||0)>0&&<span style={{fontSize:8,color:C.pinkD,fontWeight:700,fontFamily:"inherit"}}>{fmt(Number(v.precoVenda))}</span>}
                                </div>
                              : <span key={v.id} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:8,padding:"2px 6px"}}>{v.nome}: {v.qtd}{Number(v.precoVenda||0)>0?` · ${fmt(Number(v.precoVenda))}`:""}</span>
                          ))
                        : vars.slice(0,3).map(v=>(
                            <span key={v.id} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:8,padding:"2px 6px"}}>
                              {v.nome}: {v.qtd}{Number(v.precoVenda||0)>0?` · ${fmt(Number(v.precoVenda))}`:""}</span>
                          ))
                      }
                      {vars.length>5&&<span style={{fontSize:10,color:C.soft}}>+{vars.length-5}</span>}
                      {vars.length>3&&!vars.some(v=>v.foto)&&<span style={{fontSize:10,color:C.soft}}>+{vars.length-3}</span>}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                  <button onClick={()=>openEdit(p)} style={{background:C.pinkS,border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="edit" size={13} color={C.pinkD}/></button>
                  <button onClick={()=>setAjusteModal(p)} style={{background:"#EEF2FF",border:"none",borderRadius:9,padding:8,cursor:"pointer"}} title="Ajustar estoque"><Icon name="restore" size={13} color={C.purple}/></button>
                  <button onClick={()=>softDelete(p.id,p.nome)} style={{background:"#FEE2E2",border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="trash" size={13} color={C.red}/></button>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {deletados.length>0&&(
        <div style={{marginTop:16}}>
          <button onClick={()=>setShowDeleted(o=>!o)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.soft,fontSize:13,cursor:"pointer",padding:0,marginBottom:8}}>
            <Icon name="eye" size={14} color={C.soft}/>{showDeleted?"Ocultar":"Mostrar"} produtos arquivados ({deletados.length})
          </button>
          {showDeleted&&deletados.map(p=>(
            <Card key={p.id} style={{display:"flex",gap:10,padding:10,opacity:.65,marginBottom:8}}>
              {p.foto?<img src={p.foto} alt="" style={{width:48,height:48,borderRadius:10,objectFit:"cover",flexShrink:0}}/>:<div style={{width:48,height:48,borderRadius:10,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" color={C.pinkM}/></div>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.gray,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.nome}</div>
                <div style={{fontSize:11,color:C.soft}}>Arquivado</div>
              </div>
              <button onClick={()=>restore(p.id)} style={{background:"#ECFDF5",border:"none",borderRadius:9,padding:8,cursor:"pointer",flexShrink:0}}>
                <Icon name="restore" size={13} color={C.green}/>
              </button>
            </Card>
          ))}
        </div>
      )}

      {modal&&(
        <Modal title={modal==="add"?"✨ Novo Produto":"✏️ Editar Produto"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:13}}>
            <ImagePicker value={form.foto} onChange={v=>setForm(f=>({...f,foto:v}))}/>
            <FInput label="Nome do produto" value={form.nome||""} onChange={v=>setForm(f=>({...f,nome:v}))} placeholder="Ex: Presilha de cabelo floral"/>
            <FInput label="Categoria" value={form.categoria||""} onChange={v=>setForm(f=>({...f,categoria:v}))} placeholder="Ex: Acessórios, Roupas…"/>
            <div style={{background:C.pinkL,borderRadius:16,padding:13}}>
              <SL right={<Tip title="Como precificar?" text="Custo = quanto você pagou. Preço de venda = quanto vai cobrar. A diferença é o seu ganho. Regra dos 3×: venda por 3× o que pagou!" color={C.pinkD}>Como calcular?</Tip>}>💸 Precificação</SL>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:10}}>
                <FInput label="Custo (R$)" value={form.precoCusto||""} onChange={v=>setForm(f=>({...f,precoCusto:v}))} type="number" placeholder="0,00"/>
                <FInput label="Venda (R$)" value={form.precoVenda||""} onChange={v=>setForm(f=>({...f,precoVenda:v}))} type="number" placeholder="0,00"/>
              </div>
              <PrecBox custo={form.precoCusto} venda={form.precoVenda}/>
            </div>
            <InfoBox emoji="🧮" title="Dica para definir o preço" text="Pagou R$10? Tente vender por R$30. Assim você cobre o que gastou, as despesas e ainda lucra!" color={C.green}/>
            <EstoqueNovo form={form} setForm={setForm}/>
            <FInput label="Anotações (opcional)" value={form.obs||""} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Ex: nome do fornecedor, dicas de cuidado, prazo de entrega…"/>
            <Btn onClick={save} full><Icon name="check" size={15}/> Salvar</Btn>
          </div>
        </Modal>
      )}

      {ajusteModal&&(
        <Modal title="" onClose={()=>setAjusteModal(null)} noPad>
          <EstoqueAjuste produto={ajusteModal} onSave={applyAjuste} onClose={()=>setAjusteModal(null)}/>
        </Modal>
      )}

      {confirmDel&&(
        <ConfirmModal
          message={`Ocultar "${confirmDel.nome}"? O produto ficará arquivado e pode ser recuperado depois.`}
          onConfirm={doDelete}
          onCancel={()=>setConfirmDel(null)}
        />
      )}
    </div>
  );
};


const Clientes = ({clientes,setClientes,vendas,setVendas,onCelebrate}) => {
  const [modal,setModal]       = useState(null);
  const [form,setForm]         = useState({});
  const [search,setSearch]     = useState("");
  const [detail,setDetail]     = useState(null);
  const [showDeleted,setShowDeleted] = useState(false);
  const [recModal,setRecModal] = useState(null);
  const [recPagt,setRecPagt]   = useState("dinheiro");
  const [confirmDelCli,setConfirmDelCli] = useState(null); // id

  const save = ()=>{
    if(!form.nome?.trim()) return;
    if(modal==="add"){
      setClientes(cs=>[...cs,{...form,id:uid(),deleted:false}]);
      onCelebrate({emoji:"🤝",title:"Cliente cadastrado!",message:`${form.nome} agora faz parte da sua clientela!`,tip:"Cliente cadastrado = histórico de compras. Você saberá o que cada pessoa gosta!"});
    } else {
      setClientes(cs=>cs.map(c=>c.id===modal.id?{...form,id:modal.id}:c));
    }
    setModal(null);
  };

  const softDel = (id)=>setConfirmDelCli(id);
  const doDelCli = ()=>{setClientes(cs=>cs.map(c=>c.id===confirmDelCli?{...c,deleted:true}:c));setConfirmDelCli(null);};
  const restore = (id)=>setClientes(cs=>cs.map(c=>c.id===id?{...c,deleted:false}:c));
  const cv = (id)=>vendas.filter(v=>v.clienteId===id);
  const AVC = [C.pink,C.purple,C.green,C.amber,"#60A5FA","#F87171"];

  const hoje = new Date();
  const diaHoje = hoje.getDate(), mesHoje = hoje.getMonth()+1;
  const isBdayHoje = (c)=>{ if(!c.nascimento) return false; const [,m,d]=c.nascimento.split("-"); return Number(d)===diaHoje&&Number(m)===mesHoje; };
  const isBdayMes  = (c)=>{ if(!c.nascimento) return false; const [,m]=c.nascimento.split("-"); return Number(m)===mesHoje; };
  const fmtNasc = (n)=>{ if(!n) return null; const [y,m,d]=n.split("-"); return `${d}/${m}/${y}`; };
  const calcIdade = (n)=>{ if(!n) return null; const [y,m,d]=n.split("-"); const bn=new Date(+y,+m-1,+d); const a=new Date(); let age=a.getFullYear()-bn.getFullYear(); if(a<new Date(a.getFullYear(),bn.getMonth(),bn.getDate()))age--; return age; };

  const temFiado       = (cid)=>vendas.some(v=>v.clienteId===cid&&v.pagamento==="fiado"&&!v.fiadoPago);
  const totalFiado     = (cid)=>vendas.filter(v=>v.clienteId===cid&&v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);

  const filtered = clientes.filter(c=>!c.deleted&&c.nome?.toLowerCase().includes(search.toLowerCase()));
  const deletados = clientes.filter(c=>c.deleted);
  const aniversariantesHoje = clientes.filter(c=>!c.deleted&&isBdayHoje(c));

  const pagtIcons={dinheiro:"💵",pix:"📱",cartao:"💳",fiado:"📝"};
  const pagtNomes={dinheiro:"Dinheiro",pix:"Pix",cartao:"Cartão",fiado:"Fiado"};
  const receberFiado = (vendaId)=>{
    setVendas(vs=>vs.map(v=>v.id===vendaId?{...v,fiadoPago:true,fiadoPagtMetodo:recPagt,fiadoPagtData:new Date().toISOString()}:v));
    setRecModal(null);
  };

  if(detail){
    const cvendas=cv(detail.id);
    const totalGasto=cvendas.reduce((s,v)=>s+v.total,0);
    const bdHoje=isBdayHoje(detail);
    const bdMes=isBdayMes(detail);
    const idade=calcIdade(detail.nascimento);
    const fiadoPend=temFiado(detail.id);
    const totalFiadoVal=totalFiado(detail.id);
    const ringColor=fiadoPend?C.red:C.green;
    const ringGlow=fiadoPend?C.red+"28":C.green+"28";

    return (
      <div style={{padding:"14px 14px"}}>
        <button onClick={()=>setDetail(null)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.pinkD,fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:14,padding:0}}>
          <Icon name="back" size={16}/> Voltar
        </button>
        <Card style={{textAlign:"center",marginBottom:12}}>
          <div style={{position:"relative",display:"inline-block",margin:"0 auto 10px"}}>
            {detail.foto
              ?<img src={detail.foto} alt="" style={{width:80,height:80,borderRadius:"50%",objectFit:"cover",border:`3px solid ${ringColor}`,boxShadow:`0 0 0 5px ${ringGlow}`}}/>
              :<div style={{width:80,height:80,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontSize:30,fontWeight:900,border:`3px solid ${ringColor}`,boxShadow:`0 0 0 5px ${ringGlow}`}}>{detail.nome[0].toUpperCase()}</div>
            }
            {bdHoje&&<div style={{position:"absolute",bottom:-2,right:-2,fontSize:20}}>🎂</div>}
          </div>
          <div style={{fontSize:18,fontWeight:900,color:C.text}}>{detail.nome}</div>
          {fiadoPend&&(
            <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginTop:5,flexWrap:"wrap"}}>
              <div style={{background:"#FEE2E2",color:C.red,borderRadius:20,padding:"4px 14px",fontSize:12,fontWeight:700}}>📝 Fiado pendente: {fmt(totalFiadoVal)}</div>
              <button onClick={()=>lembreteWpp(detail,totalFiadoVal)} className="tap" title="Enviar lembrete WhatsApp"
                style={{background:"#DCF8C6",border:"none",borderRadius:20,padding:"5px 13px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:"#1a7a1a",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
                📲 WhatsApp
              </button>
            </div>
          )}
          {bdHoje&&<div style={{background:"#FEF3C7",color:"#92400E",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,display:"inline-block",marginTop:4}}>🎉 Aniversário hoje!</div>}
          {!bdHoje&&bdMes&&<div style={{background:C.pinkS,color:C.pinkD,borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,display:"inline-block",marginTop:4}}>🎈 Aniversário este mês</div>}
          {detail.nascimento&&<div style={{color:C.soft,fontSize:12,marginTop:6}}>🎂 {fmtNasc(detail.nascimento)}{idade!==null?` · ${idade} anos`:""}</div>}
          {detail.telefone&&<div style={{color:C.soft,fontSize:13,marginTop:4}}>{detail.telefone}</div>}
          {detail.obs&&<div style={{fontSize:12,color:C.gray,marginTop:4,fontStyle:"italic"}}>{detail.obs}</div>}
          <div style={{display:"flex",justifyContent:"center",gap:24,marginTop:14}}>
            <div><div style={{fontWeight:900,color:C.pinkD,fontSize:20}}>{cvendas.length}</div><div style={{fontSize:11,color:C.soft}}>compras</div></div>
            <div><div style={{fontWeight:900,color:C.green,fontSize:20}}>{fmt(totalGasto)}</div><div style={{fontSize:11,color:C.soft}}>total gasto</div></div>
          </div>
        </Card>
        <InfoBox emoji="💡" title="Cliente fiel vale ouro!" text="Saber o histórico do cliente ajuda a oferecer o produto certo na hora certa." color={C.purple}/>
        <h3 style={{color:C.pinkD,fontSize:13,fontWeight:800,margin:"12px 0 8px"}}>Histórico de compras</h3>
        {cvendas.length===0?<p style={{color:C.soft,fontSize:13}}>Ainda não realizou nenhuma compra.</p>
          :[...cvendas].reverse().map(v=>{
            const ehFiado=v.pagamento==="fiado";
            const quitado=ehFiado&&v.fiadoPago;
            const pendente=ehFiado&&!v.fiadoPago;
            return (
              <Card key={v.id} style={{marginBottom:8,padding:12,border:pendente?`2px solid ${C.red}55`:quitado?`2px solid ${C.green}44`:"none",background:pendente?"#FFF5F5":quitado?"#F0FDF4":C.white}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.itens?.map(i=>i.nome).join(", ")}</div>
                    <div style={{fontSize:11,marginTop:3,display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                      <span style={{color:C.soft}}>{new Date(v.data).toLocaleDateString("pt-BR")}</span>
                      <span style={{color:C.soft}}>·</span>
                      <span style={{fontWeight:pendente||quitado?700:400,color:pendente?C.red:quitado?C.green:C.soft}}>
                        {pagtIcons[v.pagamento]||"💰"} {pagtNomes[v.pagamento]||v.pagamento}
                      </span>
                      {pendente&&<span style={{fontSize:10,background:"#FEE2E2",color:C.red,borderRadius:8,padding:"1px 7px",fontWeight:700}}>Pendente</span>}
                      {quitado&&<span style={{fontSize:10,background:"#DCFCE7",color:C.green,borderRadius:8,padding:"1px 7px",fontWeight:700}}>✓ Recebido via {pagtNomes[v.fiadoPagtMetodo]||v.fiadoPagtMetodo}</span>}
                      {v.desconto>0&&<><span style={{color:C.soft}}>·</span><span style={{color:C.soft}}>Desc: {fmt(v.desconto)}</span></>}
                    </div>
                  </div>
                  <Badge color={pendente?C.red:quitado?C.green:C.pink}>{fmt(v.total)}</Badge>
                </div>
                {pendente&&(
                  <button onClick={()=>{setRecPagt("dinheiro");setRecModal(v.id);}} className="tap"
                    style={{marginTop:10,width:"100%",background:`linear-gradient(135deg,${C.green},#059669)`,color:C.white,border:"none",borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                    ✅ Marcar como recebido
                  </button>
                )}
              </Card>
            );
          })
        }

        {recModal&&(
          <Modal title="💰 Confirmar Recebimento" onClose={()=>setRecModal(null)}>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <InfoBox emoji="✅" title="Como o cliente pagou?" text="Informe a forma de pagamento usada para quitar o fiado." color={C.green}/>
              <div>
                <SL>Forma de Pagamento</SL>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                  {[["dinheiro","💵","Dinheiro"],["pix","📱","Pix"]].map(([id,ico,l])=>(
                    <button key={id} onClick={()=>setRecPagt(id)} className="tap"
                      style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 2px",borderRadius:11,border:`2px solid ${recPagt===id?C.green:"#D1D5DB"}`,background:recPagt===id?"#F0FDF4":C.white,cursor:"pointer",fontFamily:"inherit"}}>
                      <span style={{fontSize:20}}>{ico}</span>
                      <span style={{fontSize:11,fontWeight:700,color:recPagt===id?C.green:C.gray}}>{l}</span>
                    </button>
                  ))}
                </div>
              </div>
              <Btn onClick={()=>receberFiado(recModal)} full style={{background:`linear-gradient(135deg,${C.green},#059669)`}}>
                <Icon name="check" size={15}/> Confirmar Recebimento
              </Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>👥 Clientes</h2>
          <div style={{marginTop:4}}><Tip title="Por que cadastrar?" text="Com clientes cadastrados você vê o histórico de compras, sabe o que gostam e pode atendê-los melhor. Cliente feliz volta sempre!" color={C.purple}>Por que cadastrar?</Tip></div>
        </div>
        <Btn onClick={()=>{setForm({});setModal("add");}} small><Icon name="plus" size={14}/>Novo</Btn>
      </div>

      {}
      <GuiaAcoes tab="clientes"/>
      {aniversariantesHoje.length>0&&(
        <div style={{background:"linear-gradient(135deg,#FEF3C7,#FDE68A)",border:"1.5px solid #F59E0B44",borderRadius:16,padding:"11px 14px",marginBottom:12,display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:22,flexShrink:0}}>🎂</span>
          <div>
            <div style={{fontSize:12,fontWeight:800,color:"#92400E"}}>Aniversário hoje!</div>
            <div style={{fontSize:12,color:"#78350F"}}>{aniversariantesHoje.map(c=>c.nome).join(", ")} 🎉</div>
          </div>
        </div>
      )}

      <FInput placeholder="🔍 Buscar cliente..." value={search} onChange={setSearch} style={{marginBottom:12}}/>

      {filtered.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>👥</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Nenhum cliente ainda.</p>
          <p style={{fontSize:12,margin:0}}>Cadastre seu primeiro cliente!</p>
        </div>
      ):filtered.map((c,i)=>{
        const nc=cv(c.id).length;
        const ac=AVC[i%AVC.length];
        const bdHoje=isBdayHoje(c);
        const bdMes=isBdayMes(c);
        const hasFiado=temFiado(c.id);
        const ringColor=hasFiado?C.red:C.green;
        return (
          <Card key={c.id} style={{display:"flex",alignItems:"center",gap:11,marginBottom:9,padding:11,animation:`fadeUp .28s ease ${i*.04}s both`,border:bdHoje?`2px solid ${C.amber}`:hasFiado?`2px solid ${C.red}33`:"none",background:bdHoje?"#FFFBEB":hasFiado?"#FFF8F8":C.white}}>
            {}
            <div onClick={()=>setDetail(c)} style={{position:"relative",flexShrink:0,cursor:"pointer"}}>
              {c.foto
                ?<img src={c.foto} alt="" style={{width:46,height:46,borderRadius:"50%",objectFit:"cover",border:`2.5px solid ${bdHoje?C.amber:ringColor}`,boxShadow:`0 0 0 3px ${bdHoje?C.amber+"44":ringColor+"33"}`}}/>
                :<div style={{width:46,height:46,borderRadius:"50%",background:`linear-gradient(135deg,${ac},${ac}BB)`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,fontSize:17,border:`2.5px solid ${bdHoje?C.amber:ringColor}`,boxShadow:`0 0 0 3px ${bdHoje?C.amber+"44":ringColor+"33"}`}}>{c.nome?.[0]?.toUpperCase()}</div>
              }
              {bdHoje&&<div style={{position:"absolute",bottom:-3,right:-3,fontSize:13,lineHeight:1}}>🎂</div>}
              {hasFiado&&!bdHoje&&<div style={{position:"absolute",bottom:-3,right:-3,fontSize:13,lineHeight:1}}>📝</div>}
            </div>
            <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setDetail(c)}>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</span>
                {bdHoje&&<span style={{fontSize:10,background:"#FEF3C7",color:"#92400E",borderRadius:10,padding:"1px 7px",fontWeight:700,whiteSpace:"nowrap"}}>🎉 Hoje!</span>}
                {!bdHoje&&bdMes&&<span style={{fontSize:10,background:C.pinkS,color:C.pinkD,borderRadius:10,padding:"1px 7px",fontWeight:700,whiteSpace:"nowrap"}}>🎈 Este mês</span>}
                {hasFiado&&<span style={{fontSize:10,background:"#FEE2E2",color:C.red,borderRadius:10,padding:"1px 7px",fontWeight:700,whiteSpace:"nowrap"}}>Fiado</span>}
              </div>
              <div style={{fontSize:12,color:C.soft}}>{c.telefone||"—"} · {nc} compra(s)</div>
            </div>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              <button onClick={()=>{setForm({...c});setModal(c);}} style={{background:C.pinkS,border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="edit" size={13} color={C.pinkD}/></button>
              <button onClick={()=>softDel(c.id)} style={{background:"#FEE2E2",border:"none",borderRadius:9,padding:8,cursor:"pointer"}}><Icon name="trash" size={13} color={C.red}/></button>
            </div>
          </Card>
        );
      })}

      {deletados.length>0&&(
        <div style={{marginTop:14}}>
          <button onClick={()=>setShowDeleted(o=>!o)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.soft,fontSize:13,cursor:"pointer",padding:0,marginBottom:8}}>
            <Icon name="eye" size={14} color={C.soft}/>{showDeleted?"Ocultar":"Mostrar"} clientes arquivados ({deletados.length})
          </button>
          {showDeleted&&deletados.map(c=>(
            <Card key={c.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:10,opacity:.65}}>
              {c.foto
                ?<img src={c.foto} alt="" style={{width:40,height:40,borderRadius:"50%",objectFit:"cover",flexShrink:0}}/>
                :<div style={{width:40,height:40,borderRadius:"50%",background:C.pinkM,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:900,flexShrink:0}}>{c.nome?.[0]?.toUpperCase()}</div>
              }
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:C.gray}}>{c.nome}</div><div style={{fontSize:11,color:C.soft}}>Arquivado</div></div>
              <button onClick={()=>restore(c.id)} style={{background:"#ECFDF5",border:"none",borderRadius:9,padding:8,cursor:"pointer",flexShrink:0}}><Icon name="restore" size={13} color={C.green}/></button>
            </Card>
          ))}
        </div>
      )}

      {modal&&(
        <Modal title={modal==="add"?"🤝 Novo Cliente":"✏️ Editar Cliente"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <InfoBox emoji="👑" title="Cliente é tudo!" text="Um cliente feliz indica sua loja para amigos — marketing gratuito e poderoso!" color={C.pink}/>
            <ProfilePicker value={form.foto||""} onChange={v=>setForm(f=>({...f,foto:v}))} nome={form.nome}/>
            <FInput label="Nome" value={form.nome||""} onChange={v=>setForm(f=>({...f,nome:v}))} placeholder="Nome completo"/>
            <FInput label="WhatsApp / Telefone" value={form.telefone||""} onChange={v=>setForm(f=>({...f,telefone:v}))} placeholder="(44) 99999-9999"/>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase"}}>Data de Nascimento</label>
              <input
                value={form._nascDisplay !== undefined ? form._nascDisplay : (form.nascimento ? form.nascimento.split("-").reverse().join("/") : "")}
                onChange={e=>{
                  let v = e.target.value.replace(/\D/g,"");
                  if(v.length>8) v=v.slice(0,8);
                  let nascFmt = v;
                  if(v.length>=5) nascFmt=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
                  else if(v.length>=3) nascFmt=v.slice(0,2)+"/"+v.slice(2);
                  if(v.length===8){
                    const iso=`${v.slice(4)}-${v.slice(2,4)}-${v.slice(0,2)}`;
                    setForm(f=>({...f,nascimento:iso,_nascDisplay:nascFmt}));
                  } else {
                    setForm(f=>({...f,nascimento:"",_nascDisplay:nascFmt}));
                  }
                }}
                placeholder="DD/MM/AAAA"
                inputMode="numeric"
                maxLength={10}
                style={{border:`1.5px solid ${C.pinkM}`,borderRadius:12,padding:"10px 13px",fontFamily:"inherit",fontSize:14,color:C.text,outline:"none",background:"#fff",width:"100%"}}
                onFocus={e=>{e.target.style.borderColor=C.pink;e.target.style.boxShadow=`0 0 0 3px ${C.pink}18`;}}
                onBlur={e=>{e.target.style.borderColor=C.pinkM;e.target.style.boxShadow="none";}}
              />
              <span style={{fontSize:10,color:C.soft}}>Digite no formato DD/MM/AAAA</span>
            </div>
            <FInput label="Observações" value={form.obs||""} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Tamanho favorito, cor preferida…"/>
            <Btn onClick={save} full><Icon name="check" size={15}/> Salvar Cliente</Btn>
          </div>
        </Modal>
      )}

      {confirmDelCli&&(
        <ConfirmModal
          message="Ocultar este cliente? Ele ficará arquivado e pode ser recuperado depois."
          onConfirm={doDelCli}
          onCancel={()=>setConfirmDelCli(null)}
        />
      )}
    </div>
  );
};


const Vendas = ({vendas,setVendas,produtos,setProdutos,clientes,onCelebrate}) => {
  const [modal,setModal]               = useState(false);   // nova venda
  const [editModal,setEditModal]       = useState(null);    // venda sendo editada
  const [confirmModal,setConfirmModal] = useState(false);   // confirmação antes de salvar
  const [trocoModal,setTrocoModal]     = useState(false);   // calculadora de troco
  const [reembolsoModal,setReembolsoModal] = useState(null); // venda a reembolsar
  const [clienteId,setClienteId]       = useState("");
  const [itens,setItens]               = useState([]);
  const [prodSel,setProdSel]           = useState("");
  const [varSel,setVarSel]             = useState("");
  const [qtd,setQtd]                   = useState("1");
  const [pagamento,setPagamento]       = useState("dinheiro");
  const [filter,setFilter]             = useState("todos");
  const [descontoModal,setDescontoModal]           = useState(null);
  const [descontoCompraModal,setDescontoCompraModal] = useState(false);
  const [descontoCompra,setDescontoCompra]           = useState(0);
  const [recebido,setRecebido]         = useState(""); // valor recebido na calculadora de troco

  const prodSelecionado = produtos.filter(p=>!p.deleted).find(x=>x.id===prodSel);
  const subtotalItens   = itens.reduce((s,i)=>s+i.precoVenda*i.qtd,0);
  const total           = Math.max(0,subtotalItens-descontoCompra);
  const totalOriginal   = itens.reduce((s,i)=>s+(i.precoOriginal||i.precoVenda)*i.qtd,0);
  const totalDesconto   = totalOriginal-subtotalItens+descontoCompra;
  const custoItens      = itens.reduce((s,i)=>s+i.precoCusto*i.qtd,0);

  const resetModal = () => {
    setModal(false); setEditModal(null); setConfirmModal(false); setTrocoModal(false);
    setItens([]); setClienteId(""); setPagamento("dinheiro");
    setProdSel(""); setVarSel(""); setQtd("1"); setDescontoCompra(0); setRecebido("");
  };

  const estoqueDisp = (prodId, variacao) => {
    const p = produtos.find(x=>x.id===prodId);
    if(!p) return 0;
    const qtdOriginal = editModal
      ? (editModal.itens||[]).filter(i=>i.produtoId===prodId&&(i.variacao||"")===(variacao||"")).reduce((s,i)=>s+i.qtd,0)
      : 0;
    if(variacao && p.variacoes?.length>0) return Number(p.variacoes.find(v=>v.nome===variacao)?.qtd||0) + qtdOriginal;
    return Number(p.estoqueTotal||0) + qtdOriginal;
  };

  const estoqueInsuf = itens.filter(it=>estoqueDisp(it.produtoId,it.variacao)<it.qtd);

  const addItem = () => {
    if(!prodSelecionado) return;
    const novaQtd = Number(qtd)||1;
    const varObj = prodSelecionado.variacoes?.find(v=>v.nome===varSel);
    const dispAtual = varSel ? Number(varObj?.qtd||0) : Number(prodSelecionado.estoqueTotal||0);

    const precoVenda = varObj && Number(varObj.precoVenda||0)>0
      ? Number(varObj.precoVenda)
      : Number(prodSelecionado.precoVenda);
    const precoCusto = varObj && Number(varObj.precoCusto||0)>0
      ? Number(varObj.precoCusto)
      : Number(prodSelecionado.precoCusto);

    setItens(is=>{
      const idx = is.findIndex(x=>x.produtoId===prodSelecionado.id&&x.variacao===(varSel||""));
      if(idx>=0) return is.map((x,i)=>i===idx?{...x,qtd:x.qtd+novaQtd}:x);
      return [...is,{
        produtoId:prodSelecionado.id, nome:prodSelecionado.nome,
        variacao:varSel, varFoto:varObj?.foto||"", foto:prodSelecionado.foto||"",
        qtd:novaQtd, precoVenda, precoCusto, precoOriginal:precoVenda,
        desconto:0, pctDesconto:0, estoqueDisp:dispAtual,
      }];
    });
    setProdSel(""); setVarSel(""); setQtd("1");
  };

  const solicitarFinalizacao = () => {
    if(itens.length===0||estoqueInsuf.length>0) return;
    if(pagamento==="dinheiro") { setRecebido(""); setTrocoModal(true); }
    else setConfirmModal(true);
  };

  const confirmarVenda = (vendaEditada=null) => {
    const isEdit = !!vendaEditada;
    const cl = clientes.find(c=>c.id===clienteId);
    const novaVenda = {
      id: isEdit ? vendaEditada.id : uid(),
      clienteId, clienteNome:cl?.nome||"",
      itens, total, custo:custoItens, desconto:totalDesconto, pagamento,
      data: isEdit ? vendaEditada.data : new Date().toISOString(),
      editadaEm: isEdit ? new Date().toISOString() : undefined,
    };

    if(isEdit) {
      setProdutos(ps => {
        let estado = ps.map(p => ({
          ...p,
          estoqueTotal: Number(p.estoqueTotal||0),
          variacoes: p.variacoes ? p.variacoes.map(v=>({...v, qtd:Number(v.qtd||0)})) : [],
        }));

        vendaEditada.itens.forEach(item => {
          estado = estado.map(p => {
            if(p.id !== item.produtoId) return p;
            if(item.variacao) {
              const novasVars = p.variacoes.map(v =>
                v.nome === item.variacao ? {...v, qtd: v.qtd + item.qtd} : v
              );
              return {...p, variacoes: novasVars, estoqueTotal: novasVars.reduce((s,v)=>s+v.qtd,0)};
            } else {
              return {...p, estoqueTotal: p.estoqueTotal + item.qtd};
            }
          });
        });

        itens.forEach(item => {
          estado = estado.map(p => {
            if(p.id !== item.produtoId) return p;
            if(item.variacao) {
              const novasVars = p.variacoes.map(v =>
                v.nome === item.variacao ? {...v, qtd: Math.max(0, v.qtd - item.qtd)} : v
              );
              return {...p, variacoes: novasVars, estoqueTotal: novasVars.reduce((s,v)=>s+v.qtd,0)};
            } else {
              return {...p, estoqueTotal: Math.max(0, p.estoqueTotal - item.qtd)};
            }
          });
        });

        return estado;
      });
      setVendas(vs=>vs.map(v=>v.id===novaVenda.id?novaVenda:v));
    } else {
      setProdutos(ps=>ps.map(p=>{
        const vendidos=itens.filter(i=>i.produtoId===p.id);
        if(!vendidos.length) return p;
        if(p.variacoes?.length>0) {
          let novasVars = p.variacoes.map(v=>({...v,qtd:Number(v.qtd||0)}));
          vendidos.forEach(item=>{
            if(item.variacao) novasVars=novasVars.map(v=>v.nome===item.variacao?{...v,qtd:Math.max(0,v.qtd-item.qtd)}:v);
          });
          const semVar = vendidos.filter(i=>!i.variacao).reduce((s,i)=>s+i.qtd,0);
          const novoTotal = novasVars.reduce((s,v)=>s+v.qtd,0) - semVar;
          return {...p, estoqueTotal:Math.max(0,novoTotal), variacoes:novasVars};
        } else {
          const tv=vendidos.reduce((s,i)=>s+i.qtd,0);
          return {...p, estoqueTotal:Math.max(0,Number(p.estoqueTotal||0)-tv)};
        }
      }));
      setVendas(vs=>[...vs,novaVenda]);
      const msgs=[
        {emoji:"🎉",title:"Venda realizada!",message:`${fmt(total)} no caixa! Parabéns!`,tip:"Continue registrando suas vendas para acompanhar o crescimento do negócio!"},
        {emoji:"💸",title:"Ka-ching!",message:`Você faturou ${fmt(total)}! Incrível!`,tip:"Cada venda registrada é um dado valioso para o seu negócio!"},
        {emoji:"🚀",title:"Mais uma venda!",message:`${fmt(total)} faturados — você está arrasando!`,tip:"Guarde parte do lucro para reinvestir no estoque!"},
      ];
      onCelebrate(msgs[Math.floor(Math.random()*msgs.length)]);
    }
    resetModal();
  };

  const abrirEdicao = (venda) => {
    if(venda.reembolsada) return;
    setEditModal(venda);
    setItens(venda.itens.map(it=>({...it})));
    setClienteId(venda.clienteId||"");
    setPagamento(venda.pagamento||"dinheiro");
    setDescontoCompra(venda.desconto&&venda.desconto>0?venda.desconto:0); // simplificação: desconto da compra
    setModal(true);
  };

  const confirmarReembolso = () => {
    const v = reembolsoModal;
    setProdutos(ps=>ps.map(p=>{
      const devolvidos=v.itens.filter(i=>i.produtoId===p.id);
      if(!devolvidos.length) return p;
      if(p.variacoes?.length>0) {
        let novasVars = p.variacoes.map(vr=>({...vr,qtd:Number(vr.qtd||0)}));
        devolvidos.forEach(item=>{
          if(item.variacao) novasVars=novasVars.map(vr=>vr.nome===item.variacao?{...vr,qtd:vr.qtd+item.qtd}:vr);
        });
        return {...p, variacoes:novasVars, estoqueTotal:novasVars.reduce((s,vr)=>s+vr.qtd,0)};
      } else {
        const tv=devolvidos.reduce((s,i)=>s+i.qtd,0);
        return {...p, estoqueTotal:Number(p.estoqueTotal||0)+tv};
      }
    }));
    setVendas(vs=>vs.map(venda=>venda.id===v.id?{...venda,reembolsada:true,reembolsadaEm:new Date().toISOString()}:venda));
    setReembolsoModal(null);
  };

  const hoje = new Date().toDateString();
  const agora = Date.now();
  const filtradas = filter==="hoje"
    ? vendas.filter(v=>new Date(v.data).toDateString()===hoje)
    : filter==="7d"  ? vendas.filter(v=>agora-new Date(v.data).getTime()<=7*864e5)
    : filter==="30d" ? vendas.filter(v=>agora-new Date(v.data).getTime()<=30*864e5)
    : vendas;
  const pagtIcons  = {dinheiro:"💵",pix:"📱",fiado:"📝"};
  const produtosAtivos = produtos.filter(p=>!p.deleted);
  const isEdicao = !!editModal;

  const recebidoN = Number(recebido||0);
  const troco = Math.max(0, recebidoN - total);
  const trocoInsuf = recebidoN > 0 && recebidoN < total;

  return (
    <div style={{padding:"14px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>🛍️ Vendas</h2>
          <div style={{marginTop:4}}><Tip title="Por que registrar?" text="Cada venda registrada dá baixa no estoque automaticamente e fica no histórico do cliente. Registre sempre!" color={C.pink}>Por que registrar?</Tip></div>
        </div>
        <Btn onClick={()=>setModal(true)} small><Icon name="plus" size={14}/>Nova venda</Btn>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:8,overflowX:"auto",paddingBottom:2}}>
        {[["todos","Todas"],["hoje","Hoje"],["7d","7 dias"],["30d","30 dias"]].map(([f,l])=>(
          <button key={f} onClick={()=>setFilter(f)} className="tap" style={{padding:"7px 15px",borderRadius:20,border:"none",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",background:filter===f?C.pink:C.pinkL,color:filter===f?C.white:C.pinkD,transition:"background .2s",flexShrink:0,whiteSpace:"nowrap"}}>{l}</button>
        ))}
      </div>
      <GuiaAcoes tab="vendas"/>

      {filtradas.length===0?(
        <div style={{textAlign:"center",color:C.soft,marginTop:40}}>
          <div style={{fontSize:52,animation:"float 3s ease-in-out infinite"}}>🛍️</div>
          <p style={{fontSize:14,margin:"8px 0 4px"}}>Ainda não há vendas registradas.</p>
          <p style={{fontSize:12,margin:0}}>Toque em "+ Nova venda" para começar!</p>
        </div>
      ):[...filtradas].reverse().map((v,i)=>(
        <Card key={v.id} style={{marginBottom:9,padding:12,animation:`fadeUp .28s ease ${i*.03}s both`,opacity:v.reembolsada?.7:1,border:v.reembolsada?`1.5px solid ${C.amber}44`:v.editadaEm?`1.5px solid ${C.purple}22`:"none",background:v.reembolsada?"#FFFBEB":C.white}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Cliente avulso"}</span>
                {v.reembolsada&&<span style={{fontSize:10,background:"#FEF3C7",color:"#92400E",borderRadius:8,padding:"1px 7px",fontWeight:700,flexShrink:0}}>↩ Reembolsada</span>}
                {v.editadaEm&&!v.reembolsada&&<span style={{fontSize:10,background:"#EEF2FF",color:C.purple,borderRadius:8,padding:"1px 7px",fontWeight:700,flexShrink:0}}>✏️ Editada</span>}
              </div>
              <div style={{fontSize:11,color:C.soft,marginTop:1}}>{new Date(v.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} · {pagtIcons[v.pagamento]||"💰"} {v.pagamento}</div>
              <div style={{marginTop:5,display:"flex",flexWrap:"wrap",gap:3}}>
                {v.itens?.map((it,j)=>(
                  <span key={j} style={{fontSize:10,background:C.pinkL,color:C.pinkD,borderRadius:7,padding:"2px 7px"}}>
                    {it.qtd}× {it.nome}{it.variacao?` · ${it.variacao}`:""}
                  </span>
                ))}
              </div>
              {v.desconto>0&&<div style={{fontSize:10,color:C.amber,marginTop:3,fontWeight:700}}>Desconto: {fmt(v.desconto)}</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
              <Badge color={v.reembolsada?C.amber:C.pink}>{fmt(v.total)}</Badge>
              {!v.reembolsada&&(
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>abrirEdicao(v)} title="Editar venda" className="tap"
                    style={{background:"#EEF2FF",border:"none",borderRadius:8,padding:"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
                    <Icon name="edit" size={12} color={C.purple}/>
                    <span style={{fontSize:10,fontWeight:700,color:C.purple}}>Editar</span>
                  </button>
                  <button onClick={()=>setReembolsoModal(v)} title="Reembolsar" className="tap"
                    style={{background:"#FEF3C7",border:"none",borderRadius:8,padding:"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
                    <span style={{fontSize:12}}>↩</span>
                    <span style={{fontSize:10,fontWeight:700,color:"#92400E"}}>Reembolso</span>
                  </button>
                </div>
              )}
              {v.reembolsada&&<span style={{fontSize:10,color:C.soft}}>{new Date(v.reembolsadaEm).toLocaleDateString("pt-BR")}</span>}
            </div>
          </div>
        </Card>
      ))}

      {}
      {modal&&(
        <Modal title={isEdicao?"✏️ Editar Venda":"🛍️ Nova Venda"} onClose={resetModal}>
          <div style={{display:"flex",flexDirection:"column",gap:13}}>

            {isEdicao&&(
              <InfoBox emoji="✏️" title="Modo edição" text="Corrija os itens, quantidades, preços ou forma de pagamento. O estoque será reajustado automaticamente." color={C.purple}/>
            )}

            {}
            <div>
              <SL right={<Tip title="Associar ao cliente" text="Vincular a venda a um cliente cria o histórico de compras dele automaticamente." color={C.purple}>Associar?</Tip>}>Cliente</SL>
              <select value={clienteId} onChange={e=>{setClienteId(e.target.value);if(!e.target.value&&pagamento==="fiado")setPagamento("dinheiro");}} style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:12,padding:"10px 13px",fontFamily:"inherit",fontSize:14,background:C.white,color:C.text}}>
                <option value="">Sem cadastro (cliente avulso)</option>
                {clientes.filter(c=>!c.deleted).map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>

            {}
            <div>
              <SL right={<Tip title="Como escolher?" text="Dinheiro e Pix: o dinheiro entra na hora. Fiado: o cliente paga depois — só use para quem você confia muito e que já está cadastrado." color={C.amber}>Qual usar?</Tip>}>Forma de Pagamento</SL>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                {[["dinheiro","💵","Dinheiro"],["pix","📱","Pix"],["fiado","📝","Fiado"]].map(([id,ico,l])=>{
                  const bloqueado=id==="fiado"&&!clienteId;
                  return (
                    <button key={id} onClick={()=>!bloqueado&&setPagamento(id)} className="tap"
                      style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 2px",borderRadius:11,
                        border:`2px solid ${pagamento===id?C.pink:bloqueado?C.pinkM+"80":C.pinkM}`,
                        background:pagamento===id?C.pinkS:bloqueado?"#F9FAFB":C.white,
                        cursor:bloqueado?"not-allowed":"pointer",fontFamily:"inherit",opacity:bloqueado?.5:1}}>
                      <span style={{fontSize:18}}>{ico}</span>
                      <span style={{fontSize:10,fontWeight:700,color:pagamento===id?C.pinkD:bloqueado?C.soft:C.gray}}>{l}</span>
                    </button>
                  );
                })}
              </div>
              {pagamento==="fiado"&&<div style={{marginTop:8}}><InfoBox emoji="⚠️" title="⚠️ Cuidado com o fiado!" text="Fiado é quando o cliente leva o produto e paga depois. Só faça fiado para clientes de total confiança — existe o risco de não receber!" color={C.red}/></div>}
              {!clienteId&&<div style={{marginTop:6,fontSize:11,color:C.soft,textAlign:"center"}}>Escolha um cliente acima para poder usar o fiado</div>}
            </div>

            {}
            <div style={{background:C.pinkL,borderRadius:14,padding:13}}>
              <SL>Adicionar Produto</SL>
              <select value={prodSel} onChange={e=>{setProdSel(e.target.value);setVarSel("");}} style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"9px 12px",fontFamily:"inherit",fontSize:13,background:C.white,marginBottom:8}}>
                <option value="">Selecione um produto…</option>
                {produtosAtivos.map(p=><option key={p.id} value={p.id}>{p.nome} — {fmt(p.precoVenda)} ({p.estoqueTotal||0} un.)</option>)}
              </select>
              {prodSelecionado&&(
                <div style={{display:"flex",gap:9,alignItems:"center",marginBottom:8,background:C.white,borderRadius:10,padding:"7px 10px"}}>
                  {(()=>{const varObj=prodSelecionado.variacoes?.find(v=>v.nome===varSel);const fotoExibida=varObj?.foto||prodSelecionado.foto;return fotoExibida?<img src={fotoExibida} alt="" style={{width:40,height:40,borderRadius:8,objectFit:"cover",flexShrink:0,border:`2px solid ${varObj?.foto?C.pink:C.pinkM}`}}/>:<div style={{width:40,height:40,borderRadius:8,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="tag" size={14} color={C.pink}/></div>;})()}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prodSelecionado.nome}</div>
                    <div style={{fontSize:11,color:C.gray}}>
                      {(()=>{
                        const varObj=prodSelecionado.variacoes?.find(v=>v.nome===varSel);
                        const precoEfetivo = varObj&&Number(varObj.precoVenda||0)>0 ? Number(varObj.precoVenda) : Number(prodSelecionado.precoVenda);
                        const temPrecoPropio = varObj&&Number(varObj.precoVenda||0)>0;
                        const estq = varSel ? Number(varObj?.qtd||0) : Number(prodSelecionado.estoqueTotal||0);
                        return <>
                          <b style={{color:C.pinkD}}>{fmt(precoEfetivo)}</b>
                          {temPrecoPropio&&<span style={{fontSize:10,color:C.soft}}> (preço da variação)</span>}
                          {' · '}{estq} un. em estoque
                        </>;
                      })()}
                    </div>
                  </div>
                </div>
              )}
              {prodSelecionado&&(
                <div style={{display:"grid",gridTemplateColumns:prodSelecionado.variacoes?.length?"1fr 70px":"1fr 70px",gap:7,marginBottom:8}}>
                  {prodSelecionado.variacoes?.length>0&&(
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {prodSelecionado.variacoes.some(v=>v.foto)?(
                        <>
                          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                            {prodSelecionado.variacoes.map(v=>(
                              <button key={v.id} onClick={()=>setVarSel(v.nome)} className="tap"
                                style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:3,borderRadius:10,border:`2px solid ${varSel===v.nome?C.pink:C.pinkM}`,background:varSel===v.nome?C.pinkS:C.white,cursor:"pointer",transition:"all .18s"}}>
                                {v.foto?<img src={v.foto} alt={v.nome} style={{width:42,height:42,borderRadius:7,objectFit:"cover",display:"block"}}/>:<div style={{width:42,height:42,borderRadius:7,background:C.pinkL,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="tag" size={13} color={C.pink}/></div>}
                                <span style={{fontSize:9,fontWeight:700,color:varSel===v.nome?C.pinkD:C.gray,maxWidth:48,textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"inherit"}}>{v.nome}</span>
                                <span style={{fontSize:8,color:C.soft,fontFamily:"inherit"}}>{v.qtd} un.</span>
                              </button>
                            ))}
                          </div>
                          {!varSel&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>⚠️ Toque para escolher</span>}
                        </>
                      ):(
                        <>
                          <select value={varSel} onChange={e=>setVarSel(e.target.value)} style={{border:`1.5px solid ${!varSel?C.red:C.pinkM}`,borderRadius:10,padding:"8px 10px",fontFamily:"inherit",fontSize:13,background:!varSel?"#FFF5F5":C.white,color:!varSel?C.red:C.text}}>
                            <option value="">⚠️ Escolha a variação…</option>

const GraficoCrescimento = ({pontos}) => {
  const [ativas,setAtivas] = useState({receita:true,custo:true,lucro:true});
  const W=320, H=160, PAD={t:12,r:12,b:32,l:46};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;

  if(pontos.length<2) return (
    <div style={{textAlign:"center",padding:"28px 0",color:C.soft}}>
      <div style={{fontSize:32,marginBottom:6}}>📈</div>
      <div style={{fontSize:12,fontWeight:600}}>Registre vendas em pelo menos 2 períodos para ver o gráfico de crescimento!</div>
    </div>
  );

  const series = [
    {key:"receita",label:"Receita",color:C.pink},
    {key:"custo",label:"Custos",color:C.amber},
    {key:"lucro",label:"Lucro",color:C.green},
  ];

  const allVals = pontos.flatMap(p=>series.filter(s=>ativas[s.key]).map(s=>p[s.key]||0));
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals.filter(v=>v>0), 0);
  const range = maxV - minV || 1;

  const xPos = (i) => PAD.l + (i/(pontos.length-1))*iW;
  const yPos = (v) => PAD.t + iH - ((v-minV)/range)*iH;

  const makePath = (key) => pontos.map((p,i)=>`${i===0?"M":"L"}${xPos(i).toFixed(1)},${yPos(p[key]||0).toFixed(1)}`).join(" ");
  const makeArea = (key) => {
    const line = pontos.map((p,i)=>`${i===0?"M":"L"}${xPos(i).toFixed(1)},${yPos(p[key]||0).toFixed(1)}`).join(" ");
    const base = `L${xPos(pontos.length-1).toFixed(1)},${(PAD.t+iH).toFixed(1)} L${PAD.l.toFixed(1)},${(PAD.t+iH).toFixed(1)} Z`;
    return line+" "+base;
  };

  const gridCount = 4;
  const gridLines = Array.from({length:gridCount+1},(_,i)=>minV+(range/gridCount)*i);

  const fmtK = (v) => v>=1000?`${(v/1000).toFixed(1)}k`:`${v.toFixed(0)}`;

  const toggler = (key) => setAtivas(a=>({...a,[key]:!a[key]}));

  return (
    <div>
      {}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        {series.map(s=>(
          <button key={s.key} onClick={()=>toggler(s.key)} className="tap"
            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 11px",borderRadius:20,border:`1.5px solid ${ativas[s.key]?s.color:C.pinkM}`,background:ativas[s.key]?s.color+"18":C.white,cursor:"pointer",fontFamily:"inherit",transition:"all .18s"}}>
            <div style={{width:10,height:10,borderRadius:3,background:ativas[s.key]?s.color:C.soft,transition:"background .18s",flexShrink:0}}/>
            <span style={{fontSize:11,fontWeight:700,color:ativas[s.key]?s.color:C.soft}}>{s.label}</span>
          </button>
        ))}
      </div>
      {}
      <div style={{overflowX:"auto",width:"100%"}}>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",fontFamily:"inherit"}}>
          <defs>
            {series.map(s=>(
              <linearGradient key={s.key} id={`grad-${s.key}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={s.color} stopOpacity="0.22"/>
                <stop offset="100%" stopColor={s.color} stopOpacity="0.01"/>
              </linearGradient>
            ))}
          </defs>
          {}
          {gridLines.map((v,i)=>(
            <g key={i}>
              <line x1={PAD.l} y1={yPos(v)} x2={W-PAD.r} y2={yPos(v)} stroke={C.pinkM} strokeWidth="0.7" strokeDasharray="3,3"/>
              <text x={PAD.l-4} y={yPos(v)+4} textAnchor="end" fontSize="8" fill={C.soft} fontFamily="inherit">{fmtK(v)}</text>
            </g>
          ))}
          {}
          {series.filter(s=>ativas[s.key]).map(s=>(
            <path key={s.key+"-area"} d={makeArea(s.key)} fill={`url(#grad-${s.key})`}/>
          ))}
          {}
          {series.filter(s=>ativas[s.key]).map(s=>(
            <path key={s.key} d={makePath(s.key)} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
          ))}
          {}
          {series.filter(s=>ativas[s.key]).map(s=>
            pontos.map((p,i)=>(
              <circle key={s.key+i} cx={xPos(i)} cy={yPos(p[s.key]||0)} r="3.5" fill={C.white} stroke={s.color} strokeWidth="2"/>
            ))
          )}
          {}
          {pontos.map((p,i)=>{
            const step = pontos.length<=6?1:pontos.length<=10?2:3;
            if(i!==0&&i!==pontos.length-1&&i%step!==0) return null;
            return <text key={i} x={xPos(i)} y={H-PAD.b+14} textAnchor="middle" fontSize="8" fill={C.gray} fontFamily="inherit">{p.label}</text>;
          })}
        </svg>
      </div>
    </div>
  );
};


const Relatorios = ({vendas,produtos}) => {
  const agora = new Date();

  const [tipoPeriodo, setTipoPeriodo] = useState("mes"); // hoje | semana | mes | ano | custom
  const [offset, setOffset]           = useState(0);
  const [customInicio, setCustomInicio] = useState("");
  const [customFim, setCustomFim]       = useState("");

  const calcRange = () => {
    if(tipoPeriodo==="custom"){
      const i = customInicio ? new Date(customInicio+"T00:00:00") : new Date(0);
      const f = customFim    ? new Date(customFim+"T23:59:59")    : new Date();
      return {inicio:i, fim:f};
    }
    if(tipoPeriodo==="hoje"){
      const i=new Date(agora); i.setHours(0,0,0,0); i.setDate(i.getDate()+offset);
      const f=new Date(agora); f.setHours(23,59,59,999); f.setDate(f.getDate()+offset);
      return {inicio:i,fim:f};
    }
    if(tipoPeriodo==="semana"){
      const base=new Date(agora);
      base.setDate(base.getDate()-base.getDay()+offset*7);
      const i=new Date(base); i.setHours(0,0,0,0);
      const f=new Date(base); f.setDate(f.getDate()+6); f.setHours(23,59,59,999);
      return {inicio:i,fim:f};
    }
    if(tipoPeriodo==="ano"){
      const i=new Date(agora.getFullYear()+offset,0,1,0,0,0,0);
      const f=new Date(agora.getFullYear()+offset,11,31,23,59,59,999);
      return {inicio:i,fim:f};
    }
    const i=new Date(agora.getFullYear(), agora.getMonth()+offset, 1, 0,0,0,0);
    const f=new Date(agora.getFullYear(), agora.getMonth()+offset+1, 0, 23,59,59,999);
    return {inicio:i,fim:f};
  };

  const {inicio,fim} = calcRange();

  const labelPeriodo = () => {
    if(tipoPeriodo==="custom") return "Período personalizado";
    if(tipoPeriodo==="hoje"){
      if(offset===0) return "Hoje";
      return inicio.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
    }
    if(tipoPeriodo==="semana"){
      if(offset===0) return "Esta semana";
      return `${inicio.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} – ${fim.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}`;
    }
    if(tipoPeriodo==="ano"){
      return String(agora.getFullYear()+offset);
    }
    if(offset===0) return "Este mês";
    return inicio.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  };

  const vendasFiltradas = vendas.filter(v=>{
    if(v.reembolsada) return false;
    const d=new Date(v.data);
    return d>=inicio && d<=fim;
  });

  const vendasRecebidas = vendasFiltradas.filter(v=>
    v.pagamento!=="fiado" || v.fiadoPago===true
  );
  const vendasFiadoPendente = vendasFiltradas.filter(v=>
    v.pagamento==="fiado" && !v.fiadoPago
  );

  const receitaTotal  = vendasRecebidas.reduce((s,v)=>s+v.total,0);
  const custoTotal    = vendasRecebidas.reduce((s,v)=>s+(v.custo||0),0);
  const descontoTotal = vendasFiltradas.reduce((s,v)=>s+(v.desconto||0),0);
  const lucroLiquido  = receitaTotal-custoTotal;
  const margemReceita = receitaTotal>0?((lucroLiquido/receitaTotal)*100).toFixed(1):0;
  const ganhoSobCusto = custoTotal>0?((lucroLiquido/custoTotal)*100).toFixed(1):0;

  const totalAReceber     = vendasFiadoPendente.reduce((s,v)=>s+v.total,0);
  const custoFiadoPendente = vendasFiadoPendente.reduce((s,v)=>s+(v.custo||0),0);

  const totalFiadoGeralPendente = vendas
    .filter(v=>!v.reembolsada&&v.pagamento==="fiado"&&!v.fiadoPago)
    .reduce((s,v)=>s+v.total,0);

  const contagem={};
  vendasFiltradas.forEach(v=>v.itens?.forEach(i=>{contagem[i.nome]=(contagem[i.nome]||0)+i.qtd;}));
  const maisVendidos=Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const medalhas=["🥇","🥈","🥉","4️⃣","5️⃣"];

  const pagtLabels={dinheiro:"💵 Dinheiro",pix:"📱 Pix",fiado:"📝 Fiado"};

    const k=v.pagamento||"outro";
    pagtRes[k]=(pagtRes[k]||0)+v.total;
  });

  const vendasComDesconto=vendasFiltradas.filter(v=>(v.desconto||0)>0);

  const buildGrafico = () => {
    const todasValidas = vendas.filter(v=>!v.reembolsada&&(v.pagamento!=="fiado"||v.fiadoPago===true));
    if(todasValidas.length===0) return [];
    const todas = [...todasValidas].sort((a,b)=>new Date(a.data)-new Date(b.data));
    const primeiraData = new Date(todas[0].data);
    const diffDias = (agora-primeiraData)/(1000*60*60*24);
    const grupos={};
    todas.forEach(v=>{
      const d=new Date(v.data);
      let chave;
      if(diffDias<=31)      chave=d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
      else if(diffDias<=120){ const sy=new Date(d.getFullYear(),0,1); const wk=Math.ceil(((d-sy)/86400000+sy.getDay()+1)/7); chave=`S${wk}/${d.getFullYear().toString().slice(2)}`; }
      else                  chave=d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
      if(!grupos[chave]) grupos[chave]={label:chave,receita:0,custo:0,lucro:0};
      grupos[chave].receita+=v.total;
      grupos[chave].custo+=(v.custo||0);
      grupos[chave].lucro+=(v.total-(v.custo||0));
    });
    return Object.values(grupos).slice(-12);
  };

  const pontosGrafico = buildGrafico();

  const TIPOS=[
    {id:"hoje",  l:"Dia"},
    {id:"semana",l:"Semana"},
    {id:"mes",   l:"Mês"},
    {id:"ano",   l:"Ano"},
    {id:"custom",l:"Manual"},
  ];

  return (
    <div style={{padding:"14px 14px",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <h2 style={{margin:0,fontSize:19,fontWeight:900,color:C.pinkD}}>📊 Relatórios</h2>
        <Tip title="Para que servem?" text="Relatórios mostram como seu negócio está indo. Analise toda semana!" color={C.purple}>Para que serve?</Tip>
      </div>
      <GuiaAcoes tab="relatorios"/>

      {}
      <Card style={{padding:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase",marginBottom:8}}>Período de análise</div>
        <div style={{display:"flex",gap:4,marginBottom:10,overflowX:"auto"}}>
          {TIPOS.map(t=>(
            <button key={t.id} onClick={()=>{setTipoPeriodo(t.id);setOffset(0);}} className="tap"
              style={{flex:1,minWidth:44,padding:"7px 4px",borderRadius:10,border:`1.5px solid ${tipoPeriodo===t.id?C.pink:C.pinkM}`,background:tipoPeriodo===t.id?C.pinkS:C.white,fontFamily:"inherit",fontWeight:700,fontSize:11,color:tipoPeriodo===t.id?C.pinkD:C.gray,cursor:"pointer",transition:"all .15s",whiteSpace:"nowrap"}}>
              {t.l}
            </button>
          ))}
        </div>

        {tipoPeriodo==="custom"?(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <FInput label="De" value={customInicio} onChange={setCustomInicio} type="date"/>
            <FInput label="Até" value={customFim} onChange={setCustomFim} type="date"/>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
            <button onClick={()=>setOffset(o=>o-1)} className="tap"
              style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.pinkM}`,background:C.white,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.pinkD} strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.pinkD}}>{labelPeriodo()}</div>
              {tipoPeriodo!=="hoje"&&tipoPeriodo!=="ano"&&(
                <div style={{fontSize:10,color:C.soft,marginTop:1}}>
                  {inicio.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} – {fim.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
                </div>

            </div>
            <button onClick={()=>setOffset(o=>Math.min(0,o+1))} disabled={offset>=0} className="tap"
              style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.pinkM}`,background:offset>=0?"#F9F9F9":C.white,cursor:offset>=0?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:offset>=0?.4:1}}>

      <InfoBox emoji="🧠" title="Dica de empreendedora!" text="Analise seus números toda semana. Quem conhece seus números toma decisões melhores!" color={C.pinkD}/>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          {[
