  <script type="text/babel" data-presets="env,react">

 * Atualizado: 2026-05-23
 *
 * Changelog:
 * v2.0.0 — Grande atualização:
 *   - Busca global removida (simplificação da interface)
 *   - Backup local restaurado: exportar/importar JSON + apagar tudo com segurança
 *   - Lembrete de fiado via WhatsApp: botão 📲 na dashboard e no perfil do cliente
 *   - Painel Financeiro aprimorado: Receita, Custo, Lucro Real, Margem s/ receita,
 *     Ganho s/ custo, Ticket médio, Descontos, barra visual de composição
 *   - Tutorial Onboarding: 5 passos guiados com produto, cliente, venda e relatórios
 *   - Botão 🎓 no topo para reabrir o tutorial a qualquer momento
 *   - Animação de carregamento para sincronização com Drive
 *   - Backup: botões de confirmação disponíveis imediatamente (não apenas após o timer)
 *   - Produtos: foto com opção de câmera (traseira) ou galeria ao adicionar produto
 *   - Câmera do produto: câmera traseira por padrão, botão 🔄 para trocar
 *   - Câmera do cliente: mantida câmera frontal com botão 🔄 para trocar para traseira
 *   - Estoque: botão de edição (✏️) para renomear variações existentes
 *   - Busca global: clicar no resultado abre a aba e filtra o item clicado
 *   - Data de nascimento: campo de digitação (DD/MM/AAAA) em vez de calendário
 *   - Desconto "Total do produto": label e placeholder alterados para "valor do desconto"
 *   - Revisão geral: correção de cálculo de desconto total_do_produto
 * v1.8.0 — Melhorias de produto:
 *   - Validação de estoque ao finalizar venda (bloqueia se qtd insuficiente)
 *   - Alerta visual por item com estoque insuficiente no checkout
 *   - Backup/Restauração de dados: exporta JSON completo (produtos, clientes, vendas)
 *   - Importação de backup com validação e preview dos dados
 *   - Busca global: pesquisa simultânea em produtos, clientes e vendas
 *   - Resultados da busca com atalhos diretos para cada aba
 * v1.7.0 — Correções e otimizações mobile:
 *   - confirm() substituído por ConfirmModal interno (funciona em iframes/artifacts)
 *   - Tooltip popup: width responsivo com max-width e padding lateral seguro
 *   - Celebration modal: width 100% com padding interno correto
 *   - Nav bottom: padding safe-area para iPhone com home bar (env)
 *   - Câmera: verifica isSecureContext antes de abrir getUserMedia
 *   - Gráfico SVG: labels X espaçados automaticamente (evita sobreposição)
 *   - Modais de confirmação centralizados e nunca cortados na tela

const ImagePicker = ({value,onChange}) => {
  const fileRef = useRef();
  const videoRef = useRef();
  const canvasRef = useRef();
  const [camOpen, setCamOpen] = useState(false);
  const [stream, setStream] = useState(null);
  const [facingMode, setFacingMode] = useState("environment"); // traseira por padrão

  const cropToSquare = (file) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.width, img.height);
        const canvas = document.createElement("canvas");
        canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext("2d");
        const ox = (img.width - size) / 2;
        const oy = (img.height - size) / 2;
        ctx.drawImage(img, ox, oy, size, size, 0, 0, 300, 300);
        onChange(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const openCam = async (facing="environment") => {
    if(!window.isSecureContext&&!window.location.hostname.includes('localhost')){
      alert("A câmera requer conexão segura (HTTPS). Use a galeria para adicionar foto."); return;
    }
    if(!navigator.mediaDevices?.getUserMedia){ alert("Câmera não disponível neste dispositivo. Use a galeria."); return; }
    try {
      stream?.getTracks().forEach(t=>t.stop());
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:600},height:{ideal:600}}});
      setStream(s); setFacingMode(facing); setCamOpen(true);
      setTimeout(()=>{ if(videoRef.current){ videoRef.current.srcObject=s; videoRef.current.play(); } }, 100);
    } catch(err) { alert("Não foi possível acessar a câmera. Verifique as permissões do navegador ou use a galeria."); }
  };

  const switchCam = async () => {
    const novoMode = facingMode==="environment"?"user":"environment";
    await openCam(novoMode);
  };

  const closeCam = () => {
    stream?.getTracks().forEach(t=>t.stop());
    setStream(null); setCamOpen(false);
  };

  const snap = () => {
    const v = videoRef.current, c = canvasRef.current;
    if(!v||!c) return;
    const size = Math.min(v.videoWidth, v.videoHeight);
    c.width = 300; c.height = 300;
    const ctx = c.getContext("2d");
    ctx.drawImage(v, (v.videoWidth-size)/2, (v.videoHeight-size)/2, size, size, 0, 0, 300, 300);
    onChange(c.toDataURL("image/jpeg", 0.82));
    closeCam();
  };

  return (
    <div>
      <SL>Foto do Produto</SL>
      {value ? (
        <div style={{position:"relative",width:"100%",aspectRatio:"1/1",borderRadius:16,overflow:"hidden"}}>
          <img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
          <button onClick={()=>onChange("")} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.55)",border:"none",borderRadius:50,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0}}>
            <Icon name="x" size={13} color="#fff"/>
          </button>
        </div>
      ) : (
        <>
          <div style={{width:"100%",aspectRatio:"1/1",borderRadius:16,border:`2px dashed ${C.pinkM}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.pinkL,gap:10}}>
            <Icon name="camera" color={C.pink} size={28}/>
            <span style={{fontSize:12,color:C.soft,fontWeight:600}}>Escolha como adicionar a foto</span>
          </div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button onClick={()=>openCam("environment")} className="tap" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:C.pinkS,border:"none",borderRadius:12,padding:"10px 8px",fontFamily:"inherit",fontWeight:700,fontSize:13,color:C.pinkD,cursor:"pointer"}}>

const ProfilePicker = ({value, onChange, nome}) => {
  const fileRef = useRef();
  const videoRef = useRef();
  const canvasRef = useRef();
  const [camOpen, setCamOpen] = useState(false);
  const [stream, setStream] = useState(null);
  const [facingMode, setFacingMode] = useState("user"); // frontal para clientes

  const cropCircle = (file) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const size = Math.min(img.width, img.height);
        const canvas = document.createElement("canvas");
        canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, (img.width-size)/2, (img.height-size)/2, size, size, 0, 0, 300, 300);
        onChange(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const openCam = async (facing="user") => {
    if(!window.isSecureContext&&!window.location.hostname.includes('localhost')){
      alert("A câmera requer conexão segura (HTTPS). Use a galeria para adicionar foto."); return;
    }
    if(!navigator.mediaDevices?.getUserMedia){ alert("Câmera não disponível neste dispositivo. Use a galeria."); return; }
    try {
      stream?.getTracks().forEach(t=>t.stop());
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:400},height:{ideal:400}}});
      setStream(s); setFacingMode(facing); setCamOpen(true);
      setTimeout(()=>{ if(videoRef.current){ videoRef.current.srcObject=s; videoRef.current.play(); } }, 100);
    } catch(err) { alert("Não foi possível acessar a câmera. Verifique as permissões do navegador."); }
  };

  const switchCam = async () => {
    const novoMode = facingMode==="user"?"environment":"user";
    await openCam(novoMode);
  };

  const closeCam = () => {
    stream?.getTracks().forEach(t=>t.stop());
    setStream(null); setCamOpen(false);
  };

  const snap = () => {
    const v = videoRef.current, c = canvasRef.current;
    if(!v||!c) return;
    const size = Math.min(v.videoWidth, v.videoHeight);
    c.width = 300; c.height = 300;
    const ctx = c.getContext("2d");
    ctx.drawImage(v, (v.videoWidth-size)/2, (v.videoHeight-size)/2, size, size, 0, 0, 300, 300);
    onChange(c.toDataURL("image/jpeg", 0.85));
    closeCam();
  };

  const initials = nome ? nome.trim()[0]?.toUpperCase() : "?";

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
      <div style={{position:"relative",width:90,height:90}}>
        {value
          ? <img src={value} alt="" style={{width:90,height:90,borderRadius:"50%",objectFit:"cover",border:`3px solid ${C.pink}`,boxShadow:`0 0 0 4px ${C.pinkS}`}}/>
          : <div style={{width:90,height:90,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontSize:32,fontWeight:900,border:`3px solid ${C.pinkM}`}}>{initials}</div>
        }
        {value&&(
          <button onClick={()=>onChange("")} style={{position:"absolute",top:-4,right:-4,background:C.red,border:`2px solid ${C.white}`,borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0}}>
            <Icon name="x" size={10} color={C.white}/>
          </button>
        )}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>openCam("user")} className="tap" style={{display:"flex",alignItems:"center",gap:5,background:C.pinkS,border:"none",borderRadius:50,padding:"7px 14px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:C.pinkD,cursor:"pointer"}}>
          <Icon name="camera" size={13} color={C.pinkD}/>Tirar foto
        </button>
        <button onClick={()=>fileRef.current.click()} className="tap" style={{display:"flex",alignItems:"center",gap:5,background:"#EEF2FF",border:"none",borderRadius:50,padding:"7px 14px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:C.purple,cursor:"pointer"}}>
          📁 Galeria
        </button>
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)cropCircle(f);}}/>
      <canvas ref={canvasRef} style={{display:"none"}}/>

      {camOpen&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:9000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:20}}>
          <div style={{color:C.white,fontSize:15,fontWeight:700}}>📸 Foto do cliente</div>
          <div style={{position:"relative",width:280,height:280,borderRadius:"50%",overflow:"hidden",border:`4px solid ${C.pink}`,boxShadow:`0 0 0 6px ${C.pink}44`}}>
            <video ref={videoRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",transform:facingMode==="user"?"scaleX(-1)":"none"}}/>
          </div>
          <div style={{display:"flex",gap:16,marginTop:8,alignItems:"center"}}>
            <button onClick={switchCam} className="tap" title={facingMode==="user"?"Câmera traseira":"Câmera frontal"} style={{width:48,height:48,borderRadius:"50%",background:"rgba(255,255,255,.18)",border:"2px solid rgba(255,255,255,.4)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",alignSelf:"center"}}>
              <span style={{fontSize:22}}>🔄</span>
            </button>
            <button onClick={snap} className="tap" style={{width:68,height:68,borderRadius:"50%",background:`linear-gradient(135deg,${C.pink},${C.pinkD})`,border:`4px solid ${C.white}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(244,114,182,.5)"}}>
              <Icon name="camera" size={26} color={C.white}/>
            </button>
            <button onClick={closeCam} className="tap" style={{width:48,height:48,borderRadius:"50%",background:"rgba(255,255,255,.15)",border:"2px solid rgba(255,255,255,.4)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",alignSelf:"center"}}>
              <Icon name="x" size={18} color={C.white}/>
            </button>
          </div>
          <div style={{color:"rgba(255,255,255,.5)",fontSize:11}}>Câmera {facingMode==="user"?"frontal":"traseira"} · 🔄 trocar câmera</div>
        </div>
      )}
    </div>
  );
};


const PrecBox = ({custo,venda}) => {
  const c=Number(custo), v=Number(venda);
  if(!c||!v||c<=0||v<=0) return null;
  const ganho = v-c;
  const sobrecusto = ((ganho/c)*100).toFixed(0);
  const n = Number(sobrecusto);
  const color = n<0?C.red:n<30?C.red:n<80?C.amber:C.green;
  const label = n<0?"Vendendo no prejuízo! ❌":n<30?"Ganho baixo ⚠️":n<80?"Ganho bom 👍":"Ótimo ganho! 🎉";
  return (
    <div style={{background:color+"0F",border:`1.5px solid ${color}28`,borderRadius:14,padding:"12px 13px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
        <span style={{fontSize:12,fontWeight:700,color}}>{label}</span>
        <span style={{fontSize:18,fontWeight:900,color}}>+{sobrecusto}%</span>
      </div>
      <div style={{height:7,background:color+"28",borderRadius:99,overflow:"hidden",marginBottom:9}}>
        <div style={{height:"100%",width:`${Math.min(100,Math.max(0,n/2))}%`,background:color,borderRadius:99,transition:"width .5s ease"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,textAlign:"center"}}>
        {[{l:"Você pagou",val:fmt(c),s:"custo"},{l:"Vai cobrar",val:fmt(v),s:"preço"},{l:"Seu ganho",val:fmt(ganho),s:"por unidade",bold:true,color}].map(r=>(
          <div key={r.l} style={{background:C.white,borderRadius:10,padding:"6px 4px"}}>
            <div style={{fontSize:12,fontWeight:r.bold?900:700,color:r.color||C.text}}>{r.val}</div>
            <div style={{fontSize:10,color:C.soft,marginTop:1}}>{r.s}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:C.gray,marginTop:8,lineHeight:1.4}}>
        💡 <b>Ganho sobre custo</b>: quanto % você ganha em relação ao que pagou.
      </div>
    </div>
  );
};

const EstoqueNovo = ({form,setForm}) => {
  const [novaVar,setNovaVar]     = useState("");
  const [novaQtd,setNovaQtd]     = useState("1");
  const [editandoId,setEditandoId]   = useState(null);
  const [editandoNome,setEditandoNome] = useState("");
  const [expandidoId,setExpandidoId] = useState(null); // variação com preços expandidos
  const vars = form.variacoes||[];
  const totalVars = vars.reduce((s,v)=>s+Number(v.qtd||0),0);

  const precoCustoBase  = Number(form.precoCusto||0);
  const precoVendaBase  = Number(form.precoVenda||0);

  const addVar = () => {
    if(!novaVar.trim()) return;
    const ex = vars.find(v=>v.nome.toLowerCase()===novaVar.trim().toLowerCase());
    if(ex){
      setForm(f=>({...f,variacoes:f.variacoes.map(v=>v.id===ex.id?{...v,qtd:Number(v.qtd)+Number(novaQtd||1)}:v)}));
    } else {
      setForm(f=>({...f,variacoes:[...(f.variacoes||[]),{
        id:uid(), nome:novaVar.trim(), qtd:Number(novaQtd||1), foto:"",
        precoCusto:"", precoVenda:"", // vazios = herda o preço geral
      }]}));
    }
    setNovaVar(""); setNovaQtd("1");
  };

  const iniciarEdicao = (v) => { setEditandoId(v.id); setEditandoNome(v.nome); };
  const salvarEdicao  = () => {
    if(!editandoNome.trim()) return;
    setForm(f=>({...f,variacoes:f.variacoes.map(v=>v.id===editandoId?{...v,nome:editandoNome.trim()}:v)}));
    setEditandoId(null); setEditandoNome("");
  };

  const updateVar = (id, campo, valor) =>
    setForm(f=>({...f,variacoes:f.variacoes.map(v=>v.id===id?{...v,[campo]:valor}:v)}));

  const precoEfetivo = (v, campo) => {
    const proprio = Number(v[campo]||0);
    const base = campo==="precoCusto" ? precoCustoBase : precoVendaBase;
    return proprio > 0 ? proprio : base;
  };

  return (
    <div style={{background:C.pinkL,borderRadius:16,padding:13,display:"flex",flexDirection:"column",gap:11}}>
      <SL right={<Tip title="Variações com preços diferentes" text="Cada variação pode ter preço e custo próprios. Se deixar em branco, herda o preço geral do produto. Ideal para tamanhos, modelos ou kits!" color={C.pinkD}>Como funciona?</Tip>}>📦 Estoque e Variações</SL>

      {vars.length===0?(
        <FInput label="Quantidade em estoque" value={form.estoqueTotal||""} onChange={v=>setForm(f=>({...f,estoqueTotal:v}))} type="number" min="0" placeholder="Ex: 50"/>
      ):(
        <div style={{background:C.white,borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:C.gray,fontWeight:600}}>Total calculado</span>
          <span style={{fontSize:20,fontWeight:900,color:totalVars>0?C.green:C.red}}>{totalVars} un.</span>
        </div>
      )}

      {vars.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
            <span style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase"}}>Variações</span>
            <span style={{fontSize:10,color:C.soft}}>Toque em 💲 para preço individual</span>
          </div>

          {vars.map(v=>{
            const temPrecoPropio = Number(v.precoCusto||0)>0||Number(v.precoVenda||0)>0;
            const expandido = expandidoId===v.id;
            const custoEfet = precoEfetivo(v,"precoCusto");
            const vendaEfet = precoEfetivo(v,"precoVenda");
            const ganho = vendaEfet>0&&custoEfet>0 ? ((vendaEfet-custoEfet)/custoEfet*100).toFixed(0) : null;
            const ganhoColor = ganho===null?C.soft:Number(ganho)<30?C.red:Number(ganho)<80?C.amber:C.green;

            return (
              <div key={v.id} style={{background:C.white,borderRadius:13,boxShadow:"0 1px 4px rgba(244,114,182,.07)",overflow:"hidden",border:temPrecoPropio?`1.5px solid ${C.pink}33`:"none"}}>
                {}
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px"}}>
                  <VarFotoPicker
                    value={v.foto||""}
                    onChange={foto=>updateVar(v.id,"foto",foto)}
                  />
                  {editandoId===v.id ? (
                    <input autoFocus value={editandoNome} onChange={e=>setEditandoNome(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter")salvarEdicao();if(e.key==="Escape")setEditandoId(null);}}
                      onBlur={salvarEdicao}
                      style={{flex:1,border:`1.5px solid ${C.pink}`,borderRadius:8,padding:"4px 8px",fontFamily:"inherit",fontSize:13,fontWeight:600,minWidth:0}}/>
                  ) : (
                    <span style={{flex:1,fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.nome}</span>
                  )}

                  {}
                  {temPrecoPropio&&(
                    <span style={{fontSize:9,background:C.pinkS,color:C.pinkD,borderRadius:6,padding:"2px 5px",fontWeight:700,flexShrink:0}}>preço próprio</span>
                  )}

                  {}
                  <button onClick={()=>setExpandidoId(expandido?null:v.id)} title="Preço desta variação"
                    style={{background:expandido?C.pinkS:"#F0FDF4",border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:2}}>
                    <span style={{fontSize:13}}>💲</span>

                    <Icon name="edit" size={12} color={C.pinkD}/>

                  <span style={{fontSize:11,color:C.soft,flexShrink:0}}>un.</span>
                  <button onClick={()=>setForm(f=>({...f,variacoes:f.variacoes.filter(x=>x.id!==v.id)}))}
                    style={{background:"#FEE2E2",border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",flexShrink:0}}>
                    <Icon name="x" size={12} color={C.red}/>
                  </button>
                </div>

                {}
                {expandido&&(
                  <div style={{borderTop:`1px solid ${C.pinkS}`,padding:"10px 12px",background:"#FAFAFA"}}>
                    <div style={{fontSize:11,color:C.pinkD,fontWeight:700,marginBottom:8}}>
                      💲 Preço da variação "{v.nome}"

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:C.soft,letterSpacing:".04em",display:"block",marginBottom:4}}>
                          CUSTO (R$)

                        <input
                          type="number" min="0" value={v.precoCusto||""}
                          onChange={e=>updateVar(v.id,"precoCusto",e.target.value)}
                          placeholder={precoCustoBase>0?`${fmtN(precoCustoBase)} (geral)`:"Opcional"}
                          style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"8px 10px",fontFamily:"inherit",fontSize:13,background:C.white}}
                        />
                      </div>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:C.soft,letterSpacing:".04em",display:"block",marginBottom:4}}>
                          VENDA (R$)
                        </label>
                        <input
                          type="number" min="0" value={v.precoVenda||""}
                          onChange={e=>updateVar(v.id,"precoVenda",e.target.value)}
                          placeholder={precoVendaBase>0?`${fmtN(precoVendaBase)} (geral)`:"Opcional"}
                          style={{width:"100%",border:`1.5px solid ${C.pinkM}`,borderRadius:10,padding:"8px 10px",fontFamily:"inherit",fontSize:13,background:C.white}}
                        />
                      </div>
                    </div>

                    {}
                    {custoEfet>0&&vendaEfet>0&&(
                      <div style={{background:`${ganhoColor}0F`,border:`1px solid ${ganhoColor}28`,borderRadius:10,padding:"8px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div style={{fontSize:11,color:C.gray}}>
                          Custo: <b>{fmt(custoEfet)}</b> · Venda: <b style={{color:C.pinkD}}>{fmt(vendaEfet)}</b>
                          {!temPrecoPropio&&<span style={{color:C.soft}}> (herda do produto)</span>}
                        </div>
                        {ganho!==null&&(
                          <span style={{fontSize:13,fontWeight:900,color:ganhoColor,flexShrink:0,marginLeft:8}}>+{ganho}%</span>

                      </div>

                    {(v.precoCusto||v.precoVenda)&&(
                      <button onClick={()=>{updateVar(v.id,"precoCusto","");updateVar(v.id,"precoVenda","");}}
                        style={{marginTop:7,background:"none",border:"none",fontSize:11,color:C.soft,cursor:"pointer",padding:0,fontFamily:"inherit"}}>
                        ✕ Remover preço próprio (usar preço geral)
                      </button>

                  </div>
                )}
              </div>
            );
          })}

          {}

const EstoqueAjuste = ({produto,onSave,onClose}) => {
  const [modo,setModo] = useState("adicionar"); // adicionar | remover | ajustar
  const [valor,setValor] = useState("");
  const [varSel,setVarSel] = useState("total");

    : Number(vars.find(v=>v.id===varSel)?.qtd||0);

              <button key={v.id} onClick={()=>setVarSel(v.id)} className="tap" style={{padding:"6px 13px",borderRadius:20,border:`1.5px solid ${varSel===v.id?C.pink:C.pinkM}`,background:varSel===v.id?C.pinkS:C.white,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",color:varSel===v.id?C.pinkD:C.gray}}>

            <button key={m} onClick={()=>setModo(m)} className="tap" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 6px",borderRadius:13,border:`2px solid ${modo===m?C.pink:C.pinkM}`,background:modo===m?C.pinkS:C.white,cursor:"pointer",fontFamily:"inherit"}}>

const DescontoModal = ({item,onSave,onClose}) => {
  const precoOrig = item.precoOriginal||item.precoVenda;
  const qtd = item.qtd||1;
  const totalOrig = precoOrig*qtd;
  const multiPeca = qtd > 1;

  const modosDisponiveis = [
    {
      id:"pct",
      ico:"💸",
      label:"Percentual de desconto (%)",
      sub:`Informe o % de desconto sobre o preço unitário (${fmt(precoOrig)})`,
    },
    {
      id:"valor_unitario",
      ico:"🏷️",
      label:"Valor do desconto por peça (R$)",
      sub:`Informe o valor do desconto em cada peça (preço atual: ${fmt(precoOrig)})`,
    },
    ...(multiPeca ? [{
      id:"valor_total",
      ico:"🧮",
      label:"Valor do desconto no total (R$)",
      sub:`Informe o valor total do desconto sobre as ${qtd} peças (total: ${fmt(totalOrig)})`,
    }] : []),
  ];

  const [tipo,setTipo] = useState("pct");
  const [val,setVal] = useState("");

  const tipoValido = modosDisponiveis.find(m=>m.id===tipo) ? tipo : "pct";

  const valN = Number(val||0);

  const descontoUnit =
    tipoValido==="pct"         ? Math.max(0,Math.min(precoOrig, precoOrig*(valN/100)))
    : tipoValido==="valor_unitario" ? Math.max(0,Math.min(precoOrig, valN))
    :            Math.max(0,Math.min(totalOrig, valN))/qtd;

  const novoPrecoUnit = Math.max(0, precoOrig - descontoUnit);
  const totalFinal    = novoPrecoUnit * qtd;
  const pctDesconto   = precoOrig > 0 ? (descontoUnit/precoOrig)*100 : 0;

  const aplicar = () => {
    if(!val||valN<=0) return;
    onSave({
      ...item,
      precoVenda:   parseFloat(novoPrecoUnit.toFixed(2)),
      precoOriginal: precoOrig,
      desconto:     parseFloat(descontoUnit.toFixed(2)),
      pctDesconto:  parseFloat(pctDesconto.toFixed(1)),
    });
    onClose();
  };

  const labelInput =
    tipoValido==="pct"          ? "Percentual de desconto (%)"
    : tipoValido==="valor_unitario" ? "Valor do desconto por peça (R$)"
    :                              "Valor do desconto no total (R$)";

  const placeholderInput =
    tipoValido==="pct"          ? `Ex: 10  →  desconto de ${fmt(precoOrig*0.1)} por peça`
    : tipoValido==="valor_unitario" ? `Ex: ${fmtN(precoOrig*0.1)}  →  desconto de 10% por peça`
    :                              `Ex: ${fmtN(totalOrig*0.1)}  →  desconto de 10% no total`;

  return (
    <div style={{padding:"20px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:800,color:C.pinkD}}>Dar desconto neste produto</h2>
        <button onClick={onClose} style={{background:C.pinkS,border:"none",borderRadius:50,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Icon name="x" size={14} color={C.pinkD}/></button>
      </div>

      {}
      <div style={{background:C.pinkL,borderRadius:12,padding:"10px 13px",marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>
          {item.nome}{item.variacao?` · ${item.variacao}`:""}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          {[
            {l:"Preço unit.", v:fmt(precoOrig)},
            {l:"Quantidade", v:`${qtd} un.`},
            {l:"Total", v:fmt(totalOrig)},
          ].map(r=>(
            <div key={r.l} style={{background:C.white,borderRadius:9,padding:"6px 8px",textAlign:"center"}}>
              <div style={{fontSize:12,fontWeight:800,color:C.pinkD}}>{r.v}</div>
              <div style={{fontSize:9,color:C.soft,marginTop:1}}>{r.l}</div>
            </div>
          ))}
        </div>
      </div>

      {}
      <div style={{fontSize:11,fontWeight:700,color:C.pinkD,letterSpacing:".05em",textTransform:"uppercase",marginBottom:7}}>
        Como quer dar o desconto?
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
        {modosDisponiveis.map(m=>(
          <button key={m.id} onClick={()=>{setTipo(m.id);setVal("");}} className="tap"
            style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,
              border:`2px solid ${tipoValido===m.id?C.pink:C.pinkM}`,
              background:tipoValido===m.id?C.pinkS:C.white,
              cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
            <span style={{fontSize:20,flexShrink:0}}>{m.ico}</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13,fontWeight:800,color:tipoValido===m.id?C.pinkD:C.text}}>{m.label}</div>
              <div style={{fontSize:10,color:C.soft,marginTop:1,lineHeight:1.4}}>{m.sub}</div>
            </div>
          </button>
        ))}
      </div>

      {}
      <FInput
        label={labelInput}
        value={val}
        onChange={setVal}
        type="number"
        min="0"
        placeholder={placeholderInput}
      />

      {}
      {val&&valN>0&&(
        <div style={{marginTop:12,background:"#ECFDF5",border:`1.5px solid ${C.green}30`,borderRadius:12,padding:"12px 13px"}}>
          <div style={{fontSize:11,fontWeight:700,color:C.green,textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}>
            Veja como ficará
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <span style={{fontSize:12,color:C.gray}}>Desconto em cada peça:</span>
            <span style={{fontSize:13,fontWeight:800,color:C.amber}}>-{fmt(descontoUnit)} ({pctDesconto.toFixed(0)}%)</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <span style={{fontSize:12,color:C.gray}}>Novo preço por unidade:</span>
            <span style={{fontSize:13,fontWeight:800,color:C.green}}>{fmt(novoPrecoUnit)}</span>
          </div>
          {multiPeca&&(
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
              <span style={{fontSize:12,color:C.gray}}>Desconto total ({qtd} peças):</span>
              <span style={{fontSize:13,fontWeight:800,color:C.amber}}>-{fmt(descontoUnit*qtd)}</span>

          <div style={{height:1,background:C.green+"22",margin:"6px 0"}}/>

            <span style={{fontSize:16,fontWeight:900,color:C.green}}>{fmt(totalFinal)}</span>
          </div>
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:8,paddingBottom:80,marginTop:14}}>
        <Btn onClick={aplicar} disabled={!val||valN<=0} full>
          <Icon name="check" size={15}/>Aplicar desconto
        </Btn>
        {item.desconto>0&&(
          <Btn onClick={()=>{onSave({...item,precoVenda:item.precoOriginal||item.precoVenda,desconto:0,pctDesconto:0});onClose();}} v="danger" full>
            Remover desconto atual
          </Btn>
        )}
      </div>
    </div>
  );
};

const Dashboard = ({produtos,vendas,clientes,onSetTab}) => {
  const agora = new Date();
  const hoje = agora.toDateString();
  const hora = agora.getHours();
  const saudacao = hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const [showLearn,setShowLearn] = useState(false);

  const vendasHoje = vendas.filter(v=>new Date(v.data).toDateString()===hoje);

  const clientesDevendo = clientes.filter(c=>!c.deleted&&vendas.some(v=>v.clienteId===c.id&&v.pagamento==="fiado"&&!v.fiadoPago));
  const totalFiadoPendente = vendas.filter(v=>v.pagamento==="fiado"&&!v.fiadoPago).reduce((s,v)=>s+v.total,0);

  const aniversariantesSemana = clientes.filter(c=>{
    if(c.deleted||!c.nascimento) return false;
    const [,m,d] = c.nascimento.split("-");
    const nascMes = Number(m), nascDia = Number(d);
