            {l:"Custo",v:fmt(custoTotal),c:C.amber,e:"🏷️",desc:"Quanto você gastou nos produtos"},
            {l:"Lucro",v:fmt(lucroLiquido),c:lucroLiquido>=0?C.green:C.red,e:lucroLiquido>=0?"📈":"⚠️",desc:"Seu lucro real"},
          ].map(r=>(
            <div key={r.l} style={{background:r.c+"0F",border:`1.5px solid ${r.c}22`,borderRadius:13,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:18}}>{r.e}</div>
              <div style={{fontSize:14,fontWeight:900,color:r.c,marginTop:3,lineHeight:1.1}}>{r.v}</div>
              <div style={{fontSize:10,fontWeight:700,color:C.gray,marginTop:2}}>{r.l}</div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div style={{background:`${C.purple}0F`,border:`1.5px solid ${C.purple}22`,borderRadius:12,padding:"10px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,color:C.soft,fontWeight:700}}>MARGEM DE LUCRO</div>
                <div style={{fontSize:20,fontWeight:900,color:C.purple,marginTop:2}}>{margemReceita}%</div>

          </div>
          <div style={{background:`${C.green}0F`,border:`1.5px solid ${C.green}22`,borderRadius:12,padding:"10px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,color:C.soft,fontWeight:700}}>RETORNO SOBRE CUSTO</div>

        {receitaTotal>0&&(
          <div style={{marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:700,color:C.gray,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Para onde foi o dinheiro</div>
            <div style={{height:14,borderRadius:99,overflow:"hidden",display:"flex",background:C.pinkL}}>
              {custoTotal>0&&<div style={{width:`${Math.min(100,(custoTotal/receitaTotal)*100).toFixed(1)}%`,background:C.amber,transition:"width .8s ease"}}/>}
              {lucroLiquido>0&&<div style={{width:`${Math.min(100,(lucroLiquido/receitaTotal)*100).toFixed(1)}%`,background:C.green,transition:"width .8s ease"}}/>}
            </div>
            <div style={{display:"flex",gap:10,marginTop:5}}>
              <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:8,height:8,borderRadius:3,background:C.amber}}/><span style={{fontSize:10,color:C.gray}}>Custo ({((custoTotal/receitaTotal)*100).toFixed(0)}%)</span></div>
              <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:8,height:8,borderRadius:3,background:C.green}}/><span style={{fontSize:10,color:C.gray}}>Lucro ({((Math.max(0,lucroLiquido)/receitaTotal)*100).toFixed(0)}%)</span></div>
            </div>
          </div>
        )}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:4,paddingTop:10,borderTop:`1px solid ${C.pinkS}`}}>
          {[
            {l:"Vendas recebidas",v:vendasRecebidas.length,e:"🛍️"},
            {l:"Valor médio",v:vendasRecebidas.length>0?fmt(receitaTotal/vendasRecebidas.length):"—",e:"🎯"},
            {l:"Descontos que você deu",v:descontoTotal>0?fmt(descontoTotal):"—",e:"🏷️"},
          ].map(r=>(
            <div key={r.l} style={{textAlign:"center"}}>
              <div style={{fontSize:14}}>{r.e}</div>
              <div style={{fontSize:12,fontWeight:900,color:C.pinkD,marginTop:2}}>{r.v}</div>
              <div style={{fontSize:9,color:C.soft}}>{r.l}</div>
            </div>
          ))}
        </div>
      </Card>

      {}
      {(totalAReceber>0||totalFiadoGeralPendente>0)&&(
        <Card style={{border:`2px solid ${C.red}33`,background:"#FFF8F8"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,color:C.red,fontSize:14}}>📝 Dinheiro a receber (fiado em aberto)</div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:900,color:C.red}}>{fmt(totalFiadoGeralPendente)}</div>
              <div style={{fontSize:10,color:C.soft}}>total que ainda não recebeu</div>
            </div>
          </div>

          {}
          {totalAReceber>0&&(
            <>
              <div style={{background:"#FEE2E2",borderRadius:12,padding:"10px 13px",marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,color:"#7F1D1D",fontWeight:700}}>Fiado deste período que ainda não pagaram</span>
                  <Badge color={C.red}>{fmt(totalAReceber)}</Badge>
                </div>
                <div style={{fontSize:11,color:"#7F1D1D"}}>
                  {vendasFiadoPendente.length} venda{vendasFiadoPendente.length!==1?"s":""} · dinheiro que você já gastou nessas vendas: {fmt(custoFiadoPendente)}

              {}
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {vendasFiadoPendente.map(v=>(
                  <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,padding:"8px 0",borderBottom:`1px solid #FEE2E2`}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.clienteNome||"Sem cadastro"}</div>
                      <div style={{fontSize:11,color:C.soft,marginTop:1}}>
                        {new Date(v.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})} · {v.itens?.length||0} item(ns)
                      </div>
                    </div>
                    <span style={{fontSize:13,fontWeight:800,color:C.red,flexShrink:0}}>{fmt(v.total)}</span>
                  </div>
                ))}
              </div>
            </>
          )}

          {totalAReceber===0&&totalFiadoGeralPendente>0&&(
            <div style={{fontSize:12,color:C.gray,textAlign:"center",padding:"6px 0"}}>
              Nenhum fiado pendente neste período — mas há {fmt(totalFiadoGeralPendente)} em aberto no total.
            </div>
          )}

          <div style={{marginTop:10,background:"#FFF1F2",borderRadius:10,padding:"8px 12px"}}>
            <div style={{fontSize:11,color:"#7F1D1D",lineHeight:1.5,fontWeight:600}}>
              ⚠️ Valores de fiado pendente <b>não entram na receita nem no lucro</b> até serem quitados. Quando o cliente pagar, marque como recebido na aba Clientes.
            </div>
          </div>
        </Card>
      )}

      {vendasRecebidas.length===0&&vendasFiadoPendente.length===0&&(
        <div style={{textAlign:"center",padding:"20px 0",color:C.soft}}>
          <div style={{fontSize:38}}>🔍</div>
          <div style={{fontSize:13,fontWeight:600,marginTop:6}}>Nenhuma venda neste período.</div>
          <div style={{fontSize:11,marginTop:3}}>Selecione outro intervalo de datas.</div>
        </div>
      )}

      {}
      <Card style={{padding:13}}>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:4}}>📈 Crescimento do negócio</div>
        <div style={{fontSize:10,color:C.soft,marginBottom:10}}>Histórico completo · toque nas legendas para ativar ou desativar</div>
        <GraficoCrescimento pontos={pontosGrafico}/>
      </Card>

      {}
      {descontoTotal>0&&(
        <Card style={{border:`1.5px solid ${C.amber}28`}}>
          <div style={{fontWeight:800,color:C.amber,fontSize:13,marginBottom:8}}>🏷️ Descontos dados no período</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:13,color:C.text}}>Total de descontos</span>
            <Badge color={C.amber}>{fmt(descontoTotal)}</Badge>
          </div>
          <div style={{fontSize:12,color:C.gray}}>{vendasComDesconto.length} venda{vendasComDesconto.length!==1?"s":""} com desconto de {vendasFiltradas.length} no período</div>
          {vendasComDesconto.length>0&&(
            <div style={{marginTop:8}}>
              {vendasComDesconto.slice(0,3).map(v=>(
                <div key={v.id} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderTop:`1px solid ${C.pinkS}`,fontSize:12}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"65%"}}>{v.clienteNome||"Sem cadastro"} · {new Date(v.data).toLocaleDateString("pt-BR")}</span>
                  <span style={{color:C.amber,fontWeight:700}}>-{fmt(v.desconto)}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {}
      <Card>
        <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>🏆 Produtos mais vendidos</div>
        {maisVendidos.length===0
          ? <p style={{color:C.soft,fontSize:13,margin:0}}>Nenhuma venda neste período.</p>
          : maisVendidos.map(([nome,qtd],i)=>{
              const bp=maisVendidos[0][1]>0?(qtd/maisVendidos[0][1])*100:0;
              return (
                <div key={nome} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:8}}>
                    <div style={{display:"flex",gap:7,alignItems:"center",flex:1,minWidth:0}}>
                      <span style={{fontSize:16,flexShrink:0}}>{medalhas[i]}</span>
                      <span style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nome}</span>
                    </div>
                    <Badge>{qtd} un.</Badge>
                  </div>
                  <div style={{height:6,background:C.pinkL,borderRadius:99,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${bp}%`,background:`linear-gradient(90deg,${C.pink},${C.pinkD})`,borderRadius:99,transition:"width .8s ease"}}/>
                  </div>
                </div>
              );
            })
        }
      </Card>

      {}
      {Object.keys(pagtRes).length>0&&(
        <Card>
          <div style={{fontWeight:800,color:C.pinkD,fontSize:13,marginBottom:10}}>💳 Por forma de pagamento</div>
          {Object.entries(pagtRes).map(([pgt,val])=>(
            <div key={pgt} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${C.pinkS}`}}>
              <span style={{fontSize:13,fontWeight:600}}>{pagtLabels[pgt]||pgt}</span>
              <Badge>{fmt(val)}</Badge>

      <Card style={{background:`linear-gradient(135deg,${C.pinkD},#9D174D)`,border:"none"}}>
        <div style={{color:C.white,fontSize:13,fontWeight:800,marginBottom:6}}>💡 Segredo do sucesso</div>
        <div style={{color:C.pinkM,fontSize:13,lineHeight:1.55}}>
          Comprar bem + precificar certo + atender bem = <strong style={{color:C.white}}>negócio próspero</strong>. Você está construindo isso! 🌸
        </div>
      </Card>
    </div>
  );
};


const BotaoPerigoso = ({label,onConfirm,segundos=10,cor=C.red}) => {
  const [contando,setContando] = useState(false);
  const [restante,setRestante] = useState(segundos);
  const timerRef = useRef(null);

  const iniciar = () => { setContando(true); setRestante(segundos); };
  const cancelar = () => { setContando(false); setRestante(segundos); clearInterval(timerRef.current); };

  useEffect(()=>{
    if(!contando) return;
    timerRef.current = setInterval(()=>{
      setRestante(r=>{
        if(r<=1){ clearInterval(timerRef.current); setContando(false); setRestante(segundos); onConfirm(); return segundos; }
        return r-1;
      });
    },1000);
    return ()=>clearInterval(timerRef.current);
  },[contando]);

  if(!contando) return (
    <button onClick={iniciar} className="tap" style={{width:"100%",padding:"12px",borderRadius:14,background:cor+"18",border:`2px solid ${cor}44`,fontFamily:"inherit",fontWeight:800,fontSize:14,color:cor,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
      <Icon name="trash" size={16} color={cor}/>{label}
    </button>
  );

  const pct = ((segundos-restante)/segundos)*100;
  return (
    <div style={{borderRadius:14,border:`2px solid ${cor}`,overflow:"hidden",background:cor+"08"}}>
      {}

const Backup = ({produtos,clientes,vendas,setProdutos,setClientes,setVendas,onClose}) => {
  const [fase,setFase] = useState("menu");
  const [preview,setPreview] = useState(null);
  const [tipoSucesso,setTipoSucesso] = useState(""); // exportar | importar | apagar
  const [erro,setErro] = useState("");
  const fileRef = useRef();

  const gerarNomeArquivo = () =>
    `juju-store-backup-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`;

  const exportarJSON = (dados, nome) => {
    const blob = new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const exportar = () => {
    exportarJSON({versao:"2.0.0",exportadoEm:new Date().toISOString(),produtos,clientes,vendas}, gerarNomeArquivo());
    setTipoSucesso("exportar");
    setFase("sucesso");
  };

  const lerArquivo = (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const dados = JSON.parse(ev.target.result);
        if(!dados.produtos||!dados.clientes||!dados.vendas) throw new Error("Arquivo inválido ou corrompido.");
        if(!Array.isArray(dados.produtos)||!Array.isArray(dados.clientes)||!Array.isArray(dados.vendas))
          throw new Error("Formato de dados incorreto.");
        setPreview(dados); setFase("preview"); setErro("");
      } catch(e) {
        setErro(e.message||"Não foi possível ler o arquivo. Verifique se é um backup válido.");
        setFase("importando");
      }
    };
    reader.readAsText(file);
  };

  const confirmarImport = () => {
    setProdutos(preview.produtos);
    setClientes(preview.clientes);
    setVendas(preview.vendas);
    setTipoSucesso("importar");
    setFase("sucesso");
  };

  const executarApagar = () => {
    exportarJSON(
      {versao:"1.8.0",exportadoEm:new Date().toISOString(),produtos,clientes,vendas},
      `juju-store-ANTES-DE-APAGAR-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`
    );
    setTimeout(()=>{
      setProdutos([]);
      setClientes([]);
      setVendas([]);
      setTipoSucesso("apagar");
      setFase("sucesso");
    }, 600);
  };

  const fmtData = (iso) => {
    try { return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
    catch { return iso; }
  };

  const totalDados = produtos.filter(p=>!p.deleted).length + clientes.filter(c=>!c.deleted).length + vendas.length;

  return (
    <Modal title="💾 Backup e Restauração" onClose={onClose}>

      {}
      {fase==="menu"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <InfoBox emoji="🛡️" title="Não perca seus dados!" text="Seus dados ficam salvos neste aparelho. Se você trocar de celular ou limpar o navegador, pode perder tudo. Faça um backup e guarde o arquivo!" color={C.pinkD}/>

          {}
          <div style={{background:C.pinkL,borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.pinkD,fontSize:14,marginBottom:4}}>📤 Exportar backup</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:10,lineHeight:1.5}}>
              Salva um arquivo com <b>{produtos.filter(p=>!p.deleted).length}</b> produtos, <b>{clientes.filter(c=>!c.deleted).length}</b> clientes e <b>{vendas.length}</b> vendas.
            </div>
            <Btn onClick={exportar} full><Icon name="check" size={15}/>Baixar backup agora</Btn>
          </div>

          {}
          <div style={{background:"#F0FDF4",border:"1.5px solid #BBF7D0",borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.green,fontSize:14,marginBottom:4}}>📥 Restaurar backup</div>
            <div style={{fontSize:12,color:C.gray,marginBottom:10,lineHeight:1.5}}>
              Selecione um arquivo .json para restaurar seus dados. <b style={{color:C.red}}>Substitui tudo!</b>
            </div>
            <Btn onClick={()=>{setFase("importando");fileRef.current?.click();}} v="ghost" full>
              <Icon name="restore" size={15}/>Selecionar arquivo de backup
            </Btn>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{lerArquivo(e.target.files[0]); e.target.value="";}}/>
          </div>

          {}
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:16,padding:14}}>
            <div style={{fontWeight:800,color:C.red,fontSize:14,marginBottom:4}}>🗑️ Apagar todos os dados</div>
            <div style={{fontSize:12,color:"#7F1D1D",marginBottom:10,lineHeight:1.5}}>
              Remove <b>todos</b> os produtos, clientes e vendas. Um backup é gerado automaticamente antes de apagar — não vai perder nada por acidente!
            </div>
            {totalDados===0
              ? <div style={{fontSize:12,color:C.soft,textAlign:"center",padding:"6px 0"}}>Nenhum dado para apagar.</div>
              : <button onClick={()=>setFase("apagar")} className="tap"
                  style={{width:"100%",padding:"11px",borderRadius:12,background:"#FEE2E2",border:"none",fontFamily:"inherit",fontWeight:800,fontSize:14,color:C.red,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <Icon name="trash" size={16} color={C.red}/>Apagar tudo…
                </button>
            }
          </div>

          <InfoBox emoji="💡" title="Dica importante" text="Faça um backup pelo menos uma vez por semana. Envie o arquivo pelo WhatsApp para você mesma para guardar com segurança." color={C.purple}/>

          <div style={{textAlign:"center",paddingTop:4}}>
            <span style={{fontSize:11,color:C.soft,fontWeight:600}}>Juju Store — versão 2.3.0</span>
          </div>
        </div>
      )}

      {}
      {fase==="importando"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <InfoBox emoji="📁" title="Aguardando arquivo..." text="Selecione o arquivo .json de backup da sua lojinha." color={C.green}/>
          {erro&&(
            <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"12px 14px"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.red,marginBottom:4}}>❌ Erro ao ler arquivo</div>
              <div style={{fontSize:12,color:C.red}}>{erro}</div>
            </div>
          )}
          <Btn onClick={()=>fileRef.current?.click()} full><Icon name="restore" size={15}/>Selecionar arquivo</Btn>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
            onChange={e=>{lerArquivo(e.target.files[0]); e.target.value="";}}/>
          <Btn onClick={()=>{setFase("menu");setErro("");}} v="outline" full>Voltar</Btn>
        </div>
      )}

      {}
      {fase==="preview"&&preview&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{background:"#FFFBEB",border:"1.5px solid #FDE68A",borderRadius:14,padding:"12px 14px"}}>
            <div style={{fontWeight:800,color:"#92400E",fontSize:13,marginBottom:8}}>📋 Prévia do backup</div>
            {[
              {e:"📅",l:"Exportado em",v:fmtData(preview.exportadoEm)},
              {e:"📦",l:"Produtos",v:`${preview.produtos?.length||0} (${preview.produtos?.filter(p=>!p.deleted).length||0} ativos)`},
              {e:"👥",l:"Clientes",v:`${preview.clientes?.length||0} (${preview.clientes?.filter(c=>!c.deleted).length||0} ativos)`},
              {e:"🛍️",l:"Vendas",v:`${preview.vendas?.length||0} registros`},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #FDE68A"}}>
                <span style={{fontSize:12,color:"#78350F"}}>{r.e} {r.l}</span>
                <span style={{fontSize:12,fontWeight:700,color:"#92400E"}}>{r.v}</span>
              </div>
            ))}
          </div>
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:12,padding:"10px 13px"}}>
            <div style={{fontSize:12,fontWeight:800,color:C.red,marginBottom:3}}>⚠️ Atenção!</div>
            <div style={{fontSize:11,color:C.red,lineHeight:1.5}}>Esta ação substitui <b>todos os seus dados atuais</b> pelos dados do backup.</div>
          </div>
          {}
          <BotaoPerigoso
            label="Restaurar este backup"
            cor={C.green}
            onConfirm={confirmarImport}
          />
          <Btn onClick={()=>setFase("menu")} v="outline" full>Cancelar</Btn>
        </div>
      )}

      {}
      {fase==="apagar"&&(
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div style={{textAlign:"center",padding:"8px 0"}}>
            <div style={{fontSize:52,marginBottom:6}}>🗑️</div>
            <div style={{fontSize:16,fontWeight:900,color:C.red,marginBottom:4}}>Apagar todos os dados?</div>
            <div style={{fontSize:13,color:C.gray,lineHeight:1.55}}>Esta ação apaga <b style={{color:C.red}}>tudo</b> permanentemente.</div>
          </div>

          {}
          <div style={{background:"#FEF2F2",border:"1.5px solid #FECACA",borderRadius:14,padding:"12px 14px"}}>
            <div style={{fontWeight:800,color:C.red,fontSize:12,marginBottom:8}}>O que será apagado:</div>
            {[
              {e:"📦",l:"Produtos",v:produtos.filter(p=>!p.deleted).length},
              {e:"👥",l:"Clientes",v:clientes.filter(c=>!c.deleted).length},
              {e:"🛍️",l:"Vendas",v:vendas.length},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #FECACA"}}>
                <span style={{fontSize:12,color:"#7F1D1D"}}>{r.e} {r.l}</span>
                <span style={{fontSize:12,fontWeight:800,color:C.red}}>{r.v} registros</span>
              </div>
            ))}
          </div>

          <div style={{background:"#ECFDF5",border:"1.5px solid #BBF7D0",borderRadius:12,padding:"10px 13px",display:"flex",gap:9,alignItems:"center"}}>
            <span style={{fontSize:20,flexShrink:0}}>✅</span>
            <div style={{fontSize:12,color:"#065F46",lineHeight:1.5,fontWeight:600}}>
              Um backup será baixado automaticamente <b>antes</b> de apagar tudo. Você não vai perder nada por acidente!
            </div>
          </div>

          {}
          <BotaoPerigoso
            label="Apagar tudo e baixar backup"
            cor={C.red}
            segundos={10}
            onConfirm={executarApagar}
          />
          <Btn onClick={()=>setFase("menu")} v="outline" full>Cancelar — voltar</Btn>
        </div>
      )}

      {}
      {fase==="sucesso"&&(
        <div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:60,marginBottom:12,animation:"float 2s ease-in-out infinite"}}>
            {tipoSucesso==="apagar"?"🧹":"✅"}
          </div>
          <div style={{fontSize:17,fontWeight:900,color:tipoSucesso==="apagar"?C.green:C.green,marginBottom:8}}>

          </div>
          <div style={{fontSize:13,color:C.gray,marginBottom:20,lineHeight:1.6}}>

            {tipoSucesso==="apagar"&&"O backup foi baixado antes de apagar. Sua lojinha está zerada e pronta para recomeçar!"}
          </div>
          <Btn onClick={onClose} full>Fechar</Btn>
        </div>
      )}

    </Modal>
  );
};

  return (

          {}
          <div style={{height:3,background:"rgba(255,255,255,.25)",borderRadius:99,marginTop:14}}>
            <div style={{height:"100%",width:`${((passo+1)/total)*100}%`,background:"rgba(255,255,255,.9)",borderRadius:99,transition:"width .4s ease"}}/>

        </div>

        {}
        <div style={{padding:"16px 18px",display:"flex",flexDirection:"column",gap:10}}>

            );
            if(bloco.tipo==="lista") return (
              <div key={i} style={{display:"flex",flexDirection:"column",gap:7,marginTop:4}}>
                {bloco.itens.map((it,j)=>(
                  <div key={j} style={{display:"flex",alignItems:"center",gap:11,background:C.pinkL,borderRadius:13,padding:"10px 13px"}}>

                    <span style={{fontSize:13,fontWeight:700,color:C.pinkD}}>{it.t}</span>
                  </div>
                ))}
              </div>
            );
            if(bloco.tipo==="passo") return (
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#F0FDF4",borderRadius:12,border:`1.5px solid #BBF7D0`}}>

                <span style={{fontSize:13,color:C.gray}}>{bloco.texto}</span>
              </div>
            );
            if(bloco.tipo==="bloco") return (
              <div key={i} style={{background:C.pinkL,borderRadius:13,padding:"11px 13px",borderLeft:`3px solid ${atual.cor}`}}>
                <div style={{fontSize:12,fontWeight:800,color:atual.cor,marginBottom:4}}>{bloco.titulo}</div>
                <div style={{fontSize:12,color:C.text,lineHeight:1.6}}>{bloco.texto}</div>
              </div>
            );
            return null;
          })}

          {}
          {atual.dica&&(
            <div style={{background:`${atual.cor}12`,border:`1.5px solid ${atual.cor}30`,borderRadius:13,padding:"10px 13px"}}>
              <div style={{fontSize:12,color:atual.cor,fontWeight:700,lineHeight:1.55}}>{atual.dica}</div>
            </div>
          )}

          {}
          <div style={{display:"flex",gap:8,marginTop:6}}>
            {passo>0&&(
              <button onClick={()=>setPasso(p=>p-1)} className="tap" style={{flex:1,padding:"11px",borderRadius:14,background:C.pinkL,border:"none",fontFamily:"inherit",fontWeight:700,fontSize:14,color:C.pinkD,cursor:"pointer"}}>

            <button onClick={isUltimo?onClose:()=>setPasso(p=>p+1)} className="tap"

          const active=tab===t.id;
          return (
            <button key={t.id} onClick={()=>setTab(t.id)} className="tap" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 6px",flex:1,minWidth:0,color:active?C.pinkD:C.soft}}>
              <div style={{padding:6,borderRadius:12,background:active?C.pinkS:"transparent",transform:active?"scale(1.1)":"scale(1)",transition:"all .2s"}}>
                <Icon name={t.icon} size={19} color={active?C.pinkD:C.soft}/>
              </div>
              <span style={{fontSize:9,fontWeight:active?800:500}}>{t.label}</span>
            </button>
          );
        })}
      </nav>
      <Celebration data={celebration} onClose={closeCeleb}/>
      {showOnboarding&&<Onboarding onClose={finishOnboarding}/>}
      {showBackup&&(
        <Backup
          produtos={produtos} clientes={clientes} vendas={vendas}
          setProdutos={setProdutos} setClientes={setClientes} setVendas={setVendas}
          onClose={()=>setShowBackup(false)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

  </script>
  <script>
    window.addEventListener('load',()=>{setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),450);}},1800);});
  </script>
</body>
</html>
